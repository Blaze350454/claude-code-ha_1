[project]
name = "esphome-mcp"
version = "0.1.0"
description = "ESPHome documentation search via MCP for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pathlib>=1.0.1",
    "rich>=14.0.0",
    "typer>=0.15.2",
    "typing-extensions>=4.13.2",
    "fastmcp>=2.0.0",
    "sentence-transformers>=3.0.1",
    "torch>=2.0.0",
]

[dependency-groups]
crawler = [
    "crawl4ai>=0.5.0.post8",
]

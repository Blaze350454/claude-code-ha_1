# Fake secrets used only by GitHub Actions CI (frenck/action-home-assistant).
# Real secrets live in secrets.yaml on the VM, which is gitignored.
# Add entries here matching every `!secret <name>` reference in the repo.
some_password: ci_dummy_password
# healthchecks.io dead-man ping URL (packages/system/host_health.yaml). CI-only
# placeholder; the real ping URL lives in secrets.yaml on the VM.
hc_ha_alive_url: https://hc-ping.example/ci-dummy
# Proxmox read-only API token (packages/system/proxmox_backups.yaml). CI-only
# placeholder; the real token lives in secrets.yaml on the VM.
proxmox_api_token: "PVEAPIToken=ha-monitor@pve!ci=00000000-0000-0000-0000-000000000000"
# HA webhook id that the Proxmox host POSTs notifications to
# (packages/system/proxmox_notifications.yaml). CI-only placeholder; the real
# id lives in secrets.yaml on the VM and doubles as the webhook's credential.
proxmox_webhook_id: ci_dummy_proxmox_webhook_id

# ESPHome VM (192.168.2.14) backup-esphome.sh POSTs failures/heartbeats here
# (packages/system/esphome_backup.yaml). CI-only placeholder; the real id lives
# in secrets.yaml on the VM and doubles as the webhook's credential.
esphome_backup_webhook_id: ci_dummy_esphome_backup_webhook_id

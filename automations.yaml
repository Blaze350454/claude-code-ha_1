- id: automation.irrigation_daily_setup
  alias: Irrigation — Daily Setup at Lights On
  description: Resets daily counters, calculates feed schedule, sets next_feed_time
    to first feed
  triggers:
  - platform: time
    at: "15:00:00"
  conditions:
  - condition: state
    entity_id: input_boolean.irrigation_enabled
    state: 'on'
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.current_feed_number
    data:
      value: 0
  - variables:
      lights_on_h: '{{ states(''input_datetime.flower_lights_on_time'')[0:2] | int
        }}'
      lights_on_m: '{{ states(''input_datetime.flower_lights_on_time'')[3:5] | int
        }}'
      lights_off_h: '{{ states(''input_datetime.flower_lights_off_time'')[0:2] | int
        }}'
      lights_off_m: '{{ states(''input_datetime.flower_lights_off_time'')[3:5] | int
        }}'
      today_str: '{{ now().date() | string }}'
      on_total_min: '{{ lights_on_h * 60 + lights_on_m }}'
      off_total_min: '{{ lights_off_h * 60 + lights_off_m }}'
      first_feed_total_min: '{{ on_total_min + 5 }}'
      first_feed_h: '{{ (first_feed_total_min // 60) % 24 }}'
      first_feed_m: '{{ first_feed_total_min % 60 }}'
      first_feed_dt: '{{ today_str ~ '' '' ~ (''0'' ~ (first_feed_h | string))[-2:]
        ~ '':'' ~ (''0'' ~ (first_feed_m | string))[-2:] ~ '':00'' }}'
      lead_min: '{{ states(''input_number.air_stir_lead_minutes'') | int }}'
      pre_start_total: '{{ first_feed_total_min - lead_min }}'
      pre_start_h: '{{ (pre_start_total // 60) % 24 }}'
      pre_start_m: '{{ pre_start_total % 60 }}'
      pre_start_dt: '{{ today_str ~ '' '' ~ (''0'' ~ (pre_start_h | string))[-2:]
        ~ '':'' ~ (''0'' ~ (pre_start_m | string))[-2:] ~ '':00'' }}'
      pre_stop_total: '{{ first_feed_total_min - 5 }}'
      pre_stop_h: '{{ (pre_stop_total // 60) % 24 }}'
      pre_stop_m: '{{ pre_stop_total % 60 }}'
      pre_stop_dt: '{{ today_str ~ '' '' ~ (''0'' ~ (pre_stop_h | string))[-2:] ~
        '':'' ~ (''0'' ~ (pre_stop_m | string))[-2:] ~ '':00'' }}'
      night_delay: '{{ states(''input_number.night_delay_minutes'') | int }}'
      off_plus_delay: '{{ off_total_min + night_delay }}'
      night_start_h: '{{ (off_plus_delay // 60) % 24 }}'
      night_start_m: '{{ off_plus_delay % 60 }}'
      next_day_str: '{{ (now().date() + timedelta(days=1)) | string }}'
      night_start_dt: '{{ (next_day_str if off_plus_delay < on_total_min else today_str)
        ~ '' '' ~ (''0'' ~ (night_start_h | string))[-2:] ~ '':'' ~ (''0'' ~ (night_start_m
        | string))[-2:] ~ '':00'' }}'
      night_stop_total: '{{ lights_on_h * 60 + lights_on_m - 5 }}'
      night_stop_h: '{{ (night_stop_total // 60) % 24 }}'
      night_stop_m: '{{ night_stop_total % 60 }}'
      night_stop_dt: '{{ next_day_str ~ '' '' ~ (''0'' ~ (night_stop_h | string))[-2:]
        ~ '':'' ~ (''0'' ~ (night_stop_m | string))[-2:] ~ '':00'' }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.next_feed_time
    data:
      datetime: '{{ first_feed_dt }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.next_pre_feed_start
    data:
      datetime: '{{ pre_start_dt }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.next_pre_feed_stop
    data:
      datetime: '{{ pre_stop_dt }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.night_cycle_start
    data:
      datetime: '{{ night_start_dt }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.night_cycle_stop
    data:
      datetime: '{{ night_stop_dt }}'
  - variables:
      current_day: '{{ states(''input_number.flush_day_counter'') | int }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ current_day >= 3 }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.flush_day_counter
        data:
          value: 0
    - conditions:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: input_number.increment
        target:
          entity_id: input_number.flush_day_counter
  - action: input_text.set_value
    target:
      entity_id: input_text.irrigation_status
    data:
      value: Idle
  mode: single
- id: automation.irrigation_feed_trigger
  alias: Irrigation — Feed Trigger
  description: Triggers a feed cycle when next_feed_time is reached
  triggers:
  - platform: time
    at: input_datetime.next_feed_time
  conditions:
  - condition: state
    entity_id: input_boolean.irrigation_enabled
    state: 'on'
  actions:
  - action: input_number.increment
    target:
      entity_id: input_number.current_feed_number
  - action: script.run_feed_cycle
  - wait_template: '{{ not is_state(''script.run_feed_cycle'', ''on'') }}'
    timeout: 00:60:00
  - action: script.irrigation_advance_to_next_feed
  mode: single
- id: automation.irrigation_pre_feed_start
  alias: Irrigation — Pre-Feed Air/Stir Start
  description: Starts air/stir alternating at lead time before next feed
  triggers:
  - platform: time
    at: input_datetime.next_pre_feed_start
  conditions:
  - condition: state
    entity_id: input_boolean.irrigation_enabled
    state: 'on'
  - condition: template
    value_template: '{{ states(''input_number.current_feed_number'') | int < states(''input_number.feeds_per_day_2'')
      | int }}'
  actions:
  - action: script.run_alternating
  mode: single
- id: automation.irrigation_pre_feed_stop
  alias: Irrigation — Pre-Feed Air/Stir Stop
  description: Stops air/stir alternating 5 minutes before next feed
  triggers:
  - platform: time
    at: input_datetime.next_pre_feed_stop
  conditions:
  - condition: state
    entity_id: input_boolean.irrigation_enabled
    state: 'on'
  actions:
  - action: script.stop_alternating
  mode: single
- id: automation.irrigation_night_cycle_start
  alias: Irrigation — Night Cycle Start
  description: Starts overnight air/stir alternating after lights-off delay
  triggers:
  - platform: time
    at: input_datetime.night_cycle_start
  conditions:
  - condition: state
    entity_id: input_boolean.irrigation_enabled
    state: 'on'
  actions:
  - action: script.run_alternating
  mode: single
- id: automation.irrigation_night_cycle_stop
  alias: Irrigation — Night Cycle Stop
  description: Stops overnight air/stir alternating 5 minutes before lights-on
  triggers:
  - platform: time
    at: input_datetime.night_cycle_stop
  actions:
  - action: script.stop_alternating
  mode: single
- id: automation.irrigation_lights_off_stop
  alias: Irrigation — Lights Off Cleanup
  description: Stops all irrigation activity at lights-off
  triggers:
  - at: input_datetime.flower_lights_off_time
    trigger: time
  actions:
  - action: script.stop_alternating
  - action: script.turn_off
    target:
      entity_id:
      - script.run_feed_cycle
      - script.run_normal_flush
      - script.run_day3_flush
    data: {}
  - action: switch.turn_off
    target:
      entity_id:
      - switch.feed_pump_irrigation_tent
      - switch.flush_pump_irrigation_tent
      - switch.air_pump_irrigation_tent
      - switch.feed_stir_pump_irrigation_tent
      - switch.flush_stir_pump_irrigation_tent
    data: {}
  - action: valve.close_valve
    target:
      entity_id:
      - valve.feed_valve_irrigation_tent
      - valve.flush_valve_irrigation_tent
      - valve.flush_drain_valve_irrigation_tent
    data: {}
  - action: input_text.set_value
    target:
      entity_id: input_text.irrigation_status
    data:
      value: Idle
  mode: single
- id: '1772302120351'
  alias: Tent Lights Transition
  description: 'Advances transition each day when tent lights go off — reduces light
    period by 1 hour until Flower mode

    '
  triggers:
  - trigger: state
    entity_id: light.chilled
    to: 'off'
    id: light_off
  conditions:
  - condition: state
    entity_id: input_select.growth_stage
    state: Transition
  - condition: state
    entity_id: light.chilled
    state: 'off'
  - condition: state
    entity_id: light.hlg
    state: 'off'
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ transition_day < 6 }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.transition_day_counter
        data:
          value: '{{ transition_day + 1 }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.veg_lights_off_time
        data:
          time: '{{ new_off_time }}'
      - action: persistent_notification.create
        data:
          title: Tent Lights Transition
          message: 'Day {{ transition_day + 1 }} of 6 complete. Tent lights: {{ states(''input_datetime.veg_lights_on_time'')
            }} to {{ new_off_time }} ({{ 18 - (transition_day + 1) }} hours on)

            '
    - conditions:
      - condition: template
        value_template: '{{ transition_day >= 6 }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.growth_stage
        data:
          option: Flower
      - action: input_number.set_value
        target:
          entity_id: input_number.transition_day_counter
        data:
          value: 0
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.veg_lights_off_time
        data:
          time: 06:00:00
      - action: persistent_notification.create
        data:
          title: Tent Lights Transition Complete
          message: 'Transition complete! Tent lights now in Flower mode on 12/12 schedule.

            '
  variables:
    transition_day: '{{ states(''input_number.transition_day_counter'') | int }}'
    new_off_time: "{{ '%02d:%02d:00' | format(\n  (states('input_datetime.veg_lights_off_time').split(':')[0]
      | int - 1) % 24,\n  states('input_datetime.veg_lights_off_time').split(':')[1]
      | int\n) }}\n"
  mode: single
- id: '1772302862266'
  alias: Tent Lights Auto
  description: Controls tent lights on/off based on veg/flower/transition schedule
  triggers:
  - trigger: time_pattern
    minutes: /1
    id: check_lights
  - trigger: state
    entity_id: input_select.growth_stage
    id: stage_change
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: "{%- set stage = states('input_select.growth_stage') -%}\n{%-
          if stage in ['Vegetative', 'Transition'] -%}\n  {%- set on_t = states('input_datetime.veg_lights_on_time')
          -%}\n  {%- set off_t = states('input_datetime.veg_lights_off_time') -%}\n{%-
          else -%}\n  {%- set on_t = states('input_datetime.flower_lights_on_time')
          -%}\n  {%- set off_t = states('input_datetime.flower_lights_off_time') -%}\n{%-
          endif -%}\n{%- set on_m = (on_t.split(':')[0]|int * 60) + on_t.split(':')[1]|int
          -%}\n{%- set off_m = (off_t.split(':')[0]|int * 60) + off_t.split(':')[1]|int
          -%}\n{%- set now_m = now().hour * 60 + now().minute -%}\n{%- if on_m < off_m
          -%}{{ now_m >= on_m and now_m < off_m }}\n{%- else -%}{{ now_m >= on_m or
          now_m < off_m }}\n{%- endif -%}\n"
      - condition: or
        conditions:
        - condition: state
          entity_id: light.hlg
          state: 'off'
        - condition: state
          entity_id: light.chilled
          state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id:
          - light.hlg
          - light.chilled
        data:
          brightness_pct: 100
    - conditions:
      - condition: template
        value_template: "{%- set stage = states('input_select.growth_stage') -%}\n{%-
          if stage in ['Vegetative', 'Transition'] -%}\n  {%- set on_t = states('input_datetime.veg_lights_on_time')
          -%}\n  {%- set off_t = states('input_datetime.veg_lights_off_time') -%}\n{%-
          else -%}\n  {%- set on_t = states('input_datetime.flower_lights_on_time')
          -%}\n  {%- set off_t = states('input_datetime.flower_lights_off_time') -%}\n{%-
          endif -%}\n{%- set on_m = (on_t.split(':')[0]|int * 60) + on_t.split(':')[1]|int
          -%}\n{%- set off_m = (off_t.split(':')[0]|int * 60) + off_t.split(':')[1]|int
          -%}\n{%- set now_m = now().hour * 60 + now().minute -%}\n{%- if on_m < off_m
          -%}{{ now_m < on_m or now_m >= off_m }}\n{%- else -%}{{ now_m < on_m and
          now_m >= off_m }}\n{%- endif -%}\n"
      - condition: or
        conditions:
        - condition: state
          entity_id: light.hlg
          state: 'on'
        - condition: state
          entity_id: light.chilled
          state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.hlg
          - light.chilled
  mode: single
- id: automation.table_drain_pump_control
  alias: Irrigation — Table Drain Pump
  description: Turns on drain pump when table is full, off when empty sensor goes dry
  triggers:
  - trigger: state
    entity_id: binary_sensor.table_drain_full_irrigation_tent
    to: 'on'
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.table_drain_pump_irrigation_tent
    data: {}
  - wait_for_trigger:
    - platform: state
      entity_id: binary_sensor.table_drain_empty_irrigation_tent
      to: 'off'
    timeout:
      minutes: 30
  - action: switch.turn_off
    target:
      entity_id: switch.table_drain_pump_irrigation_tent
    data: {}
  - if:
    - condition: template
      value_template: '{{ wait.timed_out }}'
    then:
    - action: notify.mobile_app_sm_a166w
      data:
        title: Table Drain Alert
        message: Table drain pump ran for 30 minutes but empty sensor never triggered — check pump and sensors.
  mode: single
- id: automation.tplink_service_health_alert
  alias: Alert — TPLink Service Down
  description: Notifies when localhost:8765 health check fails
  triggers:
  - trigger: state
    entity_id: sensor.tplink_service_health
    to: unavailable
    for:
      minutes: 2
  - trigger: numeric_state
    entity_id: sensor.tplink_service_health
    below: 200
    for:
      minutes: 2
  actions:
  - action: notify.mobile_app_sm_a166w
    data:
      title: TPLink Service Down
      message: The TP-Link pump control service on localhost:8765 is not responding — pumps cannot be controlled.
  mode: single

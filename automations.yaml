- id: random_timer_auto
  alias: Random Timer Auto
  description: 'Tap input_button.random_timer_trigger to turn the listed entities
    ON for the delay duration, then OFF. Tap again while running to cancel. Edit entity
    lists and delay below — that''s the only place values live.

    '
  triggers:
  - entity_id: input_button.random_timer_trigger
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: switch.feed_pump_irrigation_tent
        state: 'on'
      sequence:
      - action: switch.turn_off
        target:
          entity_id:
          - switch.feed_pump_irrigation_tent
      - action: script.tent_feed_line_close
      - stop: Cancelled by second tap
  - action: script.tent_feed_line_open
  - action: switch.turn_on
    target:
      entity_id:
      - switch.feed_pump_irrigation_tent
    data: {}
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - action: switch.turn_off
    target:
      entity_id:
      - switch.feed_pump_irrigation_tent
  - action: script.tent_feed_line_close
  mode: restart

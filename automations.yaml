- id: automation.irrigation_maintenance_cycle
  alias: Irrigation — Maintenance Cycle
  description: Runs stir then air every maintenance_interval_minutes. Skips if feed
    is within 60 min or a feed/pre-feed is running.
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: input_boolean.irrigation_enabled
    state: "on"
  - condition: state
    entity_id: input_boolean.alternating_active
    state: "off"
  - condition: not
    conditions:
    - condition: state
      entity_id: script.run_feed_cycle
      state: "on"
    - condition: state
      entity_id: script.run_normal_flush
      state: "on"
    - condition: state
      entity_id: script.run_day3_flush
      state: "on"
  - condition: template
    value_template: >
      {% set next_feed = states("input_datetime.next_feed_time") %}
      {% if next_feed in ["unknown", "unavailable"] %}true
      {% else %}
        {{ (as_timestamp(next_feed) - as_timestamp(now())) > 3600 }}
      {% endif %}
  - condition: template
    value_template: >
      {% set last = state_attr("automation.irrigation_maintenance_cycle", "last_triggered") %}
      {% if last is none %}true
      {% else %}
        {{ (as_timestamp(now()) - as_timestamp(last)) >= (states("input_number.maintenance_interval_minutes") | int * 60) }}
      {% endif %}
  actions:
  - action: switch.turn_on
    target:
      entity_id:
      - switch.feed_stir_pump_irrigation_tent
      - switch.flush_stir_pump_irrigation_tent
  - delay:
      minutes: "{{ states(input_number.maintenance_stir_minutes) | int }}"
  - action: switch.turn_off
    target:
      entity_id:
      - switch.feed_stir_pump_irrigation_tent
      - switch.flush_stir_pump_irrigation_tent
  - delay:
      milliseconds: 500
  - action: switch.turn_on
    target:
      entity_id: switch.air_pump_irrigation_tent
  - delay:
      minutes: "{{ states(input_number.maintenance_air_minutes) | int }}"
  - action: switch.turn_off
    target:
      entity_id: switch.air_pump_irrigation_tent
  mode: single
# Humidity Control — mode-based switching between humidify / dehumidify
# Mode selector: input_select.tent_humidity_mode (Humidify / Dehumidify / Off)
# Fogger smart plug: switch.humidifier
# Fan PWM: fan.grow_tent_one_humidifier_fan_pwm (grow-tent-one ESP32-C3)
# Dehumidifier: humidifier.dehumidifier_tent (Midea, standalone)
# AC dry mode: climate.air_conditioner_tent (Midea, set to 'dry')
# Humidity sensor: sensor.tent_humidity (averaged template)

########## MODE SWITCHING ##########

# When mode changes, shut off the opposing equipment
- id: humidity_mode_changed
  alias: "Humidity - Mode Changed"
  trigger:
    - platform: state
      entity_id: input_select.tent_humidity_mode
  action:
    - choose:
        # Switched to Humidify — shut off dehumidifier + AC dry
        - conditions:
            - condition: state
              entity_id: input_select.tent_humidity_mode
              state: "Humidify"
          sequence:
            - service: humidifier.turn_off
              target:
                entity_id: humidifier.dehumidifier_tent

        # Switched to Dehumidify — shut off humidifier fogger + fan
        - conditions:
            - condition: state
              entity_id: input_select.tent_humidity_mode
              state: "Dehumidify"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.humidifier
            - service: fan.turn_off
              target:
                entity_id: fan.grow_tent_one_humidifier_fan_pwm

        # Switched to Off — shut off everything
        - conditions:
            - condition: state
              entity_id: input_select.tent_humidity_mode
              state: "Off"
          sequence:
            - service: switch.turn_off
              target:
                entity_id: switch.humidifier
            - service: fan.turn_off
              target:
                entity_id: fan.grow_tent_one_humidifier_fan_pwm
            - service: humidifier.turn_off
              target:
                entity_id: humidifier.dehumidifier_tent

########## HUMIDIFY MODE ##########

# Turn ON fogger + fan when RH drops below (target - hysteresis)
- id: humidifier_on
  alias: "Humidifier - Turn On"
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.tent_humidity') | float(0) <
           (states('input_number.humidifier_target_rh') | float(65) -
            states('input_number.humidifier_hysteresis') | float(5)) }}
  condition:
    - condition: state
      entity_id: input_select.tent_humidity_mode
      state: "Humidify"
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.tent_humidity
          state: "unavailable"
        - condition: state
          entity_id: sensor.tent_humidity
          state: "unknown"
    # Safety: block humidifier during flower nights (bud rot prevention)
    - condition: template
      value_template: >
        {% set is_flower = is_state('input_select.grow_tent_growth_stage', 'Flowering') %}
        {% set lights_off = is_state('light.hlg', 'off') %}
        {% set block_on = is_state('input_boolean.flower_night_humidifier_block', 'on') %}
        {{ not (is_flower and lights_off and block_on) }}
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.humidifier
    - service: fan.turn_on
      target:
        entity_id: fan.grow_tent_one_humidifier_fan_pwm
      data:
        percentage: 80

# Turn OFF fogger when RH reaches target, fan runs 1 min extra to push remaining mist
- id: humidifier_off
  alias: "Humidifier - Turn Off"
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.tent_humidity') | float(0) >=
           states('input_number.humidifier_target_rh') | float(65) }}
  condition:
    - condition: state
      entity_id: switch.humidifier
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.humidifier
    - delay: "00:01:00"
    - service: fan.turn_off
      target:
        entity_id: fan.grow_tent_one_humidifier_fan_pwm

# Safety: shut off fogger if reservoir temp exceeds 38°C
- id: humidifier_overheat_shutoff
  alias: "Humidifier - Overheat Shutoff"
  trigger:
    - platform: numeric_state
      entity_id: sensor.grow_tent_one_humidifier_reservoir_temperature
      above: 38
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.humidifier
    - service: fan.turn_off
      target:
        entity_id: fan.grow_tent_one_humidifier_fan_pwm
    - service: notify.persistent_notification
      data:
        title: "Humidifier Overheat"
        message: >
          Fogger shut off — reservoir temperature exceeded 38°C
          ({{ states('sensor.grow_tent_one_humidifier_reservoir_temperature') }}°C).
          Check water level and float valve.

########## DEHUMIDIFY MODE ##########

# Turn ON dehumidifier + AC dry mode when RH rises above target + hysteresis
- id: dehumidifier_on
  alias: "Dehumidifier - Turn On"
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.tent_humidity') | float(0) >
           (states('input_number.humidifier_target_rh') | float(65) +
            states('input_number.humidifier_hysteresis') | float(5)) }}
  condition:
    - condition: state
      entity_id: input_select.tent_humidity_mode
      state: "Dehumidify"
    - condition: not
      conditions:
        - condition: state
          entity_id: sensor.tent_humidity
          state: "unavailable"
        - condition: state
          entity_id: sensor.tent_humidity
          state: "unknown"
  action:
    - service: humidifier.turn_on
      target:
        entity_id: humidifier.dehumidifier_tent

# Turn OFF dehumidifier + AC when RH drops to target
- id: dehumidifier_off
  alias: "Dehumidifier - Turn Off"
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.tent_humidity') | float(0) <=
           states('input_number.humidifier_target_rh') | float(65) }}
  condition:
    - condition: state
      entity_id: humidifier.dehumidifier_tent
      state: "on"
  action:
    - service: humidifier.turn_off
      target:
        entity_id: humidifier.dehumidifier_tent
- id: ac_lights_on_day_mode
  alias: "AC — Lights On (Day Mode)"
  description: >
    When tent lights turn on, set AC to cool mode with day settings
    (temp target, fan speed, direction, wind mode, power mode) from dashboard selectors.
  triggers:
  - trigger: state
    entity_id: light.hlg
    to: "on"
  conditions:
  - condition: state

- id: ac_stage_change_defaults
  alias: "AC — Stage Change Defaults"
  description: >
    When growth stage changes, auto-set day/night temperature targets
    to recommended cannabis values. Other selectors are not changed.
  triggers:
  - trigger: state
    entity_id: input_select.grow_tent_growth_stage
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Seedling
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.tent_day_temp_target
        data:
          value: 23
      - action: input_number.set_value
        target:
          entity_id: input_number.tent_night_temp_target
        data:
          value: 20
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Vegetative
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.tent_day_temp_target
        data:
          value: 25
      - action: input_number.set_value
        target:
          entity_id: input_number.tent_night_temp_target
        data:
          value: 20
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Flowering
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.tent_day_temp_target
        data:
          value: 24
      - action: input_number.set_value
        target:
          entity_id: input_number.tent_night_temp_target
        data:
          value: 19
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Harvest
      sequence:
      - action: climate.set_hvac_mode
        target:
          entity_id: climate.air_conditioner_tent
        data:
          hvac_mode: "off"
  - action: persistent_notification.create
    data:
      title: "AC — Stage Defaults Updated"
      message: >
        Growth stage changed to {{ states('input_select.grow_tent_growth_stage') }}.
        Day target: {{ states('input_number.tent_day_temp_target') }}°C,
        Night target: {{ states('input_number.tent_night_temp_target') }}°C.
  mode: single
- id: ac_overheat_alert
  alias: "AC — Overheat Alert"
  description: >
    If tent temperature stays above 30°C for 5 minutes, activate boost mode
    and send a notification. Turns off boost after 15 min if temp has dropped.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.tent_temperature
    above: 30
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - action: switch.turn_on
    target:
      entity_id: switch.boost_mode_air_conditioner_tent
  - action: persistent_notification.create
    data:
      title: "Tent Overheat Warning"
      message: >
        Tent temperature is {{ states('sensor.tent_temperature') }}°C — above 30°C
        for 5 minutes. Boost mode activated. Check lights, ventilation, and AC.
  - delay:
      minutes: 15
  - condition: numeric_state
    entity_id: sensor.tent_temperature
    below: 29
  - action: switch.turn_off
    target:
      entity_id: switch.boost_mode_air_conditioner_tent
  - action: persistent_notification.create
    data:
      title: "Tent Overheat Resolved"
      message: >
        Temperature back to {{ states('sensor.tent_temperature') }}°C. Boost mode deactivated.
  mode: single

- id: humidity_lights_on_day
  alias: "Humidity — Lights On (Day Target)"
  description: >
    When tent lights turn on, set humidifier_target_rh to the day humidity target.
  triggers:
  - trigger: state
    entity_id: light.hlg
    to: "on"
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.humidifier_target_rh
    data:
      value: "{{ states('input_number.humidity_day_target') | float }}"
  mode: single
- id: humidity_lights_off_night
  alias: "Humidity — Lights Off (Night Target)"
  description: >
    When tent lights turn off, set humidifier_target_rh to the night humidity target.
    Lower night RH helps prevent mold and bud rot.
  triggers:
  - trigger: state
    entity_id: light.hlg
    to: "off"
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.humidifier_target_rh
    data:
      value: "{{ states('input_number.humidity_night_target') | float }}"
  mode: single
- id: humidity_stage_change_defaults
  alias: "Humidity — Stage Change Defaults"
  description: >
    When growth stage changes, auto-set day/night humidity targets to
    recommended cannabis values. User can still override from dashboard.
  triggers:
  - trigger: state
    entity_id: input_select.grow_tent_growth_stage
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Seedling
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.humidity_day_target
        data:
          value: 65
      - action: input_number.set_value
        target:
          entity_id: input_number.humidity_night_target
        data:
          value: 60
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Vegetative
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.humidity_day_target
        data:
          value: 60
      - action: input_number.set_value
        target:
          entity_id: input_number.humidity_night_target
        data:
          value: 55
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Flowering
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.humidity_day_target
        data:
          value: 45
      - action: input_number.set_value
        target:
          entity_id: input_number.humidity_night_target
        data:
          value: 40
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Harvest
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.humidity_day_target
        data:
          value: 45
      - action: input_number.set_value
        target:
          entity_id: input_number.humidity_night_target
        data:
          value: 40
  - action: persistent_notification.create
    data:
      title: "Humidity — Stage Defaults Updated"
      message: >
        Growth stage changed to {{ states('input_select.grow_tent_growth_stage') }}.
        Day RH target: {{ states('input_number.humidity_day_target') }}%,
        Night RH target: {{ states('input_number.humidity_night_target') }}%.
  mode: single

- id: vpd_out_of_range_alert
  alias: "VPD — Out of Range Alert"
  description: >
    Alert when VPD drifts outside the target +/- tolerance for 10 minutes.
    Tells user current VPD, target, and ideal RH to help them adjust.
  triggers:
  - trigger: template
    value_template: >
      {% set vpd = states('sensor.grow_tent_vpd') | float(0) %}
      {% set target = states('sensor.active_vpd_target') | float(1.0) %}
      {% set tol = states('input_number.vpd_tolerance') | float(0.3) %}
      {{ vpd > 0 and (vpd < target - tol or vpd > target + tol) }}
    for:
      minutes: 10
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  - condition: template
    value_template: >
      {{ states('sensor.grow_tent_vpd') not in ['unknown', 'unavailable'] }}
  actions:
  - action: persistent_notification.create
    data:
      title: "VPD Out of Range"
      message: >
        VPD is {{ states('sensor.grow_tent_vpd') }} kPa
        (target: {{ states('sensor.active_vpd_target') }} kPa ± {{ states('input_number.vpd_tolerance') }}).
        Temp: {{ states('sensor.tent_temperature') }}°C,
        RH: {{ states('sensor.tent_humidity') }}%.
        Ideal RH for current temp: {{ states('sensor.vpd_ideal_rh') }}%.
  mode: single
- id: vpd_recovered_alert
  alias: "VPD — Back in Range"
  description: >
    Dismiss VPD alert when VPD returns to target range for 5 minutes.
  triggers:
  - trigger: template
    value_template: >
      {% set vpd = states('sensor.grow_tent_vpd') | float(0) %}
      {% set target = states('sensor.active_vpd_target') | float(1.0) %}
      {% set tol = states('input_number.vpd_tolerance') | float(0.3) %}
      {{ vpd > 0 and vpd >= target - tol and vpd <= target + tol }}
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - action: persistent_notification.create
    data:
      title: "VPD Recovered"
      message: >
        VPD back in range at {{ states('sensor.grow_tent_vpd') }} kPa
        (target: {{ states('sensor.active_vpd_target') }} kPa).
  mode: single
- id: vpd_stage_change_defaults
  alias: "VPD — Stage Change Defaults"
  description: >
    When growth stage changes, auto-set VPD day/night targets to
    recommended cannabis values. User can override from dashboard.
  triggers:
  - trigger: state
    entity_id: input_select.grow_tent_growth_stage
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Seedling
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.vpd_day_target
        data:
          value: 0.6
      - action: input_number.set_value
        target:
          entity_id: input_number.vpd_night_target
        data:
          value: 0.5
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Vegetative
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.vpd_day_target
        data:
          value: 1.0
      - action: input_number.set_value
        target:
          entity_id: input_number.vpd_night_target
        data:
          value: 0.8
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Flowering
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.vpd_day_target
        data:
          value: 1.2
      - action: input_number.set_value
        target:
          entity_id: input_number.vpd_night_target
        data:
          value: 1.0
    - conditions:
      - condition: state
        entity_id: input_select.grow_tent_growth_stage
        state: Harvest
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.vpd_day_target
        data:
          value: 1.2
      - action: input_number.set_value
        target:
          entity_id: input_number.vpd_night_target
        data:
          value: 1.0
  - action: persistent_notification.create
    data:
      title: "VPD — Stage Defaults Updated"
      message: >
        Growth stage changed to {{ states('input_select.grow_tent_growth_stage') }}.
        VPD day target: {{ states('input_number.vpd_day_target') }} kPa,
        VPD night target: {{ states('input_number.vpd_night_target') }} kPa.
  mode: single

- id: safety_flower_night_humidifier_shutoff
  alias: "Safety — Flower Night Humidifier Shutoff"
  description: >
    When lights turn off during Flowering stage, immediately shut off the
    humidifier fogger and fan to prevent bud rot. Only fires if the safety
    block toggle is enabled.
  triggers:
  - trigger: state
    entity_id: light.hlg
    to: "off"
  conditions:
  - condition: state
    entity_id: input_select.grow_tent_growth_stage
    state: Flowering
  - condition: state
    entity_id: input_boolean.flower_night_humidifier_block
    state: "on"
  actions:
  - action: switch.turn_off
    target:
      entity_id: switch.humidifier
  - action: fan.turn_off
    target:
      entity_id: fan.grow_tent_one_humidifier_fan_pwm
  - action: persistent_notification.create
    data:
      title: "Humidifier Blocked — Flower Night"
      message: >
        Lights off during Flowering stage. Humidifier shut off to prevent
        bud rot. Disable 'Block Humidifier During Flower Nights' toggle
        to override this behavior.
  mode: single
- id: safety_flower_night_humidifier_warning
  alias: "Safety — Flower Night Humidity High Warning"
  description: >
    During flower nights, warn if humidity rises above 60% even though
    humidifier is blocked — may need to run dehumidifier.
  triggers:
  - trigger: numeric_state
    entity_id: sensor.tent_humidity
    above: 60
    for:
      minutes: 10
  conditions:
  - condition: state
    entity_id: input_select.grow_tent_growth_stage
    state: Flowering
  - condition: state
    entity_id: light.hlg
    state: "off"
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - action: persistent_notification.create
    data:
      title: "Flower Night — High Humidity Warning"
      message: >
        Humidity is {{ states('sensor.tent_humidity') }}% during flower night.
        Risk of bud rot above 60%. Consider switching to Dehumidify mode
        or increasing ventilation.
  mode: single

- id: fans_lights_on_day
  alias: "Fans — Lights On (Day Mode)"
  description: >
    When lights turn on, set fans according to day toggles.
  triggers:
  - trigger: state
    entity_id: light.hlg
    to: "on"
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.circulation_fans_day
        state: "on"
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.circulation_fans_tent
    default:
    - action: fan.turn_off
      target:
        entity_id: fan.circulation_fans_tent
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.ac_circ_fan_day
        state: "on"
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.ac_circulation_fan
    default:
    - action: fan.turn_off
      target:
        entity_id: fan.ac_circulation_fan
  mode: single
- id: fans_lights_off_night
  alias: "Fans — Lights Off (Night Mode)"
  description: >
    When lights turn off, set fans according to night toggles.
  triggers:
  - trigger: state
    entity_id: light.hlg
    to: "off"
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.circulation_fans_night
        state: "on"
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.circulation_fans_tent
    default:
    - action: fan.turn_off
      target:
        entity_id: fan.circulation_fans_tent
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.ac_circ_fan_night
        state: "on"
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.ac_circulation_fan
    default:
    - action: fan.turn_off
      target:
        entity_id: fan.ac_circulation_fan
  mode: single
- id: fans_climate_active_boost
  alias: "Fans — Boost Circulation During Climate Activity"
  description: >
    Turn on circulation fans when AC or humidifier is actively running,
    to help distribute conditioned air evenly through the tent.
  triggers:
  - trigger: state
    entity_id:
    - climate.air_conditioner_tent
    - switch.humidifier
    - humidifier.dehumidifier_tent
  conditions:
  - condition: state
    entity_id: input_boolean.grow_tent_automation_enabled
    state: "on"
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: template
          value_template: >
            {{ states('climate.air_conditioner_tent') not in ['off', 'unavailable', 'unknown'] }}
        - condition: state
          entity_id: switch.humidifier
          state: "on"
        - condition: state
          entity_id: humidifier.dehumidifier_tent
          state: "on"
      sequence:
      - action: fan.turn_on
        target:
          entity_id: fan.circulation_fans_tent
    default:
    # All climate equipment off — revert to day/night toggle setting
    - choose:
      - conditions:
        - condition: state
          entity_id: light.hlg
          state: "on"
        - condition: state
          entity_id: input_boolean.circulation_fans_day
          state: "off"
        sequence:
        - action: fan.turn_off
          target:
            entity_id: fan.circulation_fans_tent
      - conditions:
        - condition: state
          entity_id: light.hlg
          state: "off"
        - condition: state
          entity_id: input_boolean.circulation_fans_night
          state: "off"
        sequence:
        - action: fan.turn_off
          target:
            entity_id: fan.circulation_fans_tent
  mode: single

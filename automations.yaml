- id: random_timer_auto
  alias: Random Timer Auto
  description: >
    Tap input_button.random_timer_trigger to turn the listed entities ON
    for the delay duration, then OFF. Tap again while running to cancel.
    Edit entity lists and delay below — that's the only place values live.
  mode: restart
  trigger:
    - platform: state
      entity_id: input_button.random_timer_trigger
  condition: []
  action:
    - choose:
        - conditions:
            - condition: state
              entity_id: switch.feed_pump_irrigation_tent
              state: 'on'
          sequence:
            - action: switch.turn_off
              target:
                entity_id:
                  - switch.feed_pump_irrigation_tent
            - action: valve.close_valve
              target:
                entity_id:
                  - valve.feed_valve_irrigation_tent
            - stop: Cancelled by second tap
    - action: switch.turn_on
      target:
        entity_id:
          - switch.feed_pump_irrigation_tent
    - action: valve.open_valve
      target:
        entity_id:
          - valve.feed_valve_irrigation_tent
    - delay:
        minutes: 5
    - action: switch.turn_off
      target:
        entity_id:
          - switch.feed_pump_irrigation_tent
    - action: valve.close_valve
      target:
        entity_id:
          - valve.feed_valve_irrigation_tent

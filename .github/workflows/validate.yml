name: Validate HA Config

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        run: yamllint .

  ha-config-check:
    name: Home Assistant Config Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # configuration.yaml allowlists the absolute path /config/www/timelapse (a real
      # camera-timelapse dir on the VM, gitignored so not in the repo). HA validates
      # allowlist_external_dirs entries are existing directories. The frenck action
      # mounts the repo at /github/workspace and runs --config there, so /config/...
      # can never exist under it — which is why the check could not go green. Instead
      # mount the workspace at /config so the absolute path resolves into the repo,
      # create the dir, drop in CI secrets, then run the same check_config.
      - name: Prepare CI config dir
        run: |
          mkdir -p www/timelapse
          cp ci/fake_secrets.yaml secrets.yaml
      - name: Home Assistant Core Configuration Check
        run: |
          docker run --rm --entrypoint "" \
            -v "${{ github.workspace }}:/config" \
            ghcr.io/home-assistant/home-assistant:2026.5.0 \
            python -m homeassistant --config /config --script check_config

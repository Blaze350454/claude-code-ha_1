# ESPHome Irrigation Controller
# Hardware: ESP32
# Sensors: XKC-Y25 (liquid level), DS18B20 (temperature)
# Valves: US Solid solenoid, US Solid motorized ball, Rainbird

esphome:
  name: irrigation-controller
  friendly_name: Irrigation Controller

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Irrigation-Controller"
    password: !secret ap_password

captive_portal:

# Dallas 1-Wire bus for DS18B20 temperature sensors
one_wire:
  - platform: gpio
    pin: GPIO4  # Change to your data pin (requires 4.7kΩ pull-up resistor)

# =============================================================================
# SENSORS
# =============================================================================

sensor:
  # DS18B20 Temperature Sensors
  # Find addresses by checking ESPHome logs on first boot
  - platform: dallas_temp
    address: 0x0000000000000000  # Replace with actual address from logs
    name: "Reservoir Temperature"
    id: reservoir_temp
    update_interval: 60s

  # - platform: dallas_temp
  #   address: 0x0000000000000000  # Add more sensors as needed
  #   name: "Ambient Temperature"
  #   id: ambient_temp
  #   update_interval: 60s

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

binary_sensor:
  # XKC-Y25 Liquid Level Sensors (Non-contact capacitive)
  # Output is HIGH when liquid is detected
  - platform: gpio
    pin:
      number: GPIO32  # Change to your pin
      mode: INPUT
    name: "Reservoir High Level"
    id: reservoir_high
    device_class: moisture
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

  - platform: gpio
    pin:
      number: GPIO33  # Change to your pin
      mode: INPUT
    name: "Reservoir Low Level"
    id: reservoir_low
    device_class: moisture
    filters:
      - delayed_on: 100ms
      - delayed_off: 100ms

  # Connection status
  - platform: status
    name: "Controller Status"

# =============================================================================
# VALVE CONTROLS
# =============================================================================

switch:
  # US Solid Solenoid Valves (simple on/off)
  - platform: gpio
    pin: GPIO16
    name: "Zone 1 Valve"
    id: zone1_valve
    icon: mdi:valve
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO17
    name: "Zone 2 Valve"
    id: zone2_valve
    icon: mdi:valve
    restore_mode: ALWAYS_OFF

  - platform: gpio
    pin: GPIO18
    name: "Zone 3 Valve"
    id: zone3_valve
    icon: mdi:valve
    restore_mode: ALWAYS_OFF

  # Rainbird Valves
  - platform: gpio
    pin: GPIO19
    name: "Rainbird Zone 1"
    id: rainbird_zone1
    icon: mdi:sprinkler-variant
    restore_mode: ALWAYS_OFF

# US Solid Motorized Ball Valves
# These typically need open/close signals or are 2-wire reversing
# Option 1: Simple 2-wire control (polarity determines direction)
# Option 2: 3-wire with separate open/close signals

# Example for 3-wire motorized ball valve:
# - platform: gpio
#   pin: GPIO25
#   name: "Main Valve Open"
#   id: main_valve_open
#   restore_mode: ALWAYS_OFF
#
# - platform: gpio
#   pin: GPIO26
#   name: "Main Valve Close"
#   id: main_valve_close
#   restore_mode: ALWAYS_OFF

# =============================================================================
# SAFETY AUTOMATIONS (on-device)
# =============================================================================

# Example: Auto-shutoff if reservoir runs low
# interval:
#   - interval: 10s
#     then:
#       - if:
#           condition:
#             binary_sensor.is_off: reservoir_low
#           then:
#             - switch.turn_off: zone1_valve
#             - switch.turn_off: zone2_valve
#             - switch.turn_off: zone3_valve
#             - logger.log: "Emergency shutoff - reservoir low!"

title: AI
# Sandbox dashboard — Claude edits this file directly via the deploy
# pipeline. Cards that prove themselves get copy-pasted into the
# UI-managed Tent dashboard (or wherever else they belong).
views:
  - title: Tools
    path: tools
    icon: mdi:tools
    cards:
      - type: entity
        entity: input_button.random_timer_trigger
        name: Random Timer Trigger
      - type: markdown
        content: >
          Edit entities or delay: **Settings → Automations & Scenes →
          Random Timer Auto → Actions**.

  - title: Irrigation
    path: irrigation
    icon: mdi:watering-can
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: >
              {% macro rel(ts) %}
              {%- set d = as_timestamp(states(ts), 0) - as_timestamp(now()) -%}
              {%- set a = (d | abs) -%}
              {%- set hh = (a // 3600) | int -%}
              {%- set mm = ((a % 3600) // 60) | int -%}
              {%- if states(ts) in ['unknown', 'unavailable', ''] -%}—
              {%- elif d < 0 -%}{{ hh }}h {{ '%02d' | format(mm) }}m ago
              {%- else -%}in {{ hh }}h {{ '%02d' | format(mm) }}m{%- endif -%}
              {% endmacro %}
              <h3 align="center">🌱 Irrigation Schedule</h3>

              **Status:** {{ states('input_text.tent_irrigation_status') }}

              **Last feed:** {{ rel('input_datetime.last_feed_time') }}
              ({{ as_timestamp(states('input_datetime.last_feed_time'), 0)
                   | timestamp_custom('%a %-I:%M %p', true, '—') }})

              **Next feed:** {{ rel('input_datetime.next_feed_time') }}
              ({{ as_timestamp(states('input_datetime.next_feed_time'), 0)
                   | timestamp_custom('%a %-I:%M %p', true, '—') }})
              — feed {{ states('input_number.current_feed_number') | int }}
              of {{ states('input_number.feeds_per_day_2') | int }}

              **Feed res:** {{ state_attr('sensor.feed_level_irrigation_tent', 'level_text') | trim }}
              · **Flush res:** {{ state_attr('sensor.flush_level_irrigation_tent', 'level_text') | trim }}
          - type: entities
            entities:
              - entity: input_boolean.tent_irrigation_enabled
                name: Automation enabled
              - entity: input_number.feeds_per_day_2
                name: Feeds per day
              - entity: sensor.feed_level_irrigation_tent
                name: Feed reservoir
              - entity: sensor.flush_level_irrigation_tent
                name: Flush reservoir

  - title: VPD
    path: vpd
    icon: mdi:chart-scatter-plot
    cards:
      # All-in-one plotly card. Header (title + 3 stat rows) lives inside
      # the chart's top margin via layout.annotations, so there's a single
      # card chrome around the whole thing — no separate markdown card,
      # no <h2> bottom rule, no inline-style stripping by the markdown
      # sanitizer.
      #
      #   Title (white):  VPD — <stage> — Humidity — <mode>
      #   Row 1 (blue):   emoji icons centered over each value column
      #   Row 2 (yellow): targets (temp picks day/night via light.hlg)
      #   Row 3 (lime):   actuals (tolerance column has no actual)
      - type: custom:plotly-graph
        refresh_interval: 30
        hours_to_show: 0
        ha_theme: false
        card_mod:
          style: |
            ha-card {
              background: transparent !important;
              box-shadow: none !important;
              border: none !important;
            }
        layout:
          height: 750
          paper_bgcolor: 'rgba(0,0,0,0)'
          plot_bgcolor: 'rgba(0,0,0,0)'
          font:
            color: '#e6e6e6'
          margin:
            t: 215
            r: 70
            b: 80
            l: 70
          xaxis:
            type: linear
            title: Temperature (°C)
            range: [15, 35]
            dtick: 2
            gridcolor: '#3a3a3a'
            zeroline: false
            showspikes: false
            fixedrange: true
          yaxis:
            type: linear
            title: Relative Humidity (%)
            range: [30, 90]
            dtick: 10
            gridcolor: '#3a3a3a'
            zeroline: false
            showspikes: false
            fixedrange: true
          showlegend: false
          hovermode: closest
          # Header strip. 4 columns share x-paper coords [0.08, 0.36,
          # 0.64, 0.92] — tighter to the plot edges than the default
          # 12.5% inset, so the chart visually fills the width while
          # leaving space in the left margin for "Set"/"Now"
          # row labels (x=-0.02, xanchor: right). Title sits above icons.
          annotations:
            # Title row — centered above the chart
            - xref: paper
              yref: paper
              x: 0.5
              y: 1.40
              xanchor: center
              yanchor: middle
              showarrow: false
              font:
                color: '#e6e6e6'
                size: 20
              text: |
                $ex 'VPD — ' + hass.states['input_select.grow_tent_growth_stage'].state + ' — ' + hass.states['input_select.tent_humidity_mode'].state

            # Row 1 — temp 🌡 (orange), humidity 💧 (blue), VPD (light red), tolerance ± (light green)
            - xref: paper
              yref: paper
              x: 0.08
              y: 1.30
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 32, color: '#ff9500' }
              text: '🌡'
            - xref: paper
              yref: paper
              x: 0.36
              y: 1.30
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 24, color: '#0a84ff' }
              text: '💧'
            - xref: paper
              yref: paper
              x: 0.64
              y: 1.30
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 18, color: '#ff6b6b' }
              text: '<b>VPD</b>'
            - xref: paper
              yref: paper
              x: 0.92
              y: 1.30
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 28, color: '#4ade80' }
              text: '±'

            # Row 2 — "Set" label (left margin) + targets (yellow)
            - xref: paper
              yref: paper
              x: -0.02
              y: 1.20
              xanchor: right
              yanchor: middle
              showarrow: false
              font: { size: 13, color: '#ffd60a' }
              text: 'Set'
            - xref: paper
              yref: paper
              x: 0.08
              y: 1.20
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#ffd60a' }
              text: |
                $ex (hass.states['light.hlg'].state === 'on' ? parseFloat(hass.states['input_number.tent_day_temp_target'].state) : parseFloat(hass.states['input_number.tent_night_temp_target'].state)).toFixed(1) + ' °C'
            - xref: paper
              yref: paper
              x: 0.36
              y: 1.20
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#ffd60a' }
              text: |
                $ex parseFloat(hass.states['input_number.tent_humidifier_target_rh'].state).toFixed(0) + ' %'
            - xref: paper
              yref: paper
              x: 0.64
              y: 1.20
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#ffd60a' }
              text: |
                $ex parseFloat(hass.states['sensor.active_vpd_target'].state).toFixed(2) + ' kPa'
            - xref: paper
              yref: paper
              x: 0.92
              y: 1.20
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#ffd60a' }
              text: |
                $ex '± ' + parseFloat(hass.states['input_number.vpd_tolerance'].state).toFixed(2) + ' kPa'

            # Row 3 — "Now" label (left margin) + actuals (lime green);
            # tolerance column has no actual.
            - xref: paper
              yref: paper
              x: -0.02
              y: 1.10
              xanchor: right
              yanchor: middle
              showarrow: false
              font: { size: 13, color: '#32cd32' }
              text: 'Now'
            - xref: paper
              yref: paper
              x: 0.08
              y: 1.10
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#32cd32' }
              text: |
                $ex parseFloat(hass.states['sensor.tent_average_temperature'].state).toFixed(1) + ' °C'
            - xref: paper
              yref: paper
              x: 0.36
              y: 1.10
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#32cd32' }
              text: |
                $ex parseFloat(hass.states['sensor.tent_average_humidity'].state).toFixed(1) + ' %'
            - xref: paper
              yref: paper
              x: 0.64
              y: 1.10
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#32cd32' }
              text: |
                $ex parseFloat(hass.states['sensor.grow_tent_vpd'].state).toFixed(2) + ' kPa'
            - xref: paper
              yref: paper
              x: 0.92
              y: 1.10
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#32cd32' }
              text: '—'
        entities:
          - entity: ''
            name: Target VPD
            mode: lines
            line:
              color: '#30d158'
              width: 3
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const target = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                if (isNaN(target)) return [];
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - target / svp));
                }
                return ys;
              }
          - entity: ''
            name: '+ tol'
            mode: lines
            line:
              color: '#ff9500'
              width: 1
              dash: dash
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
                if (isNaN(tgt) || isNaN(tol)) return [];
                const v = tgt + tol;
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - v / svp));
                }
                return ys;
              }
          - entity: ''
            name: '− tol'
            mode: lines
            line:
              color: '#ff9500'
              width: 1
              dash: dash
            fill: tonexty
            fillcolor: 'rgba(48,209,88,0.10)'
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
                if (isNaN(tgt) || isNaN(tol)) return [];
                const v = Math.max(0.05, tgt - tol);
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - v / svp));
                }
                return ys;
              }
          - entity: ''
            name: T
            mode: lines
            showlegend: false
            line:
              color: '#888'
              width: 1
              dash: dot
            x: |
              $fn ({hass}) => {
                const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
                return isNaN(t) ? [] : [t, t];
              }
            "y": |
              $fn ({hass}) => [30, 90]
          - entity: ''
            name: RH
            mode: lines
            showlegend: false
            line:
              color: '#888'
              width: 1
              dash: dot
            x: |
              $fn ({hass}) => [15, 35]
            "y": |
              $fn ({hass}) => {
                const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
                return isNaN(r) ? [] : [r, r];
              }
          - entity: ''
            name: Now
            mode: markers
            marker:
              color: '#ff3b30'
              size: 18
              line:
                color: '#ffffff'
                width: 2
            x: |
              $fn ({hass}) => {
                const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
                return isNaN(t) ? [] : [t];
              }
            "y": |
              $fn ({hass}) => {
                const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
                return isNaN(r) ? [] : [r];
              }

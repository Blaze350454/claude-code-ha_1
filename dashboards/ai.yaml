title: AI
# Sandbox dashboard — Claude edits this file directly via the deploy
# pipeline. Cards that prove themselves get copy-pasted into the
# UI-managed Tent dashboard (or wherever else they belong).
views:
  - title: Tools
    path: tools
    icon: mdi:tools
    cards:
      - type: entity
        entity: timer.random_timer
        name: Random Timer

      - type: entities
        title: Setup
        show_header_toggle: false
        entities:
          - entity: input_number.random_timer_minutes
            name: Duration (minutes)
          - entity: group.random_timer_targets
            name: Targets
            secondary_info: last-changed

      - type: button
        name: Start / Stop
        icon: mdi:play-pause
        icon_height: 64px
        entity: script.random_timer_auto
        show_state: false
        tap_action:
          action: perform-action
          perform_action: script.random_timer_auto

      - type: markdown
        content: >
          **Default targets:** feed pump + feed valve. Members of
          `group.random_timer_targets` are defined in YAML (package
          `tent/irrigation/random_timer_auto.yaml`) — ask Claude to swap
          or add members. Mixed switches and valves are supported.

  - title: VPD
    path: vpd
    icon: mdi:chart-scatter-plot
    cards:
      # Quick-glance: current vitals + active stage / target
      - type: glance
        title: Now
        columns: 4
        entities:
          - entity: sensor.tent_average_temperature
            name: Temp
          - entity: sensor.tent_average_humidity
            name: RH
          - entity: sensor.grow_tent_vpd
            name: VPD
          - entity: sensor.active_vpd_target
            name: Target
          - entity: input_select.grow_tent_growth_stage
            name: Stage
          - entity: input_number.vpd_tolerance
            name: Tol
          - entity: input_number.humidifier_target_rh
            name: RH Tgt
          - entity: input_select.tent_humidity_mode
            name: Mode

      # The VPD scatter — temp/RH grid with target curve, tolerance band,
      # crosshair on current point. Definition mirrors
      # docs/lovelace_vpd_plotly.yaml; that file remains a reference
      # snippet for pasting into UI-managed dashboards.
      - type: custom:plotly-graph
        title: VPD Status
        refresh_interval: 30
        hours_to_show: 0
        ha_theme: false
        layout:
          height: 460
          paper_bgcolor: '#1c1c1e'
          plot_bgcolor: '#1c1c1e'
          font:
            color: '#e6e6e6'
          margin:
            t: 30
            r: 20
            b: 80
            l: 70
          xaxis:
            type: linear
            title: Temperature (°C)
            range: [15, 35]
            dtick: 2
            gridcolor: '#3a3a3a'
            zeroline: false
            showspikes: false
            fixedrange: true
          yaxis:
            type: linear
            title: Relative Humidity (%)
            range: [30, 90]
            dtick: 10
            gridcolor: '#3a3a3a'
            zeroline: false
            showspikes: false
            fixedrange: true
          showlegend: true
          legend:
            orientation: h
            y: 1.08
            x: 0
            bgcolor: rgba(0,0,0,0)
          hovermode: closest
          annotations:
            - xref: paper
              yref: paper
              x: 0.02
              y: 0.98
              xanchor: left
              yanchor: top
              showarrow: false
              bgcolor: 'rgba(28,28,30,0.75)'
              bordercolor: '#3a3a3a'
              borderwidth: 1
              borderpad: 6
              font:
                color: '#30d158'
                size: 12
              text: |
                $ex 'Stage: ' + hass.states['input_select.grow_tent_growth_stage'].state + '  •  Target: ' + parseFloat(hass.states['sensor.active_vpd_target'].state).toFixed(2) + ' kPa'
        entities:
          - entity: ''
            name: Target VPD
            mode: lines
            line:
              color: '#30d158'
              width: 3
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const target = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                if (isNaN(target)) return [];
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - target / svp));
                }
                return ys;
              }
          - entity: ''
            name: '+ tol'
            mode: lines
            line:
              color: '#ff9500'
              width: 1
              dash: dash
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
                if (isNaN(tgt) || isNaN(tol)) return [];
                const v = tgt + tol;
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - v / svp));
                }
                return ys;
              }
          - entity: ''
            name: '− tol'
            mode: lines
            line:
              color: '#ff9500'
              width: 1
              dash: dash
            fill: tonexty
            fillcolor: 'rgba(48,209,88,0.10)'
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
                if (isNaN(tgt) || isNaN(tol)) return [];
                const v = Math.max(0.05, tgt - tol);
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - v / svp));
                }
                return ys;
              }
          - entity: ''
            name: T
            mode: lines
            showlegend: false
            line:
              color: '#888'
              width: 1
              dash: dot
            x: |
              $fn ({hass}) => {
                const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
                return isNaN(t) ? [] : [t, t];
              }
            "y": |
              $fn ({hass}) => [30, 90]
          - entity: ''
            name: RH
            mode: lines
            showlegend: false
            line:
              color: '#888'
              width: 1
              dash: dot
            x: |
              $fn ({hass}) => [15, 35]
            "y": |
              $fn ({hass}) => {
                const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
                return isNaN(r) ? [] : [r, r];
              }
          - entity: ''
            name: Now
            mode: markers
            marker:
              color: '#ff3b30'
              size: 18
              line:
                color: '#ffffff'
                width: 2
            x: |
              $fn ({hass}) => {
                const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
                return isNaN(t) ? [] : [t];
              }
            "y": |
              $fn ({hass}) => {
                const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
                return isNaN(r) ? [] : [r];
              }

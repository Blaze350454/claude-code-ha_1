title: AI
# Sandbox dashboard — Claude edits this file directly via the deploy
# pipeline. Cards that prove themselves get copy-pasted into the
# UI-managed Tent dashboard (or wherever else they belong).
views:
  - title: Tools
    path: tools
    icon: mdi:tools
    cards:
      - type: entity
        entity: input_button.random_timer_trigger
        name: Random Timer Trigger
      - type: markdown
        content: >
          Edit entities or delay: **Settings → Automations & Scenes →
          Random Timer Auto → Actions**.

  - title: VPD
    path: vpd
    icon: mdi:chart-scatter-plot
    cards:
      # Header + vitals strip. Replaces the old glance "Now" card.
      #   Title:  VPD — <stage> — Humidity — <mode>
      #   Row 1 (blue):   temp / humidity / VPD / tolerance icons
      #   Row 2 (yellow): targets under each icon
      #   Row 3 (lime):   actuals under each icon (tolerance has no actual)
      # Active temp target switches on light.hlg state (lights-on = day target).
      - type: markdown
        content: |
          ## VPD &mdash; {{ states('input_select.grow_tent_growth_stage') }} &mdash; Humidity &mdash; {{ states('input_select.tent_humidity_mode') }}

          <table style="width:100%; text-align:center; border-collapse:collapse; table-layout:fixed">
            <tr style="color: var(--primary-color); font-size: 28px; line-height: 1.2">
              <td><ha-icon icon="mdi:thermometer"></ha-icon></td>
              <td><ha-icon icon="mdi:water-percent"></ha-icon></td>
              <td><ha-icon icon="mdi:gauge"></ha-icon></td>
              <td><ha-icon icon="mdi:plus-minus-variant"></ha-icon></td>
            </tr>
            <tr style="color: #ffd60a; font-weight: 600">
              <td>{{ ('%.1f' | format(states('input_number.tent_day_temp_target') | float)) if is_state('light.hlg','on') else ('%.1f' | format(states('input_number.tent_night_temp_target') | float)) }} &deg;C</td>
              <td>{{ '%.0f' | format(states('input_number.humidifier_target_rh') | float) }} %</td>
              <td>{{ '%.2f' | format(states('sensor.active_vpd_target') | float) }} kPa</td>
              <td>&plusmn; {{ '%.2f' | format(states('input_number.vpd_tolerance') | float) }} kPa</td>
            </tr>
            <tr style="color: #32cd32; font-weight: 600">
              <td>{{ '%.1f' | format(states('sensor.tent_average_temperature') | float) }} &deg;C</td>
              <td>{{ '%.1f' | format(states('sensor.tent_average_humidity') | float) }} %</td>
              <td>{{ '%.2f' | format(states('sensor.grow_tent_vpd') | float) }} kPa</td>
              <td>&mdash;</td>
            </tr>
          </table>

      # The VPD scatter — temp/RH grid with target curve, tolerance band,
      # crosshair on current point. Definition mirrors
      # docs/lovelace_vpd_plotly.yaml; that file remains a reference
      # snippet for pasting into UI-managed dashboards.
      - type: custom:plotly-graph
        refresh_interval: 30
        hours_to_show: 0
        ha_theme: false
        layout:
          height: 460
          paper_bgcolor: '#1c1c1e'
          plot_bgcolor: '#1c1c1e'
          font:
            color: '#e6e6e6'
          margin:
            t: 30
            r: 20
            b: 80
            l: 70
          xaxis:
            type: linear
            title: Temperature (°C)
            range: [15, 35]
            dtick: 2
            gridcolor: '#3a3a3a'
            zeroline: false
            showspikes: false
            fixedrange: true
          yaxis:
            type: linear
            title: Relative Humidity (%)
            range: [30, 90]
            dtick: 10
            gridcolor: '#3a3a3a'
            zeroline: false
            showspikes: false
            fixedrange: true
          showlegend: false
          hovermode: closest
        entities:
          - entity: ''
            name: Target VPD
            mode: lines
            line:
              color: '#30d158'
              width: 3
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const target = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                if (isNaN(target)) return [];
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - target / svp));
                }
                return ys;
              }
          - entity: ''
            name: '+ tol'
            mode: lines
            line:
              color: '#ff9500'
              width: 1
              dash: dash
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
                if (isNaN(tgt) || isNaN(tol)) return [];
                const v = tgt + tol;
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - v / svp));
                }
                return ys;
              }
          - entity: ''
            name: '− tol'
            mode: lines
            line:
              color: '#ff9500'
              width: 1
              dash: dash
            fill: tonexty
            fillcolor: 'rgba(48,209,88,0.10)'
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
                if (isNaN(tgt) || isNaN(tol)) return [];
                const v = Math.max(0.05, tgt - tol);
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - v / svp));
                }
                return ys;
              }
          - entity: ''
            name: T
            mode: lines
            showlegend: false
            line:
              color: '#888'
              width: 1
              dash: dot
            x: |
              $fn ({hass}) => {
                const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
                return isNaN(t) ? [] : [t, t];
              }
            "y": |
              $fn ({hass}) => [30, 90]
          - entity: ''
            name: RH
            mode: lines
            showlegend: false
            line:
              color: '#888'
              width: 1
              dash: dot
            x: |
              $fn ({hass}) => [15, 35]
            "y": |
              $fn ({hass}) => {
                const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
                return isNaN(r) ? [] : [r, r];
              }
          - entity: ''
            name: Now
            mode: markers
            marker:
              color: '#ff3b30'
              size: 18
              line:
                color: '#ffffff'
                width: 2
            x: |
              $fn ({hass}) => {
                const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
                return isNaN(t) ? [] : [t];
              }
            "y": |
              $fn ({hass}) => {
                const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
                return isNaN(r) ? [] : [r];
              }

title: AI
# Sandbox dashboard — Claude edits this file directly via the deploy
# pipeline. Cards that prove themselves get copy-pasted into the
# UI-managed Tent dashboard (or wherever else they belong).
views:
  - title: Tools
    path: tools
    icon: mdi:tools
    cards:
      - type: entity
        entity: input_button.random_timer_trigger
        name: Random Timer Trigger
      - type: markdown
        content: >
          Edit entities or delay: **Settings → Automations & Scenes →
          Random Timer Auto → Actions**.

  - title: VPD
    path: vpd
    icon: mdi:chart-scatter-plot
    cards:
      # All-in-one plotly card. Header (title + 3 stat rows) lives inside
      # the chart's top margin via layout.annotations, so there's a single
      # card chrome around the whole thing — no separate markdown card,
      # no <h2> bottom rule, no inline-style stripping by the markdown
      # sanitizer.
      #
      #   Title (white):  VPD — <stage> — Humidity — <mode>
      #   Row 1 (blue):   emoji icons centered over each value column
      #   Row 2 (yellow): targets (temp picks day/night via light.hlg)
      #   Row 3 (lime):   actuals (tolerance column has no actual)
      - type: custom:plotly-graph
        refresh_interval: 30
        hours_to_show: 0
        ha_theme: false
        layout:
          height: 600
          paper_bgcolor: '#1c1c1e'
          plot_bgcolor: '#1c1c1e'
          font:
            color: '#e6e6e6'
          margin:
            t: 190
            r: 105
            b: 80
            l: 105
          xaxis:
            type: linear
            title: Temperature (°C)
            range: [15, 35]
            dtick: 2
            gridcolor: '#3a3a3a'
            zeroline: false
            showspikes: false
            fixedrange: true
          yaxis:
            type: linear
            title: Relative Humidity (%)
            range: [30, 90]
            dtick: 10
            gridcolor: '#3a3a3a'
            zeroline: false
            showspikes: false
            fixedrange: true
          showlegend: false
          hovermode: closest
          # Header strip. 4 columns share x-paper coords [0.125, 0.375,
          # 0.625, 0.875]; rows stack via descending y-paper. Title sits
          # above icons. "Target"/"Current" row labels live in the left
          # margin (x slightly negative, xanchor: right).
          annotations:
            # Title row — centered above the chart
            - xref: paper
              yref: paper
              x: 0.5
              y: 1.40
              xanchor: center
              yanchor: middle
              showarrow: false
              font:
                color: '#e6e6e6'
                size: 20
              text: |
                $ex 'VPD — ' + hass.states['input_select.grow_tent_growth_stage'].state + ' — ' + hass.states['input_select.tent_humidity_mode'].state

            # Row 1 — temp 🌡 (orange), humidity 💧 (blue), VPD (light red), tolerance ± (light green)
            - xref: paper
              yref: paper
              x: 0.125
              y: 1.30
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 32, color: '#ff9500' }
              text: '🌡'
            - xref: paper
              yref: paper
              x: 0.375
              y: 1.30
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 24, color: '#0a84ff' }
              text: '💧'
            - xref: paper
              yref: paper
              x: 0.625
              y: 1.30
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 18, color: '#ff6b6b' }
              text: '<b>VPD</b>'
            - xref: paper
              yref: paper
              x: 0.875
              y: 1.30
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 28, color: '#4ade80' }
              text: '±'

            # Row 2 — "Target" label (left margin) + targets (yellow)
            - xref: paper
              yref: paper
              x: -0.025
              y: 1.20
              xanchor: right
              yanchor: middle
              showarrow: false
              font: { size: 13, color: '#ffd60a' }
              text: 'Target'
            - xref: paper
              yref: paper
              x: 0.125
              y: 1.20
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#ffd60a' }
              text: |
                $ex (hass.states['light.hlg'].state === 'on' ? parseFloat(hass.states['input_number.tent_day_temp_target'].state) : parseFloat(hass.states['input_number.tent_night_temp_target'].state)).toFixed(1) + ' °C'
            - xref: paper
              yref: paper
              x: 0.375
              y: 1.20
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#ffd60a' }
              text: |
                $ex parseFloat(hass.states['input_number.humidifier_target_rh'].state).toFixed(0) + ' %'
            - xref: paper
              yref: paper
              x: 0.625
              y: 1.20
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#ffd60a' }
              text: |
                $ex parseFloat(hass.states['sensor.active_vpd_target'].state).toFixed(2) + ' kPa'
            - xref: paper
              yref: paper
              x: 0.875
              y: 1.20
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#ffd60a' }
              text: |
                $ex '± ' + parseFloat(hass.states['input_number.vpd_tolerance'].state).toFixed(2) + ' kPa'

            # Row 3 — "Current" label (left margin) + actuals (lime green);
            # tolerance column has no actual.
            - xref: paper
              yref: paper
              x: -0.025
              y: 1.10
              xanchor: right
              yanchor: middle
              showarrow: false
              font: { size: 13, color: '#32cd32' }
              text: 'Current'
            - xref: paper
              yref: paper
              x: 0.125
              y: 1.10
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#32cd32' }
              text: |
                $ex parseFloat(hass.states['sensor.tent_average_temperature'].state).toFixed(1) + ' °C'
            - xref: paper
              yref: paper
              x: 0.375
              y: 1.10
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#32cd32' }
              text: |
                $ex parseFloat(hass.states['sensor.tent_average_humidity'].state).toFixed(1) + ' %'
            - xref: paper
              yref: paper
              x: 0.625
              y: 1.10
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#32cd32' }
              text: |
                $ex parseFloat(hass.states['sensor.grow_tent_vpd'].state).toFixed(2) + ' kPa'
            - xref: paper
              yref: paper
              x: 0.875
              y: 1.10
              xanchor: center
              yanchor: middle
              showarrow: false
              font: { size: 14, color: '#32cd32' }
              text: '—'
        entities:
          - entity: ''
            name: Target VPD
            mode: lines
            line:
              color: '#30d158'
              width: 3
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const target = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                if (isNaN(target)) return [];
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - target / svp));
                }
                return ys;
              }
          - entity: ''
            name: '+ tol'
            mode: lines
            line:
              color: '#ff9500'
              width: 1
              dash: dash
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
                if (isNaN(tgt) || isNaN(tol)) return [];
                const v = tgt + tol;
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - v / svp));
                }
                return ys;
              }
          - entity: ''
            name: '− tol'
            mode: lines
            line:
              color: '#ff9500'
              width: 1
              dash: dash
            fill: tonexty
            fillcolor: 'rgba(48,209,88,0.10)'
            x: |
              $fn ({hass}) => {
                const xs = [];
                for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
                return xs;
              }
            "y": |
              $fn ({hass}) => {
                const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
                const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
                if (isNaN(tgt) || isNaN(tol)) return [];
                const v = Math.max(0.05, tgt - tol);
                const ys = [];
                for (let t = 15; t <= 35.01; t += 0.25) {
                  const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
                  ys.push(100 * (1 - v / svp));
                }
                return ys;
              }
          - entity: ''
            name: T
            mode: lines
            showlegend: false
            line:
              color: '#888'
              width: 1
              dash: dot
            x: |
              $fn ({hass}) => {
                const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
                return isNaN(t) ? [] : [t, t];
              }
            "y": |
              $fn ({hass}) => [30, 90]
          - entity: ''
            name: RH
            mode: lines
            showlegend: false
            line:
              color: '#888'
              width: 1
              dash: dot
            x: |
              $fn ({hass}) => [15, 35]
            "y": |
              $fn ({hass}) => {
                const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
                return isNaN(r) ? [] : [r, r];
              }
          - entity: ''
            name: Now
            mode: markers
            marker:
              color: '#ff3b30'
              size: 18
              line:
                color: '#ffffff'
                width: 2
            x: |
              $fn ({hass}) => {
                const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
                return isNaN(t) ? [] : [t];
              }
            "y": |
              $fn ({hass}) => {
                const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
                return isNaN(r) ? [] : [r];
              }

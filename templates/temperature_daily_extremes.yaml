# --- Daily temperature extremes (added 2026-07-05) ---
# Today's high/low for the dashboard temperature gauges (shown as
# secondary/tertiary text on the modern-circular-gauge cards). Trigger-based:
# follow the source sensor, reset to the current reading at midnight. An
# unavailable source keeps the last extreme; each sensor is unknown until its
# first reading after creation.
- trigger:
    - trigger: state
      entity_id: sensor.tent_average_temperature
    - trigger: time
      at: "00:00:00"
  sensor:
    - name: "Tent Average Temperature Today Max"
      unique_id: tent_average_temperature_today_max
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer-chevron-up
      state: >
        {% set cur = states('sensor.tent_average_temperature') | float(none) %}
        {% set prev = this.state | float(none) %}
        {% if cur is none %}{{ prev if prev is not none }}
        {% elif trigger.platform == 'time' or prev is none %}{{ cur | round(1) }}
        {% else %}{{ [prev, cur] | max | round(1) }}{% endif %}
    - name: "Tent Average Temperature Today Min"
      unique_id: tent_average_temperature_today_min
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      icon: mdi:thermometer-chevron-down
      state: >
        {% set cur = states('sensor.tent_average_temperature') | float(none) %}
        {% set prev = this.state | float(none) %}
        {% if cur is none %}{{ prev if prev is not none }}
        {% elif trigger.platform == 'time' or prev is none %}{{ cur | round(1) }}
        {% else %}{{ [prev, cur] | min | round(1) }}{% endif %}


- sensor:
    - name: Vapor Pressure Deficit
      unique_id: grow_tent_vpd
      default_entity_id: sensor.grow_tent_vpd
      unit_of_measurement: kPa
      icon: mdi:cloud
      availability: >
        {{ states('sensor.tent_average_temperature') not in ['unknown', 'unavailable']
           and states('sensor.tent_average_humidity') not in ['unknown', 'unavailable'] }}
      state: >
        {# Calculate VPD from temperature and humidity #}
        {% set temp = states('sensor.tent_average_temperature') | float(0) %}
        {% set rh = states('sensor.tent_average_humidity') | float(0) %}
        {% if temp > 0 and rh > 0 %}
          {% set svp = 0.61078 * (2.71828 ** ((17.27 * temp) / (temp + 237.3))) %}
          {% set vpd = svp * (1 - (rh / 100)) %}
          {{ (vpd | float) | round(2) }}
        {% else %}
          unavailable
        {% endif %}

- sensor:
    - name: "Table Drain Level Irrigation Tent"
      unique_id: table_drain_level_irrigation_tent
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:gauge
      state: >
        {% if is_state('binary_sensor.table_drain_full', 'on') %}
          100
        {% elif is_state('binary_sensor.table_drain_empty', 'on') %}
          50
        {% else %}
          0
        {% endif %}
      attributes:
        level_text: >
          {% if is_state('binary_sensor.table_drain_full', 'on') %}
            Full
          {% elif is_state('binary_sensor.table_drain_empty', 'on') %}
            Half
          {% else %}
            Empty
          {% endif %}

# --- Latched feed-time readings (added 2026-06-20) ---
# Flow/pressure sensors read ~0 when pumps are idle. These trigger-based
# template sensors update ONLY while a feed/flush pump is on, so they HOLD the
# last active feed reading at idle -- lets the dashboard show the last
# good/low/high color at a glance even when nothing is running.
- trigger:
    - trigger: state
      entity_id: sensor.flow_rate_irrigation_tent
  condition:
    - condition: template
      value_template: >
        {{ is_state('switch.feed_pump_irrigation_tent', 'on')
           or is_state('switch.flush_pump_irrigation_tent', 'on') }}
  sensor:
    - name: "Last Feed Flow"
      unique_id: last_feed_flow
      unit_of_measurement: "L/min"
      state_class: measurement
      icon: mdi:pulse
      state: "{{ states('sensor.flow_rate_irrigation_tent') | float(0) | round(2) }}"

# Pressure latches got a zombie-latch guard 2026-07-17: since the firmware NAN
# floor, a dead/absent transducer parks its source sensor at `unknown`, the
# reading trigger never fires again, and the latch would hold its last number
# forever (Last Feed Pressure Pre showed a stale 31.5 for weeks). The `dead`
# trigger clears the latch once the source has been non-numeric for 12 h
# straight -- that spans several feeds at the 4/day cadence, so a healthy
# post-reg (which is `unknown` between feeds BY DESIGN, numeric while pumping)
# never trips it. Bump the `for:` if the schedule ever slows below 2 feeds/day.
# The pump-on gate moved from `condition:` into the state template so the dead
# trigger can fire while pumps are off; mid-feed non-numeric blips (post-reg
# dipping under the 0.20 V firmware floor) HOLD the latch instead of wiping it.
- trigger:
    - trigger: state
      entity_id: sensor.pressure_post_regulator_irrigation_tent
      id: reading
    - trigger: state
      entity_id: sensor.pressure_post_regulator_irrigation_tent
      to:
        - unknown
        - unavailable
      for: "12:00:00"
      id: dead
  sensor:
    - name: "Last Feed Pressure Post"
      unique_id: last_feed_pressure_post
      unit_of_measurement: "psi"
      state_class: measurement
      icon: mdi:gauge
      state: >
        {% if trigger.id == 'dead' %}
          {{ none }}
        {% elif (is_state('switch.feed_pump_irrigation_tent', 'on')
                 or is_state('switch.flush_pump_irrigation_tent', 'on'))
                and has_value('sensor.pressure_post_regulator_irrigation_tent') %}
          {{ states('sensor.pressure_post_regulator_irrigation_tent') | float(0) | round(1) }}
        {% else %}
          {{ this.state }}
        {% endif %}

- trigger:
    - trigger: state
      entity_id: sensor.pressure_pre_regulator_irrigation_tent
      id: reading
    - trigger: state
      entity_id: sensor.pressure_pre_regulator_irrigation_tent
      to:
        - unknown
        - unavailable
      for: "12:00:00"
      id: dead
  sensor:
    - name: "Last Feed Pressure Pre"
      unique_id: last_feed_pressure_pre
      unit_of_measurement: "psi"
      state_class: measurement
      icon: mdi:gauge
      state: >
        {% if trigger.id == 'dead' %}
          {{ none }}
        {% elif (is_state('switch.feed_pump_irrigation_tent', 'on')
                 or is_state('switch.flush_pump_irrigation_tent', 'on'))
                and has_value('sensor.pressure_pre_regulator_irrigation_tent') %}
          {{ states('sensor.pressure_pre_regulator_irrigation_tent') | float(0) | round(1) }}
        {% else %}
          {{ this.state }}
        {% endif %}

# --- Reservoir levels: agitation freeze + full-float latch
#     (2026-06-24; stir pumps added as a freeze source 2026-06-25) ---
# Air-stone aeration AND the stir pumps agitate the reservoir surface and bounce
# the float switches mid-burst. A tank is "agitated" while its own stir pump runs,
# or the air pump runs and is routed to it (in dummy-servo mode air reaches BOTH
# tanks, so either tank counts air as agitation). Rule for both tanks:
#   - rising is trusted immediately (a full-float trip can raise to 100, even
#     mid-burst -- the only time a full-but-high-tripping float confirms full);
#   - while the tank is agitated, a FALLING reading is frozen (hold last value);
#   - while it is not agitated, a falling reading is reported as-is (the true
#     highest wet float). The old per-tier "hold until the NEXT float below dries"
#     ladder was dropped 2026-06-28: it latched the level one tier too high during
#     drainage (full float dry but 3/4 still wet held the gauge at 100/Full), which
#     pinned "Full" and tripped block_feed_fill_when_reservoir_full on a tank that
#     was no longer full. The agitation freeze still rejects splash flicker.
- trigger:
    - trigger: state
      entity_id:
        - binary_sensor.feed_full_irrigation_tent
        - binary_sensor.feed_three_quarter_irrigation_tent
        - binary_sensor.feed_half_irrigation_tent
        - binary_sensor.feed_empty_irrigation_tent
        - switch.air_pump_irrigation_tent
        - switch.feed_stir_pump_irrigation_tent
        - select.air_route_irrigation_tent
    - trigger: homeassistant
      event: start
  sensor:
    - name: "Feed Level Irrigation Tent"
      unique_id: feed_level_irrigation_tent
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:gauge
      # UNAVAILABLE, NOT ZERO, WHEN THE ESP32 IS DARK (added 2026-08-04).
      # Without this the state block below reads every float as "not on" when
      # the controller drops, computes raw = 0, and the tank reports 0% /
      # "Empty" — so a power cut looked exactly like a drained reservoir. That
      # fired the dry-reservoir phone alerts, tripped the dashboard DRY banner,
      # and defeated the int(99) offline guard on binary_sensor.feed_reservoir_dry
      # (the guard only ever sees a number, because this sensor always produced
      # one). One float is a sufficient proxy — the whole board drops together,
      # same proxy watchdog_irrigation_critical_offline uses.
      availability: >
        {{ states('binary_sensor.feed_empty_irrigation_tent')
           not in ['unavailable', 'unknown'] }}
      # AGITATION TEST — inverted on purpose (2026-08-16, servo valve went in).
      # A tank is churned by the air pump unless ITS OWN hose is pinched, so this
      # asks "not blocked", never "routed here". Asking "routed here" would be
      # wrong in the idle Both Open state, where the pump feeds BOTH tanks: the
      # freeze would switch off while feed was still being churned, and the
      # surface agitation would false-trip the float ladder — precisely the
      # failure this hysteresis exists to prevent.
      # Fails safe: if the select is unavailable, is_state() returns false, so
      # air_here stays true and a falling reading is frozen rather than believed.
      state: >
        {% set prev = this.state | int(0) %}
        {% set air = is_state('switch.air_pump_irrigation_tent', 'on') %}
        {% set air_here = air and not is_state('select.air_route_irrigation_tent', 'Feed Air Blocked') %}
        {% set agit = air_here or is_state('switch.feed_stir_pump_irrigation_tent', 'on') %}
        {% set full = is_state('binary_sensor.feed_full_irrigation_tent', 'on') %}
        {% set tq = is_state('binary_sensor.feed_three_quarter_irrigation_tent', 'on') %}
        {% set half = is_state('binary_sensor.feed_half_irrigation_tent', 'on') %}
        {% set empty = is_state('binary_sensor.feed_empty_irrigation_tent', 'on') %}
        {% set raw = 100 if full else (75 if tq else (50 if half else (25 if empty else 0))) %}
        {% if raw >= prev %}{{ raw }}
        {% elif agit %}{{ prev }}
        {% else %}{{ raw }}{% endif %}
      attributes:
        level_text: >
          {% set prev = this.state | int(0) %}
          {% set air = is_state('switch.air_pump_irrigation_tent', 'on') %}
          {% set air_here = air and not is_state('select.air_route_irrigation_tent', 'Feed Air Blocked') %}
          {% set agit = air_here or is_state('switch.feed_stir_pump_irrigation_tent', 'on') %}
          {% set full = is_state('binary_sensor.feed_full_irrigation_tent', 'on') %}
          {% set tq = is_state('binary_sensor.feed_three_quarter_irrigation_tent', 'on') %}
          {% set half = is_state('binary_sensor.feed_half_irrigation_tent', 'on') %}
          {% set empty = is_state('binary_sensor.feed_empty_irrigation_tent', 'on') %}
          {% set raw = 100 if full else (75 if tq else (50 if half else (25 if empty else 0))) %}
          {% set lvl = raw if raw >= prev else (prev if agit else raw) %}
          {{ 'Full' if lvl >= 100 else ('3/4' if lvl >= 75 else ('1/2' if lvl >= 50 else ('Low' if lvl >= 25 else 'Empty'))) }}

- trigger:
    - trigger: state
      entity_id:
        - binary_sensor.flush_full_irrigation_tent
        - binary_sensor.flush_half_irrigation_tent
        - binary_sensor.flush_empty_irrigation_tent
        - switch.air_pump_irrigation_tent
        - switch.flush_stir_pump_irrigation_tent
        - select.air_route_irrigation_tent
    - trigger: homeassistant
      event: start
  sensor:
    - name: "Flush Level Irrigation Tent"
      unique_id: flush_level_irrigation_tent
      unit_of_measurement: "%"
      state_class: measurement
      icon: mdi:gauge
      # See the note on Feed Level above — offline must read as "no data", not
      # as an empty tank.
      availability: >
        {{ states('binary_sensor.flush_empty_irrigation_tent')
           not in ['unavailable', 'unknown'] }}
      state: >
        {% set prev = this.state | int(0) %}
        {% set air = is_state('switch.air_pump_irrigation_tent', 'on') %}
        {% set air_here = air and not is_state('select.air_route_irrigation_tent', 'Flush Air Blocked') %}
        {% set agit = air_here or is_state('switch.flush_stir_pump_irrigation_tent', 'on') %}
        {% set full = is_state('binary_sensor.flush_full_irrigation_tent', 'on') %}
        {% set half = is_state('binary_sensor.flush_half_irrigation_tent', 'on') %}
        {% set empty = is_state('binary_sensor.flush_empty_irrigation_tent', 'on') %}
        {% set raw = 100 if full else (50 if half else (25 if empty else 0)) %}
        {% if raw >= prev %}{{ raw }}
        {% elif agit %}{{ prev }}
        {% else %}{{ raw }}{% endif %}
      attributes:
        level_text: >
          {% set prev = this.state | int(0) %}
          {% set air = is_state('switch.air_pump_irrigation_tent', 'on') %}
          {% set air_here = air and not is_state('select.air_route_irrigation_tent', 'Flush Air Blocked') %}
          {% set agit = air_here or is_state('switch.flush_stir_pump_irrigation_tent', 'on') %}
          {% set full = is_state('binary_sensor.flush_full_irrigation_tent', 'on') %}
          {% set half = is_state('binary_sensor.flush_half_irrigation_tent', 'on') %}
          {% set empty = is_state('binary_sensor.flush_empty_irrigation_tent', 'on') %}
          {% set raw = 100 if full else (50 if half else (25 if empty else 0)) %}
          {% set lvl = raw if raw >= prev else (prev if agit else raw) %}
          {{ 'Full' if lvl >= 100 else ('1/2' if lvl >= 50 else ('Low' if lvl >= 25 else 'Empty')) }}

# --- Reservoir-dry flags (added 2026-07-04) ---
# Single definition of "dry" for each tank — every consumer keys off these
# instead of re-testing the level sensor: the dashboard DRY banner, the
# block-feed/flush-when-dry safety automations, and the tent error list.
# Reads the agitation-frozen level sensor (== 0) so stir/air splash can't
# false-trip. int(99) means an unavailable level (ESP offline) is NOT dry —
# controller-offline is its own error. Change what "dry" means HERE and all
# consumers follow.
#
# That int(99) guard was dead code until 2026-08-04: the level sensors above
# never went unavailable, they computed 0 from unavailable floats, so an offline
# controller read as a genuinely empty tank. They now carry an `availability:`
# block, which is what makes this guard do its job.
- binary_sensor:
    - name: "Feed Reservoir Dry"
      unique_id: feed_reservoir_dry
      device_class: problem
      icon: mdi:water-alert
      state: "{{ states('sensor.feed_level_irrigation_tent') | int(99) == 0 }}"
    - name: "Flush Reservoir Dry"
      unique_id: flush_reservoir_dry
      device_class: problem
      icon: mdi:water-alert
      state: "{{ states('sensor.flush_level_irrigation_tent') | int(99) == 0 }}"

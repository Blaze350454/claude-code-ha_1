# --- Daily humidity/pressure extremes (added 2026-07-11) ---
# Today's high/low for the Tent Avg Humidity / Tent Avg Pressure dashboard
# gauges (secondary/tertiary text in the dial), matching the temperature
# extremes in temperature_daily_extremes.yaml. Trigger-based: follow the
# source sensor, reset to the current reading at midnight. An unavailable
# source keeps the last extreme; each sensor is unknown until its first
# reading after creation.
- trigger:
    - trigger: state
      entity_id: sensor.tent_average_humidity
    - trigger: time
      at: "00:00:00"
  sensor:
    - name: "Tent Average Humidity Today Max"
      unique_id: tent_average_humidity_today_max
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      icon: mdi:water-plus
      state: >
        {% set cur = states('sensor.tent_average_humidity') | float(none) %}
        {% set prev = this.state | float(none) %}
        {% if cur is none %}{{ prev if prev is not none }}
        {% elif trigger.platform == 'time' or prev is none %}{{ cur | round(1) }}
        {% else %}{{ [prev, cur] | max | round(1) }}{% endif %}
    - name: "Tent Average Humidity Today Min"
      unique_id: tent_average_humidity_today_min
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      icon: mdi:water-minus
      state: >
        {% set cur = states('sensor.tent_average_humidity') | float(none) %}
        {% set prev = this.state | float(none) %}
        {% if cur is none %}{{ prev if prev is not none }}
        {% elif trigger.platform == 'time' or prev is none %}{{ cur | round(1) }}
        {% else %}{{ [prev, cur] | min | round(1) }}{% endif %}


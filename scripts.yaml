test_write_access:
  alias: Test
  sequence: []
stop_alternating:
  alias: Stop Air/Stir Alternating
  sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.alternating_active
  - action: switch.turn_off
    target:
      entity_id:
      - switch.air_pump_irrigation_tent
      - switch.feed_stir_pump_irrigation_tent
      - switch.flush_stir_pump_irrigation_tent
    data: {}
  mode: single
  icon: mdi:stop
run_alternating:
  alias: Run Air/Stir Alternating
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.alternating_active
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.alternating_active
        state: 'on'
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.air_pump_irrigation_tent
      - action: switch.turn_off
        target:
          entity_id:
          - switch.feed_stir_pump_irrigation_tent
          - switch.flush_stir_pump_irrigation_tent
        data: {}
      - delay:
          minutes: '{{ states(''input_number.air_on_duration_minutes'') | int }}'
      - condition: state
        entity_id: input_boolean.alternating_active
        state: 'on'
      - action: switch.turn_off
        target:
          entity_id: switch.air_pump_irrigation_tent
      - action: switch.turn_on
        target:
          entity_id:
          - switch.feed_stir_pump_irrigation_tent
          - switch.flush_stir_pump_irrigation_tent
        data: {}
      - delay:
          minutes: '{{ states(''input_number.stir_on_duration_minutes'') | int }}'
      - condition: state
        entity_id: input_boolean.alternating_active
        state: 'on'
  mode: restart
  icon: mdi:sync
run_normal_flush:
  alias: Run Normal End Flush
  sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.irrigation_status
    data:
      value: Flushing
  - action: valve.open_valve
    target:
      entity_id:
      - valve.flush_valve_irrigation_tent
    data: {}
  - action: switch.turn_on
    target:
      entity_id:
      - switch.flush_pump_irrigation_tent
    data: {}
  - delay:
      minutes: '{{ states(''input_number.flush_duration_minutes'') | float }}'
  - action: switch.turn_off
    target:
      entity_id:
      - switch.flush_pump_irrigation_tent
    data: {}
  - action: valve.close_valve
    target:
      entity_id:
      - valve.flush_valve_irrigation_tent
    data: {}
  mode: single
  icon: mdi:water-outline
run_day3_flush:
  alias: Run Day 3 Flush Cycle
  sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.irrigation_status
    data:
      value: Deep Flush
  - action: valve.open_valve
    target:
      entity_id:
      - valve.flush_valve_irrigation_tent
    data: {}
  - action: switch.turn_on
    target:
      entity_id:
      - switch.flush_pump_irrigation_tent
    data: {}
  - delay:
      minutes: '{{ states(''input_number.flush_cycle_plant_minutes'') | int }}'
  - action: valve.open_valve
    target:
      entity_id:
      - valve.flush_drain_valve_irrigation_tent
    data: {}
  - delay:
      minutes: '{{ states(''input_number.flush_cycle_drain_minutes'') | int }}'
  - action: switch.turn_off
    target:
      entity_id:
      - switch.flush_pump_irrigation_tent
    data: {}
  - action: valve.close_valve
    target:
      entity_id:
      - valve.flush_valve_irrigation_tent
      - valve.flush_drain_valve_irrigation_tent
    data: {}
  - action: input_number.set_value
    target:
      entity_id: input_number.flush_day_counter
    data:
      value: 0
  mode: single
  icon: mdi:water-sync
run_feed_cycle:
  alias: Run Feed Cycle
  sequence:
  - action: script.stop_alternating
  - action: input_text.set_value
    target:
      entity_id: input_text.irrigation_status
    data:
      value: Feeding
  - action: valve.open_valve
    target:
      entity_id:
      - valve.feed_valve_irrigation_tent
    data: {}
  - action: switch.turn_on
    target:
      entity_id:
      - switch.feed_pump_irrigation_tent
    data: {}
  - delay:
      minutes: '{{ states(''input_number.feed_duration_minutes'') | float }}'
  - action: switch.turn_off
    target:
      entity_id:
      - switch.feed_pump_irrigation_tent
    data: {}
  - action: valve.close_valve
    target:
      entity_id:
      - valve.feed_valve_irrigation_tent
    data: {}
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(''input_number.flush_day_counter'') | int == 3
          and states(''input_number.current_feed_number'') | int >= states(''input_number.feeds_per_day_2'')
          | int }}'
      sequence:
      - action: script.run_day3_flush
    - conditions:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: script.run_normal_flush
  - wait_template: '{{ not is_state(''script.run_day3_flush'', ''on'') and not is_state(''script.run_normal_flush'',
      ''on'') }}'
    timeout: '01:00:00'
  - action: input_text.set_value
    target:
      entity_id: input_text.irrigation_status
    data:
      value: Idle
  mode: single
  icon: mdi:watering-can
irrigation_advance_to_next_feed:
  alias: Advance to Next Feed
  sequence:
  - variables:
      feeds_per_day: '{{ states(''input_number.feeds_per_day_2'') | int }}'
      current_feed: '{{ states(''input_number.current_feed_number'') | int }}'
      lead_minutes: '{{ states(''input_number.air_stir_lead_minutes'') | int }}'
      lights_off_hour: '{{ states(''input_datetime.flower_lights_off_time'')[0:2]
        | int }}'
      lights_off_min: '{{ states(''input_datetime.flower_lights_off_time'')[3:5] |
        int }}'
      lights_on_hour: '{{ states(''input_datetime.flower_lights_on_time'')[0:2] |
        int }}'
      lights_on_min: '{{ states(''input_datetime.flower_lights_on_time'')[3:5] | int
        }}'
      lights_on_duration: '{% set on_m = lights_on_hour | int * 60 + lights_on_min
        | int %}{% set off_m = lights_off_hour | int * 60 + lights_off_min | int %}{%
        if off_m > on_m %}{{ off_m - on_m }}{% else %}{{ (24 * 60 - on_m) + off_m
        }}{% endif %}'
      interval_minutes: '{% set dur = lights_on_duration | int - 35 %}{% if feeds_per_day
        > 1 %}{{ (dur / (feeds_per_day - 1)) | round(0) | int }}{% else %}{{ dur |
        int }}{% endif %}'
      next_feed_num: '{{ current_feed + 1 }}'
      next_feed_offset: '{{ 5 + (next_feed_num - 1) * interval_minutes | int }}'
      next_feed_dt: '{% set base_date = now().date() | string %}{% set on_h = lights_on_hour
        | int %}{% set on_m_val = lights_on_min | int %}{% set total_min = on_h *
        60 + on_m_val + next_feed_offset | int %}{% set h = (total_min // 60) % 24
        %}{% set m = total_min % 60 %}{% if total_min >= 24 * 60 %}{% set next_date
        = (now().date() + timedelta(days=1)) | string %}{{ next_date ~ '' '' ~ ''%02d:%02d:00''
        | format(h, m) }}{% else %}{{ base_date ~ '' '' ~ ''%02d:%02d:00'' | format(h,
        m) }}{% endif %}'
  - if:
    - condition: template
      value_template: '{{ next_feed_num <= feeds_per_day }}'
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_feed_time
      data:
        datetime: '{{ next_feed_dt }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_pre_feed_start
      data:
        datetime: '{{ (strptime(next_feed_dt, ''%Y-%m-%d %H:%M:%S'') - timedelta(minutes=lead_minutes
          | int)) | string }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_pre_feed_stop
      data:
        datetime: '{{ (strptime(next_feed_dt, ''%Y-%m-%d %H:%M:%S'') - timedelta(minutes=5))
          | string }}'
    else:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_feed_time
      data:
        datetime: '{{ (now().date() + timedelta(days=1)) | string ~ '' 15:30:00'' }}'
  mode: single
  icon: mdi:skip-next

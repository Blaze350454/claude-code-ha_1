test_write_access:
  alias: Test
  sequence: []

stop_alternating:
  alias: Stop Air/Stir Alternating
  sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.alternating_active
  - action: switch.turn_off
    target:
      entity_id:
      - switch.air_pump_irrigation_tent
      - switch.feed_stir_pump_irrigation_tent
      - switch.flush_stir_pump_irrigation_tent
    data: {}
  mode: single
  icon: mdi:stop

run_night_pulse:
  alias: Run Night Pulse Sequence
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.alternating_active
  - action: switch.turn_on
    target:
      entity_id:
      - switch.feed_stir_pump_irrigation_tent
      - switch.flush_stir_pump_irrigation_tent
  - delay:
      minutes: "{{ states('input_number.night_pulse_stir_pre_minutes') | int }}"
  - action: switch.turn_off
    target:
      entity_id:
      - switch.feed_stir_pump_irrigation_tent
      - switch.flush_stir_pump_irrigation_tent
  - delay:
      milliseconds: 500
  - action: switch.turn_on
    target:
      entity_id: switch.air_pump_irrigation_tent
  - delay:
      minutes: "{{ states('input_number.night_pulse_air_minutes') | int }}"
  - action: switch.turn_off
    target:
      entity_id: switch.air_pump_irrigation_tent
  - delay:
      milliseconds: 500
  - action: switch.turn_on
    target:
      entity_id:
      - switch.feed_stir_pump_irrigation_tent
      - switch.flush_stir_pump_irrigation_tent
  - delay:
      minutes: "{{ states('input_number.night_pulse_stir_post_minutes') | int }}"
  - action: switch.turn_off
    target:
      entity_id:
      - switch.feed_stir_pump_irrigation_tent
      - switch.flush_stir_pump_irrigation_tent
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.alternating_active
  mode: single
  icon: mdi:weather-night

# Level-sized stir for one reservoir. Duration scales with the float level
# (rounded UP to the next float) so a fuller tank gets a longer stir:
#   minutes = (rounded_volume_L / stir_pump_lpm) * turnover  [floored 0.5, capped 15]
# Stamps that tank's last_*_service anchor for the baseline deficit/credit logic.
tent_stir_burst:
  alias: Tent Stir Burst (level-sized)
  mode: parallel
  max: 2
  fields:
    tank:
      description: "Which reservoir: feed or flush"
      required: true
      example: feed
      selector:
        select:
          options:
            - feed
            - flush
    turnover:
      description: Tank turnovers to deliver
      required: false
      default: 1
      selector:
        number:
          min: 0.25
          max: 3
          step: 0.25
          mode: box
  sequence:
    - variables:
        stir_entity: "{{ 'switch.flush_stir_pump_irrigation_tent' if tank == 'flush' else 'switch.feed_stir_pump_irrigation_tent' }}"
        service_dt_entity: "{{ 'input_datetime.last_flush_service' if tank == 'flush' else 'input_datetime.last_feed_service' }}"
        stir_minutes: >-
          {% if tank == 'flush' %}
            {% set lvl = states('sensor.flush_level_irrigation_tent') | int(0) %}
            {% set frac = 0.25 if lvl < 25 else (0.5 if lvl < 50 else 1.0) %}
            {% set cap = states('input_number.flush_reservoir_liters') | float(76) %}
          {% else %}
            {% set lvl = states('sensor.feed_level_irrigation_tent') | int(0) %}
            {% set frac = 0.25 if lvl < 25 else (0.5 if lvl < 50 else (0.75 if lvl < 75 else 1.0)) %}
            {% set cap = states('input_number.feed_reservoir_liters') | float(95) %}
          {% endif %}
          {% set lpm = states('input_number.stir_pump_lpm') | float(25) %}
          {% set turn = turnover | float(1) %}
          {% set mins = (frac * cap / lpm) * turn %}
          {{ [[mins, 0.5] | max, 15] | min | round(2) }}
    - action: switch.turn_on
      target:
        entity_id: "{{ stir_entity }}"
    - delay:
        seconds: "{{ (stir_minutes | float * 60) | round | int }}"
    - action: switch.turn_off
      target:
        entity_id: "{{ stir_entity }}"
    - action: input_datetime.set_datetime
      target:
        entity_id: "{{ service_dt_entity }}"
      data:
        datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  icon: mdi:rotate-3d-variant

run_feed_cycle:
  alias: Run Feed Cycle
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.feed_empty_irrigation_tent
      state: 'off'
    then:
    - action: notify.mobile_app_sm_a166w
      data:
        title: Feed Blocked — Reservoir Dry
        message: Feed cycle blocked. Feed reservoir is dry. Refill before next feed.
    - stop: "Feed reservoir dry"
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.last_feed_time
    data:
      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
  - action: script.stop_alternating
  - variables:
      is_last_feed: >
        {{ states('input_number.current_feed_number') | int
           >= states('input_number.feeds_per_day_2') | int }}
      is_flush_day: >
        {{ states('input_number.tent_irrigation_day_counter') | int
           >= states('input_number.daily_flush_day_interval') | int }}
      flush_dry: "{{ is_state('binary_sensor.flush_empty_irrigation_tent', 'off') }}"
      feed_minutes: "{{ states('input_number.feed_duration_minutes') | float }}"
      clear_minutes: "{{ states('input_number.daily_flush_duration') | float }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ is_last_feed and is_flush_day and not flush_dry }}"
      sequence:
      - if:
        - condition: template
          value_template: "{{ feed_minutes > clear_minutes }}"
        then:
        - action: input_text.set_value
          target:
            entity_id: input_text.tent_irrigation_status
          data:
            value: Feeding
        - action: valve.open_valve
          target:
            entity_id: valve.feed_valve_irrigation_tent
        - action: switch.turn_on
          target:
            entity_id: switch.feed_pump_irrigation_tent
        - delay:
            minutes: "{{ feed_minutes - clear_minutes }}"
        - action: switch.turn_off
          target:
            entity_id: switch.feed_pump_irrigation_tent
        - action: valve.close_valve
          target:
            entity_id: valve.feed_valve_irrigation_tent
      # Homogenize the flush reservoir (pH Down stratifies) right before line clear
      - action: script.tent_stir_burst
        data:
          tank: flush
          turnover: "{{ states('input_number.stir_turnover_prefeed') | float(0.5) }}"
      - action: valve.open_valve
        target:
          entity_id: valve.flush_valve_irrigation_tent
      - action: input_text.set_value
        target:
          entity_id: input_text.tent_irrigation_status
        data:
          value: Clearing Lines
      - action: switch.turn_on
        target:
          entity_id: switch.flush_pump_irrigation_tent
      - delay:
          minutes: "{{ clear_minutes }}"
      - action: valve.open_valve
        target:
          entity_id: valve.flush_drain_valve_irrigation_tent
      - delay:
          seconds: 5
      - action: valve.close_valve
        target:
          entity_id: valve.flush_drain_valve_irrigation_tent
      - action: switch.turn_off
        target:
          entity_id: switch.flush_pump_irrigation_tent
      - action: valve.close_valve
        target:
          entity_id: valve.flush_valve_irrigation_tent
      - action: input_number.set_value
        target:
          entity_id: input_number.tent_irrigation_day_counter
        data:
          value: 0
    - conditions:
      - condition: template
        value_template: "{{ is_last_feed and is_flush_day and flush_dry }}"
      sequence:
      - action: notify.mobile_app_sm_a166w
        data:
          title: Flush Blocked — Reservoir Dry
          message: Line clear skipped — flush reservoir is dry. Running feed-only; will retry tomorrow once refilled.
      - action: input_text.set_value
        target:
          entity_id: input_text.tent_irrigation_status
        data:
          value: Feeding
      - action: valve.open_valve
        target:
          entity_id: valve.feed_valve_irrigation_tent
      - action: switch.turn_on
        target:
          entity_id: switch.feed_pump_irrigation_tent
      - delay:
          minutes: "{{ feed_minutes }}"
      - action: switch.turn_off
        target:
          entity_id: switch.feed_pump_irrigation_tent
      - action: valve.close_valve
        target:
          entity_id: valve.feed_valve_irrigation_tent
      # Hold counter at (interval - 1) so tomorrow's daily_setup increment
      # makes tomorrow another flush-day attempt. Without this the counter
      # would drift higher each day until the daily_setup safety net at
      # interval*2 catches it (would delay the actual flush by ~interval*2
      # days from when reservoir gets refilled).
      - action: input_number.set_value
        target:
          entity_id: input_number.tent_irrigation_day_counter
        data:
          value: "{{ (states('input_number.daily_flush_day_interval') | int) - 1 }}"
    default:
    - action: input_text.set_value
      target:
        entity_id: input_text.tent_irrigation_status
      data:
        value: Feeding
    - action: valve.open_valve
      target:
        entity_id: valve.feed_valve_irrigation_tent
    - action: switch.turn_on
      target:
        entity_id: switch.feed_pump_irrigation_tent
    - delay:
        minutes: "{{ feed_minutes }}"
    - action: switch.turn_off
      target:
        entity_id: switch.feed_pump_irrigation_tent
    - action: valve.close_valve
      target:
        entity_id: valve.feed_valve_irrigation_tent
  - action: input_text.set_value
    target:
      entity_id: input_text.tent_irrigation_status
    data:
      value: Idle
  mode: single
  icon: mdi:watering-can

tent_irrigation_advance_to_next_feed:
  alias: Advance to Next Feed
  sequence:
  - variables:
      feeds_per_day: '{{ states(''input_number.feeds_per_day_2'') | int }}'
      current_feed: '{{ states(''input_number.current_feed_number'') | int }}'
      lead_minutes: '{{ states(''input_number.pre_feed_lead_minutes'') | int(7) }}'
      lights_off_hour: '{{ states(''input_datetime.veg_lights_off_time'')[0:2] | int }}'
      lights_off_min: '{{ states(''input_datetime.veg_lights_off_time'')[3:5] | int }}'
      lights_on_hour: '{{ states(''input_datetime.veg_lights_on_time'')[0:2] | int }}'
      lights_on_min: '{{ states(''input_datetime.veg_lights_on_time'')[3:5] | int }}'
      lights_on_duration: >
        {% set on_m = lights_on_hour | int * 60 + lights_on_min | int %}
        {% set off_m = lights_off_hour | int * 60 + lights_off_min | int %}
        {% if off_m > on_m %}{{ off_m - on_m }}{% else %}{{ (24 * 60 - on_m) + off_m }}{% endif %}
      interval_minutes: >
        {% set dur = lights_on_duration | int - 35 %}
        {% if feeds_per_day > 1 %}{{ (dur / (feeds_per_day - 1)) | round(0) | int }}{% else %}{{ dur | int }}{% endif %}
      next_feed_num: '{{ current_feed + 1 }}'
      next_feed_offset: '{{ 5 + (next_feed_num - 1) * interval_minutes | int }}'
      next_feed_dt: >
        {% set base_date = now().date() | string %}
        {% set on_h = lights_on_hour | int %}
        {% set on_m_val = lights_on_min | int %}
        {% set total_min = on_h * 60 + on_m_val + next_feed_offset | int %}
        {% set h = (total_min // 60) % 24 %}
        {% set m = total_min % 60 %}
        {% if total_min >= 24 * 60 %}
          {% set next_date = (now().date() + timedelta(days=1)) | string %}
          {{ next_date ~ ' ' ~ '%02d:%02d:00' | format(h, m) }}
        {% else %}
          {{ base_date ~ ' ' ~ '%02d:%02d:00' | format(h, m) }}
        {% endif %}
  - if:
    - condition: template
      value_template: '{{ next_feed_num <= feeds_per_day }}'
    then:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_feed_time
      data:
        datetime: '{{ next_feed_dt }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_pre_feed_start
      data:
        datetime: '{{ (strptime(next_feed_dt, ''%Y-%m-%d %H:%M:%S'') - timedelta(minutes=lead_minutes | int)) | string }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_pre_feed_stop
      data:
        datetime: '{{ (strptime(next_feed_dt, ''%Y-%m-%d %H:%M:%S'') - timedelta(minutes=states(''input_number.feed_settle_minutes'') | float(3))) | string }}'
    else:
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_feed_time
      data:
        datetime: >
          {% set on_total = lights_on_hour | int * 60 + lights_on_min | int + 5 %}
          {% set h = (on_total // 60) % 24 %}
          {% set m = on_total % 60 %}
          {{ (now().date() + timedelta(days=1)) | string ~ ' ' ~ '%02d:%02d:00' | format(h, m) }}
  mode: single
  icon: mdi:skip-next

# Manual end-of-day plant flush: pushes flush-reservoir water through the lines to
# the plants for "Flush Now Duration" (input_number.flush_now_duration) minutes, OR until
# the flush reservoir runs dry, whichever comes first. Triggered by the "Flush Now"
# dashboard button. Independent of the automated in-feed daily flush (daily_flush_duration).
run_flush_now:
  alias: Run Flush Now
  # restart mode = the Flush Now button toggles: a second press while flushing
  # restarts the script, which hits the cancel branch below and shuts off.
  mode: restart
  icon: mdi:water-sync
  sequence:
  # --- Toggle OFF: already flushing -> stop pump, close valve, cancel timer ---
  - if:
    - condition: state
      entity_id: input_boolean.flush_now_running
      state: 'on'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.flush_pump_irrigation_tent
    - action: valve.close_valve
      target:
        entity_id: valve.flush_valve_irrigation_tent
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.flush_now_running
    - action: input_text.set_value
      target:
        entity_id: input_text.tent_irrigation_status
      data:
        value: Idle
    - stop: "Flush cancelled by user"
  # --- Start guards ---
  - if:
    - condition: state
      entity_id: script.run_feed_cycle
      state: 'on'
    then:
    - action: notify.mobile_app_sm_a166w
      data:
        title: Flush Blocked — Feed Running
        message: A feed cycle is in progress. Wait for it to finish before flushing.
    - stop: "Feed in progress"
  - if:
    - condition: state
      entity_id: binary_sensor.flush_empty_irrigation_tent
      state: 'off'
    then:
    - action: notify.mobile_app_sm_a166w
      data:
        title: Flush Blocked — Reservoir Dry
        message: Flush reservoir is empty. Refill before flushing.
    - stop: "Flush reservoir dry"
  # --- Run the flush ---
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.flush_now_running
  - action: input_text.set_value
    target:
      entity_id: input_text.tent_irrigation_status
    data:
      value: Flushing
  - action: valve.open_valve
    target:
      entity_id: valve.flush_valve_irrigation_tent
  - action: switch.turn_on
    target:
      entity_id: switch.flush_pump_irrigation_tent
  # Run until the flush reservoir empties (float reads dry) or the duration elapses.
  - wait_template: "{{ is_state('binary_sensor.flush_empty_irrigation_tent', 'off') }}"
    timeout: "{{ (states('input_number.flush_now_duration') | float(15) * 60) | round | int }}"
    continue_on_timeout: true
  - action: switch.turn_off
    target:
      entity_id: switch.flush_pump_irrigation_tent
  - action: valve.close_valve
    target:
      entity_id: valve.flush_valve_irrigation_tent
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.flush_now_running
  - action: input_text.set_value
    target:
      entity_id: input_text.tent_irrigation_status
    data:
      value: Idle

# --- AUTOMATIONS ---


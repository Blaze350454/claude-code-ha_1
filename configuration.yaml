# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include_dir_merge_list templates/

command_line:
  - switch:
      name: HS300 Switch 1
      unique_id: hs300_switch_1
      command_on: "curl -s -X POST http://localhost:8765/switch/Kasa_Smart%20Plug_C074_1/on"
      command_off: "curl -s -X POST http://localhost:8765/switch/Kasa_Smart%20Plug_C074_1/off"
  - switch:
      name: HS300 Switch 2
      unique_id: hs300_switch_2
      command_on: "curl -s -X POST http://localhost:8765/switch/Plug%202/on"
      command_off: "curl -s -X POST http://localhost:8765/switch/Plug%202/off"
  - switch:
      name: HS300 Switch 3
      unique_id: hs300_switch_3
      command_on: "curl -s -X POST http://localhost:8765/switch/Plug%203/on"
      command_off: "curl -s -X POST http://localhost:8765/switch/Plug%203/off"
  - switch:
      name: HS300 Switch 4
      unique_id: hs300_switch_4
      command_on: "curl -s -X POST http://localhost:8765/switch/Kasa_Smart%20Plug_C074_4/on"
      command_off: "curl -s -X POST http://localhost:8765/switch/Kasa_Smart%20Plug_C074_4/off"
  - switch:
      name: HS300 Switch 5
      unique_id: hs300_switch_5
      command_on: "curl -s -X POST http://localhost:8765/switch/Plug%205/on"
      command_off: "curl -s -X POST http://localhost:8765/switch/Plug%205/off"
  - switch:
      name: HS300 Switch 6
      unique_id: hs300_switch_6
      command_on: "curl -s -X POST http://localhost:8765/switch/Plug%206/on"
      command_off: "curl -s -X POST http://localhost:8765/switch/Plug%206/off"
  - sensor:
      name: "TPLink Service Health"
      unique_id: tplink_service_health
      command: "curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/health"
      scan_interval: 60
      value_template: "{{ value | int(0) }}"

# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_merge_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
template: !include_dir_merge_list templates/

# Default dashboard stays UI-managed (storage). The AI dashboard is
# YAML-mode so Claude can edit it directly via the deploy pipeline;
# finalized cards get copy-pasted from AI into UI-managed dashboards.
lovelace:
  mode: storage
  dashboards:
    ai-sandbox:
      mode: yaml
      title: AI
      icon: mdi:robot
      show_in_sidebar: true
      filename: dashboards/ai.yaml

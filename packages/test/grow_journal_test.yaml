# TEST ONLY — stand-in helpers for proving the Home Assistant → Grow Journal link before the
# real grow is switched on (2026-11-07). Nothing here drives a pump, valve, light or selector,
# and no automation reads these. Delete this file when the test run is done.
#
# They mirror the real entities the journal reads, with a `test_` prefix:
#   grow calendar  input_datetime.test_grow_stage_*_date / test_grow_harvest_date
#   grow on/off    input_boolean.test_grow_active
#   stage          input_select.test_feed_stage
#   feed volume    sensor.test_last_feed_volume  (same formula as tent/irrigation/feed_volume.yaml,
#                  driven by input_boolean.test_feed_pump + input_number.test_flow_total)
# A test garden in a throwaway journal copy links to these; the real tent is never touched.

grow_journal_test:

  input_datetime:
    test_grow_stage_seedling_date: {name: "TEST Grow — Seedling Start", has_date: true, has_time: false}
    test_grow_stage_early_veg_date: {name: "TEST Grow — Early Veg Start", has_date: true, has_time: false}
    test_grow_stage_medium_veg_date: {name: "TEST Grow — Medium Veg Start", has_date: true, has_time: false}
    test_grow_stage_late_veg_date: {name: "TEST Grow — Late Veg Start", has_date: true, has_time: false}
    test_grow_stage_early_flower_date: {name: "TEST Grow — Early Flower Start", has_date: true, has_time: false}
    test_grow_stage_mid_flower_date: {name: "TEST Grow — Mid Flower Start", has_date: true, has_time: false}
    test_grow_stage_late_flower_date: {name: "TEST Grow — Late Flower Start", has_date: true, has_time: false}
    test_grow_harvest_date: {name: "TEST Grow — Harvest Date", has_date: true, has_time: false}

  input_boolean:
    test_grow_active:
      name: "TEST Grow Active"
    test_feed_pump:
      name: "TEST Feed Pump (simulated)"

  input_select:
    test_feed_stage:
      name: "TEST Feed Stage"
      options: ["Seedling", "Early Veg", "Medium Veg", "Late Veg", "Early Flower", "Mid Flower", "Late Flower"]

  input_number:
    test_flow_total:
      name: "TEST Flow Total (simulated meter)"
      min: 0
      max: 10000
      step: 0.001
      mode: box
      unit_of_measurement: "L"
    test_feed_volume_factor:
      name: "TEST Feed Volume Factor"
      min: 0.1
      max: 2
      step: 0.001
      mode: box

  # Same formula as tent/irrigation/feed_volume.yaml; keep the two in step while testing.
  # Only the pump, meter and factor entities differ; there are no valves, so `line` is "feed".
  template:
    - triggers:
        - trigger: state
          entity_id: input_boolean.test_feed_pump
          to: "on"
          id: start
        - trigger: state
          entity_id: input_boolean.test_feed_pump
          to: "off"
          for:
            seconds: 20
          id: end
      # Only plain values here: `this` (the sensor's previous state) is available to the
      # entity's own templates below, not to these action variables.
      actions:
        - variables:
            total: "{{ states('input_number.test_flow_total') | float(none) }}"
            factor_raw: "{{ states('input_number.test_feed_volume_factor') | float(1) }}"
            factor: "{{ factor_raw if factor_raw >= 0.5 else 1.0 }}"
      sensor:
        - name: "Test Last Feed Volume"
          unique_id: test_last_feed_volume
          unit_of_measurement: "L"
          device_class: volume
          icon: mdi:test-tube
          state: >
            {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
            {%- if ok %}{{ (raw * factor) | round(2) }}{%- else %}{{ this.state if this is defined else 'unknown' }}{%- endif %}
          attributes:
            running: "{{ trigger.id == 'start' }}"
            start_total: "{{ total if trigger.id == 'start' else none }}"
            started: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {{ now().isoformat() if trigger.id == 'start' else p.get('started') }}
            line: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              feed
            ended: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {{ now().isoformat() if ok else p.get('ended') }}
            seconds: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {%- if ok and p.get('started') %}{{ (now() - as_datetime(p.get('started'))).total_seconds() | round(0) }}
              {%- else %}{{ p.get('seconds') }}{%- endif %}
            raw_l: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {{ raw if ok else p.get('raw_l') }}
            factor: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {{ factor if ok else p.get('factor') }}
            note: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {%- if ok %}{{ 'flow total reset during the run; counted since the reset' if total < st else '' }}
              {%- else %}{{ p.get('note', '') }}{%- endif %}
            error: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {%- if trigger.id == 'end' and not ok %}{{ 'flow total unavailable' if p.get('running', false)
                 else 'pump stopped without a recorded start' }}{%- endif %}

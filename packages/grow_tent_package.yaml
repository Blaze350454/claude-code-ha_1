grow_tent:
# Grow Tent Automation Package
# This package contains all automations, sensors, and helpers for grow tent management
#
# To use this package:
# 1. Copy this file to your Home Assistant config/packages/ directory
# 2. Enable packages in configuration.yaml:
#    homeassistant:
#      packages: !include_dir_named packages
# 3. Customize the entity IDs to match your devices
# 4. Restart Home Assistant

  # Customize block removed — template sensors now carry their own
  # name + icon (Tent Average Temperature / Humidity / Pressure below).

# Input helpers for grow tent settings
  input_number:
    grow_tent_target_temp:
      name: "Target Temperature"
      min: 15
      max: 35
      step: 0.5
      unit_of_measurement: "°C"
      icon: mdi:thermometer

    grow_tent_target_humidity:
      name: "Target Humidity"
      min: 30
      max: 90
      step: 5
      unit_of_measurement: "%"
      icon: mdi:water-percent

    grow_tent_light_duration:
      name: "Light Duration"
      min: 0
      max: 24
      step: 0.5
      unit_of_measurement: "hours"
      icon: mdi:clock-outline

    tent_feed_duration:
      name: "Tent Feed Duration"
      min: 1
      max: 60
      step: 1
      unit_of_measurement: "min"
      icon: mdi:timer-outline

    tent_flush_duration:
      name: "Tent Flush Duration"
      min: 1
      max: 30
      step: 1
      unit_of_measurement: "min"
      icon: mdi:timer-outline

    tent_humidifier_target_rh:
      name: "Tent Humidifier Target RH"
      min: 30
      max: 90
      step: 1
      initial: 65
      unit_of_measurement: "%"
      icon: mdi:water-percent

    tent_humidifier_hysteresis:
      name: "Tent Humidifier Hysteresis"
      min: 2
      max: 15
      step: 1
      initial: 5
      unit_of_measurement: "%"
      icon: mdi:arrow-expand-vertical

    tent_humidifier_min_rh:
      name: "Tent Humidifier Min RH Clamp"
      min: 20
      max: 80
      step: 1
      initial: 40
      unit_of_measurement: "%"
      icon: mdi:arrow-collapse-down

    tent_humidifier_max_rh:
      name: "Tent Humidifier Max RH Clamp"
      min: 30
      max: 95
      step: 1
      initial: 75
      unit_of_measurement: "%"
      icon: mdi:arrow-collapse-up

  # --- AC Day/Night Climate Control ---
    tent_day_temp_target:
      name: "AC Day Temp Target"
      min: 15
      max: 30
      step: 0.5
      initial: 23
      unit_of_measurement: "°C"
      icon: mdi:thermometer-high

    tent_night_temp_target:
      name: "AC Night Temp Target"
      min: 15
      max: 25
      step: 0.5
      initial: 20
      unit_of_measurement: "°C"
      icon: mdi:thermometer-low

    ac_day_fan_speed:
      name: "AC Day Fan Speed"
      min: 1
      max: 100
      step: 1
      initial: 60
      unit_of_measurement: "%"
      icon: mdi:fan

    ac_night_fan_speed:
      name: "AC Night Fan Speed"
      min: 1
      max: 100
      step: 1
      initial: 30
      unit_of_measurement: "%"
      icon: mdi:fan

  # --- VPD Targets & Tolerance ---
    vpd_day_target:
      name: "VPD Day Target"
      min: 0.2
      max: 2.0
      step: 0.05
      initial: 1.0
      unit_of_measurement: "kPa"
      icon: mdi:cloud-outline

    vpd_night_target:
      name: "VPD Night Target"
      min: 0.2
      max: 2.0
      step: 0.05
      initial: 0.8
      unit_of_measurement: "kPa"
      icon: mdi:cloud-outline

    vpd_tolerance:
      name: "VPD Alert Tolerance"
      min: 0.1
      max: 0.5
      step: 0.05
      initial: 0.3
      unit_of_measurement: "kPa"
      icon: mdi:arrow-expand-horizontal

    transition_day_counter:
      name: "Transition Day Counter"
      min: 0
      max: 7
      step: 1
      initial: 0
      icon: mdi:counter

  # --- Lights Transition Pre-Shift ---
    lights_transition_offset_minutes:
      name: "Lights Transition Offset (minutes)"
      min: 0
      max: 30
      step: 1
      initial: 5
      unit_of_measurement: "min"
      icon: mdi:timer-cog-outline
    # Climate day mode flips this many minutes before lights actually toggle,
    # so AC + VPD target pre-shift and the tent isn't slammed at the transition.

  input_boolean:
    grow_tent_automation_enabled:
      name: "Enable Grow Tent Automation"
      icon: mdi:auto-fix

    grow_tent_vacation_mode:
      name: "Vacation Mode"
      icon: mdi:airplane

  # --- Safety Overrides ---
    tent_flower_night_humidifier_block:
      name: "Block Tent Humidifier During Flower Nights"
      icon: mdi:shield-alert
    # ON = humidifier blocked during flower nights (default safe behavior)
    # OFF = allow humidifier even during flower nights (manual override)

  # --- Fan Coordination ---
    circulation_fans_day:
      name: "Circulation Fans During Day"
      icon: mdi:fan
    # ON = circulation fans run during lights on

    circulation_fans_night:
      name: "Circulation Fans During Night"
      icon: mdi:fan
    # ON = circulation fans run during lights off (reduced airflow)

    ac_circ_fan_day:
      name: "AC Circulation Fan During Day"
      icon: mdi:fan-auto
    # ON = AC-side internal circulation fan runs during climate day mode

    ac_circ_fan_night:
      name: "AC Circulation Fan During Night"
      icon: mdi:fan-auto
    # ON = AC-side internal circulation fan runs during climate night mode

  # humidifier_enabled replaced by input_select.tent_humidity_mode

  input_datetime:
    grow_tent_lights_on:
      name: "Lights On Time"
      has_date: false
      has_time: true

    grow_tent_watering_time:
      name: "Watering Time"
      has_date: false
      has_time: true

  input_select:
    grow_tent_growth_stage:
      name: "Growth Stage"
      options:
        - Seedling
        - Early Veg
        - Veg
        - Transition
        - Early Flower
        - Flower
        - Late Flower
      initial: Veg
      icon: mdi:sprout

    tent_humidity_mode:
      name: "Humidity Mode"
      options:
        - Humidify
        - Dehumidify
        - "Off"
      icon: mdi:water-percent

  # --- AC Day/Night Airflow & Mode Selectors ---
    ac_day_vertical:
      name: "AC Day Vertical Direction"
      options:
        - "off"
        - up
        - up-mid
        - middle
        - down-mid
        - down
        - swing
      initial: middle
      icon: mdi:pan-vertical

    ac_night_vertical:
      name: "AC Night Vertical Direction"
      options:
        - "off"
        - up
        - up-mid
        - middle
        - down-mid
        - down
        - swing
      initial: up
      icon: mdi:pan-vertical

    ac_day_horizontal:
      name: "AC Day Horizontal Direction"
      options:
        - "off"
        - left
        - left-mid
        - middle
        - right-mid
        - right
        - swing
      initial: swing
      icon: mdi:pan-horizontal

    ac_night_horizontal:
      name: "AC Night Horizontal Direction"
      options:
        - "off"
        - left
        - left-mid
        - middle
        - right-mid
        - right
        - swing
      initial: middle
      icon: mdi:pan-horizontal

    ac_day_wind_mode:
      name: "AC Day Wind Mode"
      options:
        - normal
        - natural
        - indirect
        - breezeless
      initial: normal
      icon: mdi:weather-windy

    ac_night_wind_mode:
      name: "AC Night Wind Mode"
      options:
        - normal
        - natural
        - indirect
        - breezeless
      initial: breezeless
      icon: mdi:weather-windy

    ac_day_power_mode:
      name: "AC Day Power Mode"
      options:
        - normal
        - eco
        - sleep
        - boost
      initial: normal
      icon: mdi:lightning-bolt

    ac_night_power_mode:
      name: "AC Night Power Mode"
      options:
        - normal
        - eco
        - sleep
        - boost
      initial: eco
      icon: mdi:lightning-bolt

# Modern template sensors
  template:
    - sensor:
        - name: "Tent Humidifier On Threshold"
          unique_id: tent_humidifier_on_threshold
          unit_of_measurement: "%"
          state: >
            {{ states('input_number.tent_humidifier_target_rh') | float -
               states('input_number.tent_humidifier_hysteresis') | float }}

        - name: "Active VPD Target"
          unique_id: active_vpd_target
          unit_of_measurement: "kPa"
          icon: mdi:cloud-outline
          state: >
            {% if is_state('binary_sensor.tent_climate_day_mode', 'on') %}
              {{ states('input_number.vpd_day_target') | float(1.0) }}
            {% else %}
              {{ states('input_number.vpd_night_target') | float(0.8) }}
            {% endif %}

        - name: "VPD Ideal RH"
          unique_id: vpd_ideal_rh
          unit_of_measurement: "%"
          icon: mdi:water-percent
          state: >
            {% set temp = states('sensor.tent_average_temperature') | float(0) %}
            {% set vpd_target = states('sensor.active_vpd_target') | float(1.0) %}
            {% if temp > 0 %}
              {% set svp = 0.61078 * (2.71828 ** ((17.27 * temp) / (temp + 237.3))) %}
              {% set ideal_rh = 100 * (1 - vpd_target / svp) %}
              {{ [0, [100, ideal_rh] | min] | max | round(1) }}
            {% else %}
              {{ none }}
            {% endif %}
          availability: >
            {{ states('sensor.tent_average_temperature') not in ['unknown', 'unavailable'] }}

        - name: "Grow Tent Status"
          unique_id: grow_tent_status
          default_entity_id: sensor.grow_tent_status
          icon: >-
            {% if is_state('binary_sensor.climate_ok', 'on') %}
              mdi:check-circle
            {% else %}
              mdi:alert-circle
            {% endif %}
          state: >
            {% set temp = states('sensor.tent_average_temperature') | float(0) %}
            {% set target_temp = states('input_number.grow_tent_target_temp') | float(0) %}
            {% set humidity = states('sensor.tent_average_humidity') | float(0) %}
            {% set target_humidity = states('input_number.grow_tent_target_humidity') | float(0) %}
            {% if (temp - target_temp) | abs > 3 %}
              Temperature Alert
            {% elif (humidity - target_humidity) | abs > 10 %}
              Humidity Alert
            {% elif is_state('binary_sensor.tent_lights_on', 'on') %}
              Growing
            {% else %}
              Resting
            {% endif %}


        - name: "Tent Average Humidity"
          unique_id: tent_average_humidity
          default_entity_id: sensor.tent_average_humidity
          unit_of_measurement: "%"
          device_class: humidity
          state_class: measurement
          icon: mdi:water-percent
          state: >
            {% set sensors = [
              states('sensor.canopy_humidity_tent'),
              states('sensor.flower_humidity_tent'),
              states('sensor.indoor_humidity_air_conditioner_tent'),
              states('sensor.current_humidity_dehumidifier')
            ] %}
            {% set readings = sensors
              | reject('in', ['unavailable', 'unknown'])
              | map('float', default=none)
              | reject('none')
              | list %}
            {% if readings | length == 0 %}
              {{ none }}
            {% else %}
              {# Drop readings outside sane range (5-99%) #}
              {% set sane = readings | select('>=', 5) | select('<=', 99) | list %}
              {% if sane | length == 0 %}
                {{ none }}
              {% elif sane | length <= 2 %}
                {{ (sane | sum / sane | length) | round(1) }}
              {% else %}
                {# 3+ readings: compute median, drop any >15% RH from median, average the rest #}
                {% set sorted = sane | sort | list %}
                {% set mid = (sorted | length / 2) | int %}
                {% set median = sorted[mid] if sorted | length is odd else
                   (sorted[mid - 1] + sorted[mid]) / 2 %}
                {% set filtered = sane
                  | select('>=', median - 15)
                  | select('<=', median + 15)
                  | list %}
                {% if filtered | length == 0 %}
                  {{ median | round(1) }}
                {% else %}
                  {{ (filtered | sum / filtered | length) | round(1) }}
                {% endif %}
              {% endif %}
            {% endif %}
          availability: >
            {{ [
              states('sensor.canopy_humidity_tent'),
              states('sensor.flower_humidity_tent'),
              states('sensor.indoor_humidity_air_conditioner_tent'),
              states('sensor.current_humidity_dehumidifier')
            ] | reject('in', ['unavailable', 'unknown']) | list | length > 0 }}

        - name: "Tent Average Temperature"
          unique_id: tent_average_temperature
          default_entity_id: sensor.tent_average_temperature
          unit_of_measurement: "°C"
          device_class: temperature
          state_class: measurement
          icon: mdi:thermometer
          state: >
            {% set sensors = [
              states('sensor.canopy_temperature_tent'),
              states('sensor.flower_temperature_tent'),
              states('sensor.indoor_temperature_air_conditioner_tent'),
              states('sensor.temperature_camera_tent')
            ] %}
            {% set readings = sensors
              | reject('in', ['unavailable', 'unknown'])
              | map('float', default=none)
              | reject('none')
              | list %}
            {% if readings | length == 0 %}
              {{ none }}
            {% else %}
              {# Drop readings outside sane range (5-50°C) #}
              {% set sane = readings | select('>=', 5) | select('<=', 50) | list %}
              {% if sane | length == 0 %}
                {{ none }}
              {% elif sane | length <= 2 %}
                {{ (sane | sum / sane | length) | round(1) }}
              {% else %}
                {# 3+ readings: compute median, drop any >5°C from median, average the rest #}
                {% set sorted = sane | sort | list %}
                {% set mid = (sorted | length / 2) | int %}
                {% set median = sorted[mid] if sorted | length is odd else
                   (sorted[mid - 1] + sorted[mid]) / 2 %}
                {% set filtered = sane
                  | select('>=', median - 5)
                  | select('<=', median + 5)
                  | list %}
                {% if filtered | length == 0 %}
                  {{ median | round(1) }}
                {% else %}
                  {{ (filtered | sum / filtered | length) | round(1) }}
                {% endif %}
              {% endif %}
            {% endif %}
          availability: >
            {{ [
              states('sensor.canopy_temperature_tent'),
              states('sensor.flower_temperature_tent'),
              states('sensor.indoor_temperature_air_conditioner_tent'),
              states('sensor.temperature_camera_tent')
            ] | reject('in', ['unavailable', 'unknown']) | list | length > 0 }}

        - name: "Tent Average Pressure"
          unique_id: tent_average_pressure
          default_entity_id: sensor.tent_average_pressure
          unit_of_measurement: "hPa"
          device_class: pressure
          state_class: measurement
          icon: mdi:gauge
          state: >
            {% set sensors = [
              states('sensor.canopy_pressure_tent'),
              states('sensor.flower_pressure_tent')
            ] %}
            {% set readings = sensors
              | reject('in', ['unavailable', 'unknown'])
              | map('float', default=none)
              | reject('none')
              | list %}
            {% if readings | length == 0 %}
              {{ none }}
            {% else %}
              {# Drop readings outside sane atmospheric range (900-1100 hPa) #}
              {% set sane = readings | select('>=', 900) | select('<=', 1100) | list %}
              {% if sane | length == 0 %}
                {{ none }}
              {% elif sane | length <= 2 %}
                {{ (sane | sum / sane | length) | round(2) }}
              {% else %}
                {# 3+ readings: compute median, drop any >5 hPa from median, average the rest #}
                {% set sorted = sane | sort | list %}
                {% set mid = (sorted | length / 2) | int %}
                {% set median = sorted[mid] if sorted | length is odd else
                   (sorted[mid - 1] + sorted[mid]) / 2 %}
                {% set filtered = sane
                  | select('>=', median - 5)
                  | select('<=', median + 5)
                  | list %}
                {% if filtered | length == 0 %}
                  {{ median | round(2) }}
                {% else %}
                  {{ (filtered | sum / filtered | length) | round(2) }}
                {% endif %}
              {% endif %}
            {% endif %}
          availability: >
            {{ [
              states('sensor.canopy_pressure_tent'),
              states('sensor.flower_pressure_tent')
            ] | reject('in', ['unavailable', 'unknown']) | list | length > 0 }}

    - binary_sensor:
        - name: "Climate OK"
          unique_id: grow_tent_climate_ok
          device_class: safety
          state: >
            {% set temp = states('sensor.tent_average_temperature') | float(0) %}
            {% set target_temp = states('input_number.grow_tent_target_temp') | float(0) %}
            {% set humidity = states('sensor.tent_average_humidity') | float(0) %}
            {% set target_humidity = states('input_number.grow_tent_target_humidity') | float(0) %}
            {{ (temp - target_temp) | abs <= 3 and (humidity - target_humidity) | abs <= 10 }}

        - name: "Tent Lights On"
          unique_id: tent_lights_on
          icon: mdi:lightbulb-on
          state: >
            {{ is_state('light.hlg', 'on') or is_state('light.chilled', 'on') }}

    # Climate day mode — flips ON `lights_transition_offset_minutes` BEFORE the
    # scheduled lights-on (and OFF that many minutes before lights-off). Stage-
    # aware: uses veg schedule for Seedling/Veg/Transition, flower schedule for
    # Early Flower/Flower/Late Flower. AC + VPD target read this instead of
    # actual light state so the tent pre-shifts before the lights toggle.
    - trigger:
        - trigger: time_pattern
          minutes: /1
        - trigger: state
          entity_id:
            - input_select.grow_tent_growth_stage
            - input_datetime.veg_lights_on_time
            - input_datetime.veg_lights_off_time
            - input_datetime.flower_lights_on_time
            - input_datetime.flower_lights_off_time
            - input_number.lights_transition_offset_minutes
      binary_sensor:
        - name: "Tent Climate Day Mode"
          unique_id: tent_climate_day_mode
          icon: mdi:weather-sunny
          state: >
            {%- set stage = states('input_select.grow_tent_growth_stage') -%}
            {%- if stage in ['Seedling', 'Early Veg', 'Veg', 'Transition'] -%}
              {%- set on_t = states('input_datetime.veg_lights_on_time') -%}
              {%- set off_t = states('input_datetime.veg_lights_off_time') -%}
            {%- else -%}
              {%- set on_t = states('input_datetime.flower_lights_on_time') -%}
              {%- set off_t = states('input_datetime.flower_lights_off_time') -%}
            {%- endif -%}
            {%- set offset = states('input_number.lights_transition_offset_minutes') | int(5) -%}
            {%- set on_m = ((on_t.split(':')[0]|int * 60) + on_t.split(':')[1]|int - offset + 1440) % 1440 -%}
            {%- set off_m = ((off_t.split(':')[0]|int * 60) + off_t.split(':')[1]|int - offset + 1440) % 1440 -%}
            {%- set now_m = now().hour * 60 + now().minute -%}
            {%- if on_m < off_m -%}{{ now_m >= on_m and now_m < off_m }}
            {%- else -%}{{ now_m >= on_m or now_m < off_m }}
            {%- endif -%}

# Automations are included from separate files
  automation: !include_dir_merge_list automations/
  script: !include_dir_merge_named scripts/

# --- Phase 2: Needle valve temp control (hot/cold mixing) ---
# Requires Phase 2 stepper hardware installed on tent-irrigation-controller.
# Feedback: sensor.reservoir_temperature_tent (°C, Dallas DS18B20)
# Setpoint: input_number.grow_tent_target_temp (°C)
# Actuator: number.needle_valve_position_tent_irrigation_controller (0–1000 steps)
# Dead band: ±0.5°C. Adjusts ±10 steps per 2-minute cycle.
# Disable this automation until Phase 2 hardware is installed.


# ================================================
# Grow Tent — Irrigation Package
# ================================================

# --- HELPERS ---

input_datetime:
  night_cycle_stop:
    name: Night Cycle Stop
    has_date: true
    has_time: true

input_number:
  maintenance_interval_minutes:
    name: Maintenance Interval
    min: 30
    max: 480
    step: 10
    unit_of_measurement: min
    mode: box
    icon: mdi:timer-sync
    initial: 120
  maintenance_stir_minutes:
    name: Maintenance Stir Duration
    min: 1
    max: 30
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:rotate-3d-variant
    initial: 5
  maintenance_air_minutes:
    name: Maintenance Air Duration
    min: 1
    max: 60
    step: 1
    unit_of_measurement: min
    mode: box
    icon: mdi:air-purifier
    initial: 20

# --- SCRIPTS ---

script:
  stop_alternating:
    alias: Stop Air/Stir Alternating
    sequence:
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.alternating_active
    - action: switch.turn_off
      target:
        entity_id:
        - switch.air_pump_irrigation_tent
        - switch.feed_stir_pump_irrigation_tent
        - switch.flush_stir_pump_irrigation_tent
      data: {}
    mode: single
    icon: mdi:stop

  run_alternating:
    alias: Run Air/Stir Alternating
    sequence:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.alternating_active
    - repeat:
        while:
        - condition: state
          entity_id: input_boolean.alternating_active
          state: 'on'
        sequence:
        - action: switch.turn_on
          target:
            entity_id:
            - switch.feed_stir_pump_irrigation_tent
            - switch.flush_stir_pump_irrigation_tent
        - action: switch.turn_off
          target:
            entity_id: switch.air_pump_irrigation_tent
          data: {}
        - delay:
            minutes: '{{ states(''input_number.stir_on_duration_minutes'') | int }}'
        - condition: state
          entity_id: input_boolean.alternating_active
          state: 'on'
        - action: switch.turn_off
          target:
            entity_id:
            - switch.feed_stir_pump_irrigation_tent
            - switch.flush_stir_pump_irrigation_tent
          data: {}
        - delay:
            milliseconds: 500
        - action: switch.turn_on
          target:
            entity_id: switch.air_pump_irrigation_tent
        - delay:
            minutes: '{{ states(''input_number.air_on_duration_minutes'') | int }}'
        - condition: state
          entity_id: input_boolean.alternating_active
          state: 'on'
        - action: switch.turn_off
          target:
            entity_id: switch.air_pump_irrigation_tent
          data: {}
        - delay:
            milliseconds: 500
    mode: restart
    icon: mdi:sync

  run_normal_flush:
    alias: Run Normal End Flush
    sequence:
    - if:
      - condition: state
        entity_id: binary_sensor.flush_empty_irrigation_tent
        state: 'off'
      then:
      - action: notify.mobile_app_sm_a166w
        data:
          title: Flush Blocked — Reservoir Dry
          message: Normal flush blocked. Flush reservoir is dry.
      - stop: "Flush reservoir dry"
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_status
      data:
        value: Flushing
    - action: valve.open_valve
      target:
        entity_id: valve.flush_valve_irrigation_tent
    - action: switch.turn_on
      target:
        entity_id: switch.flush_pump_irrigation_tent
    - delay:
        minutes: '{{ states(''input_number.flush_duration_minutes'') | float }}'
    - action: switch.turn_off
      target:
        entity_id: switch.flush_pump_irrigation_tent
    - action: valve.close_valve
      target:
        entity_id: valve.flush_valve_irrigation_tent
    mode: single
    icon: mdi:water-outline

  run_day3_flush:
    alias: Run Day 3 Flush Cycle
    sequence:
    - if:
      - condition: state
        entity_id: binary_sensor.flush_empty_irrigation_tent
        state: 'off'
      then:
      - action: notify.mobile_app_sm_a166w
        data:
          title: Deep Flush Blocked — Reservoir Dry
          message: Deep flush blocked. Flush reservoir is dry.
      - stop: "Flush reservoir dry"
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_status
      data:
        value: Deep Flush
    - action: valve.open_valve
      target:
        entity_id: valve.flush_valve_irrigation_tent
    - action: switch.turn_on
      target:
        entity_id: switch.flush_pump_irrigation_tent
    - delay:
        minutes: '{{ states(''input_number.flush_cycle_plant_minutes'') | int }}'
    - action: valve.open_valve
      target:
        entity_id: valve.flush_drain_valve_irrigation_tent
    - delay:
        minutes: '{{ states(''input_number.flush_cycle_drain_minutes'') | int }}'
    - action: switch.turn_off
      target:
        entity_id: switch.flush_pump_irrigation_tent
    - action: valve.close_valve
      target:
        entity_id:
        - valve.flush_valve_irrigation_tent
        - valve.flush_drain_valve_irrigation_tent
    - action: input_number.set_value
      target:
        entity_id: input_number.flush_day_counter
      data:
        value: 0
    mode: single
    icon: mdi:water-sync

  run_feed_cycle:
    alias: Run Feed Cycle
    sequence:
    - if:
      - condition: state
        entity_id: binary_sensor.feed_empty_irrigation_tent
        state: 'off'
      then:
      - action: notify.mobile_app_sm_a166w
        data:
          title: Feed Blocked — Reservoir Dry
          message: Feed cycle blocked. Feed reservoir is dry. Refill before next feed.
      - stop: "Feed reservoir dry"
    - action: script.stop_alternating
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_status
      data:
        value: Feeding
    - action: valve.open_valve
      target:
        entity_id: valve.feed_valve_irrigation_tent
    - action: switch.turn_on
      target:
        entity_id: switch.feed_pump_irrigation_tent
    - delay:
        minutes: '{{ states(''input_number.feed_duration_minutes'') | float }}'
    - action: switch.turn_off
      target:
        entity_id: switch.feed_pump_irrigation_tent
    - action: valve.close_valve
      target:
        entity_id: valve.feed_valve_irrigation_tent
    - choose:
      - conditions:
        - condition: template
          value_template: >
            {{ states('input_number.flush_day_counter') | int == 3
               and states('input_number.current_feed_number') | int >= states('input_number.feeds_per_day_2') | int }}
        sequence:
        - action: script.run_day3_flush
      - conditions:
        - condition: template
          value_template: '{{ true }}'
        sequence:
        - action: script.run_normal_flush
    - wait_template: >
        {{ not is_state('script.run_day3_flush', 'on')
           and not is_state('script.run_normal_flush', 'on') }}
      timeout: '01:00:00'
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_status
      data:
        value: Idle
    mode: single
    icon: mdi:watering-can

  irrigation_advance_to_next_feed:
    alias: Advance to Next Feed
    sequence:
    - variables:
        feeds_per_day: '{{ states(''input_number.feeds_per_day_2'') | int }}'
        current_feed: '{{ states(''input_number.current_feed_number'') | int }}'
        lead_minutes: '{{ states(''input_number.air_stir_lead_minutes'') | int }}'
        lights_off_hour: '{{ states(''input_datetime.veg_lights_off_time'')[0:2] | int }}'
        lights_off_min: '{{ states(''input_datetime.veg_lights_off_time'')[3:5] | int }}'
        lights_on_hour: '{{ states(''input_datetime.veg_lights_on_time'')[0:2] | int }}'
        lights_on_min: '{{ states(''input_datetime.veg_lights_on_time'')[3:5] | int }}'
        lights_on_duration: >
          {% set on_m = lights_on_hour | int * 60 + lights_on_min | int %}
          {% set off_m = lights_off_hour | int * 60 + lights_off_min | int %}
          {% if off_m > on_m %}{{ off_m - on_m }}{% else %}{{ (24 * 60 - on_m) + off_m }}{% endif %}
        interval_minutes: >
          {% set dur = lights_on_duration | int - 35 %}
          {% if feeds_per_day > 1 %}{{ (dur / (feeds_per_day - 1)) | round(0) | int }}{% else %}{{ dur | int }}{% endif %}
        next_feed_num: '{{ current_feed + 1 }}'
        next_feed_offset: '{{ 5 + (next_feed_num - 1) * interval_minutes | int }}'
        next_feed_dt: >
          {% set base_date = now().date() | string %}
          {% set on_h = lights_on_hour | int %}
          {% set on_m_val = lights_on_min | int %}
          {% set total_min = on_h * 60 + on_m_val + next_feed_offset | int %}
          {% set h = (total_min // 60) % 24 %}
          {% set m = total_min % 60 %}
          {% if total_min >= 24 * 60 %}
            {% set next_date = (now().date() + timedelta(days=1)) | string %}
            {{ next_date ~ ' ' ~ '%02d:%02d:00' | format(h, m) }}
          {% else %}
            {{ base_date ~ ' ' ~ '%02d:%02d:00' | format(h, m) }}
          {% endif %}
    - if:
      - condition: template
        value_template: '{{ next_feed_num <= feeds_per_day }}'
      then:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.next_feed_time
        data:
          datetime: '{{ next_feed_dt }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.next_pre_feed_start
        data:
          datetime: '{{ (strptime(next_feed_dt, ''%Y-%m-%d %H:%M:%S'') - timedelta(minutes=lead_minutes | int)) | string }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.next_pre_feed_stop
        data:
          datetime: '{{ (strptime(next_feed_dt, ''%Y-%m-%d %H:%M:%S'') - timedelta(minutes=5)) | string }}'
      else:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.next_feed_time
        data:
          datetime: >
            {% set on_total = lights_on_hour | int * 60 + lights_on_min | int + 5 %}
            {% set h = (on_total // 60) % 24 %}
            {% set m = on_total % 60 %}
            {{ (now().date() + timedelta(days=1)) | string ~ ' ' ~ '%02d:%02d:00' | format(h, m) }}
    mode: single
    icon: mdi:skip-next

# --- AUTOMATIONS ---

automation:
  - id: automation.fill_feed_reservoir
    alias: Fill — Feed Reservoir
    description: Opens feed fill valve until reservoir full sensor triggers or timeout
    triggers:
    - trigger: event
      event_type: fill_feed_reservoir_start
    actions:
    - action: valve.open_valve
      target:
        entity_id: valve.feed_fill_valve_irrigation_tent
    - wait_for_trigger:
      - platform: state
        entity_id: binary_sensor.feed_full_irrigation_tent
        to: 'on'
      timeout:
        minutes: 2
        seconds: 30
    - action: valve.close_valve
      target:
        entity_id: valve.feed_fill_valve_irrigation_tent
    mode: single

  - id: automation.fill_flush_reservoir
    alias: Fill — Flush Reservoir
    description: Opens flush fill valve until flush full sensor triggers or timeout
    triggers:
    - trigger: event
      event_type: fill_flush_reservoir_start
    actions:
    - action: valve.open_valve
      target:
        entity_id: valve.flush_fill_valve_irrigation_tent
    - wait_for_trigger:
      - platform: state
        entity_id: binary_sensor.flush_full_irrigation_tent
        to: 'on'
      timeout:
        minutes: 2
        seconds: 30
    - action: valve.close_valve
      target:
        entity_id: valve.flush_fill_valve_irrigation_tent
    mode: single

  - id: automation.feed_reservoir_empty_alert
    alias: Alert — Feed Reservoir Dry
    description: Immediate push notification when feed reservoir goes dry
    triggers:
    - trigger: state
      entity_id: binary_sensor.feed_empty_irrigation_tent
      to: 'off'
      for:
        minutes: 1
    actions:
    - action: notify.mobile_app_sm_a166w
      data:
        title: Feed Reservoir Empty
        message: Feed reservoir is dry — refill needed.
    mode: single

  - id: automation.feed_reservoir_empty_repeat
    alias: Alert — Feed Reservoir Dry (Repeat)
    description: Repeats push notification every 30 minutes while feed reservoir stays dry
    triggers:
    - trigger: time_pattern
      minutes: /30
    conditions:
    - condition: state
      entity_id: binary_sensor.feed_empty_irrigation_tent
      state: 'off'
    actions:
    - action: notify.mobile_app_sm_a166w
      data:
        title: Feed Reservoir Still Empty
        message: Feed reservoir is still dry — refill needed.
    mode: single

  - id: automation.flush_reservoir_empty_alert
    alias: Alert — Flush Reservoir Dry
    description: Immediate push notification when flush reservoir goes dry
    triggers:
    - trigger: state
      entity_id: binary_sensor.flush_empty_irrigation_tent
      to: 'off'
      for:
        minutes: 1
    actions:
    - action: notify.mobile_app_sm_a166w
      data:
        title: Flush Reservoir Empty
        message: Flush reservoir is dry — refill needed.
    mode: single

  - id: automation.flush_reservoir_empty_repeat
    alias: Alert — Flush Reservoir Dry (Repeat)
    description: Repeats push notification every 30 minutes while flush reservoir stays dry
    triggers:
    - trigger: time_pattern
      minutes: /30
    conditions:
    - condition: state
      entity_id: binary_sensor.flush_empty_irrigation_tent
      state: 'off'
    actions:
    - action: notify.mobile_app_sm_a166w
      data:
        title: Flush Reservoir Still Empty
        message: Flush reservoir is still dry — refill needed.
    mode: single

  - id: automation.irrigation_daily_setup
    alias: Irrigation — Daily Setup at Lights On
    description: Resets daily counters, calculates feed schedule, sets next_feed_time to first feed
    triggers:
    - platform: time
      at: input_datetime.veg_lights_on_time
    conditions:
    - condition: state
      entity_id: input_boolean.irrigation_enabled
      state: 'on'
    actions:
    - action: input_number.set_value
      target:
        entity_id: input_number.current_feed_number
      data:
        value: 0
    - variables:
        lights_on_h: '{{ states(''input_datetime.veg_lights_on_time'')[0:2] | int }}'
        lights_on_m: '{{ states(''input_datetime.veg_lights_on_time'')[3:5] | int }}'
        lights_off_h: '{{ states(''input_datetime.veg_lights_off_time'')[0:2] | int }}'
        lights_off_m: '{{ states(''input_datetime.veg_lights_off_time'')[3:5] | int }}'
        today_str: '{{ now().date() | string }}'
        on_total_min: '{{ lights_on_h * 60 + lights_on_m }}'
        off_total_min: '{{ lights_off_h * 60 + lights_off_m }}'
        first_feed_total_min: '{{ on_total_min + 5 }}'
        first_feed_h: '{{ (first_feed_total_min // 60) % 24 }}'
        first_feed_m: '{{ first_feed_total_min % 60 }}'
        first_feed_dt: '{{ today_str ~ '' '' ~ (''0'' ~ (first_feed_h | string))[-2:] ~ '':'' ~ (''0'' ~ (first_feed_m | string))[-2:] ~ '':00'' }}'
        lead_min: '{{ states(''input_number.air_stir_lead_minutes'') | int }}'
        pre_start_total: '{{ first_feed_total_min - lead_min }}'
        pre_start_h: '{{ (pre_start_total // 60) % 24 }}'
        pre_start_m: '{{ pre_start_total % 60 }}'
        pre_start_dt: '{{ today_str ~ '' '' ~ (''0'' ~ (pre_start_h | string))[-2:] ~ '':'' ~ (''0'' ~ (pre_start_m | string))[-2:] ~ '':00'' }}'
        pre_stop_total: '{{ first_feed_total_min - 5 }}'
        pre_stop_h: '{{ (pre_stop_total // 60) % 24 }}'
        pre_stop_m: '{{ pre_stop_total % 60 }}'
        pre_stop_dt: '{{ today_str ~ '' '' ~ (''0'' ~ (pre_stop_h | string))[-2:] ~ '':'' ~ (''0'' ~ (pre_stop_m | string))[-2:] ~ '':00'' }}'
        night_delay: '{{ states(''input_number.night_delay_minutes'') | int }}'
        off_plus_delay: '{{ off_total_min + night_delay }}'
        night_start_h: '{{ (off_plus_delay // 60) % 24 }}'
        night_start_m: '{{ off_plus_delay % 60 }}'
        next_day_str: '{{ (now().date() + timedelta(days=1)) | string }}'
        night_start_dt: '{{ (next_day_str if off_plus_delay < on_total_min else today_str) ~ '' '' ~ (''0'' ~ (night_start_h | string))[-2:] ~ '':'' ~ (''0'' ~ (night_start_m | string))[-2:] ~ '':00'' }}'
        night_stop_total: '{{ lights_on_h * 60 + lights_on_m - 5 }}'
        night_stop_h: '{{ (night_stop_total // 60) % 24 }}'
        night_stop_m: '{{ night_stop_total % 60 }}'
        night_stop_dt: '{{ next_day_str ~ '' '' ~ (''0'' ~ (night_stop_h | string))[-2:] ~ '':'' ~ (''0'' ~ (night_stop_m | string))[-2:] ~ '':00'' }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_feed_time
      data:
        datetime: '{{ first_feed_dt }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_pre_feed_start
      data:
        datetime: '{{ pre_start_dt }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.next_pre_feed_stop
      data:
        datetime: '{{ pre_stop_dt }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.night_cycle_start
      data:
        datetime: '{{ night_start_dt }}'
    - action: input_datetime.set_datetime
      target:
        entity_id: input_datetime.night_cycle_stop
      data:
        datetime: '{{ night_stop_dt }}'
    - variables:
        current_day: '{{ states(''input_number.flush_day_counter'') | int }}'
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ current_day >= 3 }}'
        sequence:
        - action: input_number.set_value
          target:
            entity_id: input_number.flush_day_counter
          data:
            value: 0
      - conditions:
        - condition: template
          value_template: '{{ true }}'
        sequence:
        - action: input_number.increment
          target:
            entity_id: input_number.flush_day_counter
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_status
      data:
        value: Idle
    mode: single

  - id: automation.irrigation_feed_trigger
    alias: Irrigation — Feed Trigger
    description: Triggers a feed cycle when next_feed_time is reached
    triggers:
    - platform: time
      at: input_datetime.next_feed_time
    conditions:
    - condition: state
      entity_id: input_boolean.irrigation_enabled
      state: 'on'
    actions:
    - action: input_number.increment
      target:
        entity_id: input_number.current_feed_number
    - action: script.run_feed_cycle
    - wait_template: '{{ not is_state(''script.run_feed_cycle'', ''on'') }}'
      timeout: 00:60:00
    - action: script.irrigation_advance_to_next_feed
    mode: single

  - id: automation.irrigation_pre_feed_start
    alias: Irrigation — Pre-Feed Air/Stir Start
    description: Starts air/stir alternating at lead time before next feed
    triggers:
    - platform: time
      at: input_datetime.next_pre_feed_start
    conditions:
    - condition: state
      entity_id: input_boolean.irrigation_enabled
      state: 'on'
    - condition: template
      value_template: '{{ states(''input_number.current_feed_number'') | int < states(''input_number.feeds_per_day_2'') | int }}'
    actions:
    - action: script.run_alternating
    mode: single

  - id: automation.irrigation_pre_feed_stop
    alias: Irrigation — Pre-Feed Air/Stir Stop
    description: Stops air/stir alternating 5 minutes before next feed
    triggers:
    - platform: time
      at: input_datetime.next_pre_feed_stop
    conditions:
    - condition: state
      entity_id: input_boolean.irrigation_enabled
      state: 'on'
    actions:
    - action: script.stop_alternating
    mode: single

  - id: automation.irrigation_night_cycle_start
    alias: Irrigation — Night Cycle Start
    description: Starts overnight air/stir alternating after lights-off delay
    triggers:
    - platform: time
      at: input_datetime.night_cycle_start
    conditions:
    - condition: state
      entity_id: input_boolean.irrigation_enabled
      state: 'on'
    actions:
    - action: script.run_alternating
    mode: single

  - id: automation.irrigation_night_cycle_stop
    alias: Irrigation — Night Cycle Stop
    description: Stops overnight air/stir alternating 5 minutes before lights-on
    triggers:
    - platform: time
      at: input_datetime.night_cycle_stop
    actions:
    - action: script.stop_alternating
    mode: single

  - id: automation.irrigation_lights_off_stop
    alias: Irrigation — Lights Off Cleanup
    description: Stops all irrigation activity at lights-off
    triggers:
    - at: input_datetime.veg_lights_off_time
      trigger: time
    actions:
    - action: script.stop_alternating
    - action: script.turn_off
      target:
        entity_id:
        - script.run_feed_cycle
        - script.run_normal_flush
        - script.run_day3_flush
      data: {}
    - action: switch.turn_off
      target:
        entity_id:
        - switch.feed_pump_irrigation_tent
        - switch.flush_pump_irrigation_tent
        - switch.air_pump_irrigation_tent
        - switch.feed_stir_pump_irrigation_tent
        - switch.flush_stir_pump_irrigation_tent
      data: {}
    - action: valve.close_valve
      target:
        entity_id:
        - valve.feed_valve_irrigation_tent
        - valve.flush_valve_irrigation_tent
        - valve.flush_drain_valve_irrigation_tent
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_status
      data:
        value: Idle
    mode: single

  - id: automation.table_drain_pump_control
    alias: Irrigation — Table Drain Pump
    description: Turns on drain pump when table is full, off when empty sensor goes dry
    triggers:
    - trigger: state
      entity_id: binary_sensor.table_drain_full_irrigation_tent
      to: 'on'
    actions:
    - action: switch.turn_on
      target:
        entity_id: switch.table_drain_pump_irrigation_tent
    - wait_for_trigger:
      - platform: state
        entity_id: binary_sensor.table_drain_empty_irrigation_tent
        to: 'off'
      timeout:
        minutes: 30
    - action: switch.turn_off
      target:
        entity_id: switch.table_drain_pump_irrigation_tent
    - if:
      - condition: template
        value_template: '{{ wait.timed_out }}'
      then:
      - action: notify.mobile_app_sm_a166w
        data:
          title: Table Drain Alert
          message: Table drain pump ran for 30 minutes but empty sensor never triggered — check pump and sensors.
    mode: single

  - id: automation.tplink_service_health_alert
    alias: Alert — TPLink Service Down
    description: Notifies when localhost:8765 health check fails
    triggers:
    - trigger: state
      entity_id: sensor.tplink_service_health
      to: unavailable
      for:
        minutes: 2
    - trigger: numeric_state
      entity_id: sensor.tplink_service_health
      below: 200
      for:
        minutes: 2
    actions:
    - action: notify.mobile_app_sm_a166w
      data:
        title: TPLink Service Down
        message: The TP-Link pump control service on localhost:8765 is not responding — pumps cannot be controlled.
    mode: single

  - id: automation.irrigation_watchdog
    alias: Irrigation — Watchdog
    description: Forces all pumps and valves off if any pump runs for more than 10 minutes
    triggers:
    - trigger: state
      entity_id:
      - switch.feed_pump_irrigation_tent
      - switch.flush_pump_irrigation_tent
      to: 'on'
      for:
        minutes: 10
    actions:
    - action: script.stop_alternating
    - action: script.turn_off
      target:
        entity_id:
        - script.run_feed_cycle
        - script.run_normal_flush
        - script.run_day3_flush
      data: {}
    - action: switch.turn_off
      target:
        entity_id:
        - switch.feed_pump_irrigation_tent
        - switch.flush_pump_irrigation_tent
        - switch.air_pump_irrigation_tent
        - switch.feed_stir_pump_irrigation_tent
        - switch.flush_stir_pump_irrigation_tent
        - switch.table_drain_pump_irrigation_tent
      data: {}
    - action: valve.close_valve
      target:
        entity_id:
        - valve.feed_valve_irrigation_tent
        - valve.flush_valve_irrigation_tent
        - valve.flush_drain_valve_irrigation_tent
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_status
      data:
        value: 'FAULT — Watchdog triggered'
    - action: notify.mobile_app_sm_a166w
      data:
        title: Irrigation Watchdog Alert
        message: A pump has been running for over 10 minutes. All pumps and valves forced off — check system.
    mode: single

  - id: automation.irrigation_startup_recovery
    alias: Irrigation — Startup Recovery
    description: Forces all pumps and valves off immediately on HA start or restart
    triggers:
    - trigger: homeassistant
      event: start
    actions:
    - action: script.turn_off
      target:
        entity_id:
        - script.run_feed_cycle
        - script.run_normal_flush
        - script.run_day3_flush
        - script.run_alternating
      data: {}
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.alternating_active
    - action: switch.turn_off
      target:
        entity_id:
        - switch.feed_pump_irrigation_tent
        - switch.flush_pump_irrigation_tent
        - switch.air_pump_irrigation_tent
        - switch.feed_stir_pump_irrigation_tent
        - switch.flush_stir_pump_irrigation_tent
        - switch.table_drain_pump_irrigation_tent
      data: {}
    - action: valve.close_valve
      target:
        entity_id:
        - valve.feed_valve_irrigation_tent
        - valve.flush_valve_irrigation_tent
        - valve.flush_drain_valve_irrigation_tent
        - valve.feed_fill_valve_irrigation_tent
        - valve.flush_fill_valve_irrigation_tent
    - action: input_text.set_value
      target:
        entity_id: input_text.irrigation_status
      data:
        value: Idle
    mode: single

  - id: automation.irrigation_feed_empty_block
    alias: Irrigation — Block Feed When Reservoir Dry
    description: Turns off feed pump and valve immediately if activated while feed reservoir is dry
    triggers:
    - trigger: state
      entity_id:
      - switch.feed_pump_irrigation_tent
      to: 'on'
    - trigger: state
      entity_id: valve.feed_valve_irrigation_tent
      to: open
    conditions:
    - condition: state
      entity_id: binary_sensor.feed_empty_irrigation_tent
      state: 'off'
    actions:
    - action: switch.turn_off
      target:
        entity_id: switch.feed_pump_irrigation_tent
    - action: valve.close_valve
      target:
        entity_id: valve.feed_valve_irrigation_tent
    - action: notify.mobile_app_sm_a166w
      data:
        title: Feed Blocked — Reservoir Dry
        message: Feed pump or valve turned off. Feed reservoir is dry.
    mode: single

  - id: automation.irrigation_flush_empty_block
    alias: Irrigation — Block Flush When Reservoir Dry
    description: Turns off flush pump and valve immediately if activated while flush reservoir is dry
    triggers:
    - trigger: state
      entity_id:
      - switch.flush_pump_irrigation_tent

grow_tent_irrigation:
# ================================================
# Grow Tent — Irrigation Package
# ================================================

# --- HELPERS ---

  input_datetime:
    daily_setup_time:
      name: Daily Setup Time
      has_date: false
      has_time: true
      icon: mdi:calendar-clock

    last_feed_time:
      name: Last Feed Time
      has_date: true
      has_time: true
      icon: mdi:history

    night_pulse_veg_1:
      name: Night Pulse Veg 1
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_veg_2:
      name: Night Pulse Veg 2
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_1:
      name: Night Pulse Flower 1
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_2:
      name: Night Pulse Flower 2
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_3:
      name: Night Pulse Flower 3
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_4:
      name: Night Pulse Flower 4
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_5:
      name: Night Pulse Flower 5
      has_date: false
      has_time: true
      icon: mdi:weather-night

  input_number:
    night_pulse_stir_pre_minutes:
      name: Night Pulse Stir Pre Duration
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:rotate-3d-variant

    night_pulse_air_minutes:
      name: Night Pulse Air Duration
      min: 5
      max: 55
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier

    night_pulse_stir_post_minutes:
      name: Night Pulse Stir Post Duration
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:rotate-3d-variant

    feed_fill_timeout_seconds:
      name: Feed Fill Timeout
      min: 60
      max: 600
      step: 10
      unit_of_measurement: s
      mode: box
      icon: mdi:timer-sand

    flush_fill_timeout_seconds:
      name: Flush Fill Timeout
      min: 60
      max: 600
      step: 10
      unit_of_measurement: s
      mode: box
      icon: mdi:timer-sand

    maintenance_interval_minutes:
      name: Maintenance Interval
      min: 30
      max: 480
      step: 10
      unit_of_measurement: min
      mode: box
      icon: mdi:timer-sync
    maintenance_stir_minutes:
      name: Maintenance Stir Duration
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:rotate-3d-variant
    maintenance_air_minutes:
      name: Maintenance Air Duration
      min: 1
      max: 60
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier

    line_clear_minutes:
      name: Line Clear Duration
      min: 0.5
      max: 10
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:water-sync

    flush_day_interval:
      name: Flush Day Interval
      min: 1
      max: 14
      step: 1
      unit_of_measurement: days
      mode: box
      icon: mdi:calendar-sync

    tent_irrigation_day_counter:
      name: Tent Irrigation Day Counter
      min: 0
      max: 30
      step: 1
      mode: box
      icon: mdi:counter
      initial: 0

    # --- Per-stage feed profile (added 2026-06-20) ---
    # Baseline feed-duration + feeds-per-day for each growth stage.
    # input_select.feed_stage selects which is active; the
    # "Apply Feed Stage Profile" automation copies the selected stage's values
    # into feed_duration_minutes + feeds_per_day_2 (which the feed cycle and
    # schedule already read). input_number state persists, so baselines carry
    # over to the next crop. Flush timing is intentionally NOT staged.
    feed_dur_seedling:
      name: "Feed Duration — Seedling"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_early_veg:
      name: "Feed Duration — Early Veg"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_medium_veg:
      name: "Feed Duration — Medium Veg"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_late_veg:
      name: "Feed Duration — Late Veg"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_early_flower:
      name: "Feed Duration — Early Flower"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_mid_flower:
      name: "Feed Duration — Mid Flower"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_late_flower:
      name: "Feed Duration — Late Flower"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feeds_seedling:
      name: "Feeds/Day — Seedling"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_early_veg:
      name: "Feeds/Day — Early Veg"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_medium_veg:
      name: "Feeds/Day — Medium Veg"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_late_veg:
      name: "Feeds/Day — Late Veg"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_early_flower:
      name: "Feeds/Day — Early Flower"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_mid_flower:
      name: "Feeds/Day — Mid Flower"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_late_flower:
      name: "Feeds/Day — Late Flower"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter

  input_select:
    feed_stage:
      name: Feed Stage
      options:
        - Seedling
        - Early Veg
        - Medium Veg
        - Late Veg
        - Early Flower
        - Mid Flower
        - Late Flower
      icon: mdi:sprout

  input_boolean:
    tent_irrigation_kill_automations:
      name: "Kill Tent Irrigation Automations"
      icon: mdi:robot-off

    irrigation_tent_kill:
      name: "Irrigation Tent — All Off"
      icon: mdi:power-off

# --- SCRIPTS ---


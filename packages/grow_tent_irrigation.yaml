grow_tent_irrigation:
# ================================================
# Grow Tent — Irrigation Package
# ================================================

# --- HELPERS ---

  input_datetime:
    daily_setup_time:
      name: Daily Setup Time
      has_date: false
      has_time: true
      initial: "17:00:00"
      icon: mdi:calendar-clock

    night_pulse_veg_1:
      name: Night Pulse Veg 1
      has_date: false
      has_time: true
      initial: "14:00:00"
      icon: mdi:weather-night

    night_pulse_veg_2:
      name: Night Pulse Veg 2
      has_date: false
      has_time: true
      initial: "16:00:00"
      icon: mdi:weather-night

    night_pulse_flower_1:
      name: Night Pulse Flower 1
      has_date: false
      has_time: true
      initial: "08:00:00"
      icon: mdi:weather-night

    night_pulse_flower_2:
      name: Night Pulse Flower 2
      has_date: false
      has_time: true
      initial: "10:00:00"
      icon: mdi:weather-night

    night_pulse_flower_3:
      name: Night Pulse Flower 3
      has_date: false
      has_time: true
      initial: "12:00:00"
      icon: mdi:weather-night

    night_pulse_flower_4:
      name: Night Pulse Flower 4
      has_date: false
      has_time: true
      initial: "14:00:00"
      icon: mdi:weather-night

    night_pulse_flower_5:
      name: Night Pulse Flower 5
      has_date: false
      has_time: true
      initial: "16:00:00"
      icon: mdi:weather-night

  input_number:
    night_pulse_stir_pre_minutes:
      name: Night Pulse Stir Pre Duration
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:rotate-3d-variant
      initial: 7

    night_pulse_air_minutes:
      name: Night Pulse Air Duration
      min: 5
      max: 55
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier
      initial: 45

    night_pulse_stir_post_minutes:
      name: Night Pulse Stir Post Duration
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:rotate-3d-variant
      initial: 5

    feed_fill_timeout_seconds:
      name: Feed Fill Timeout
      min: 60
      max: 600
      step: 10
      unit_of_measurement: s
      mode: box
      icon: mdi:timer-sand
      initial: 230

    flush_fill_timeout_seconds:
      name: Flush Fill Timeout
      min: 60
      max: 600
      step: 10
      unit_of_measurement: s
      mode: box
      icon: mdi:timer-sand
      initial: 170

    maintenance_interval_minutes:
      name: Maintenance Interval
      min: 30
      max: 480
      step: 10
      unit_of_measurement: min
      mode: box
      icon: mdi:timer-sync
      initial: 120
    maintenance_stir_minutes:
      name: Maintenance Stir Duration
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:rotate-3d-variant
      initial: 5
    maintenance_air_minutes:
      name: Maintenance Air Duration
      min: 1
      max: 60
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier
      initial: 20

    line_clear_minutes:
      name: Line Clear Duration
      min: 0.5
      max: 10
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:water-sync
      initial: 3

    flush_day_interval:
      name: Flush Day Interval
      min: 1
      max: 14
      step: 1
      unit_of_measurement: days
      mode: box
      icon: mdi:calendar-sync
      initial: 3

    irrigation_day_counter:
      name: Irrigation Day Counter
      min: 0
      max: 30
      step: 1
      mode: box
      icon: mdi:counter
      initial: 0


  input_boolean:
    irrigation_kill_automations:
      name: "Kill Irrigation Automations"
      icon: mdi:robot-off

    irrigation_tent_kill:
      name: "Irrigation Tent — All Off"
      icon: mdi:power-off

# --- SCRIPTS ---


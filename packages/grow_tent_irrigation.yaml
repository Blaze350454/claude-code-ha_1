grow_tent_irrigation:
# ================================================
# Grow Tent — Irrigation Package
# ================================================

# --- HELPERS ---

  input_datetime:
    daily_setup_time:
      name: Daily Setup Time
      has_date: false
      has_time: true
      icon: mdi:calendar-clock

    last_feed_time:
      name: Last Feed Time
      has_date: true
      has_time: true
      icon: mdi:history

    # Flush event timestamps (mirror of last_feed_time / next_feed_time).
    # last_flush_time is stamped whenever a line-clear flush actually runs —
    # the daily in-feed flush (run_feed_cycle) or a manual Flush Now. The flush
    # reservoir SERVICE/stir anchor (last_flush_service) is separate.
    # next_flush_time is recomputed by script.tent_irrigation_set_next_flush.
    last_flush_time:
      name: Last Flush Time
      has_date: true
      has_time: true
      icon: mdi:history
    next_flush_time:
      name: Next Flush Time
      has_date: true
      has_time: true
      icon: mdi:water-sync

    # Deficit/credit anchors: tent_stir_burst stamps the per-tank anchor each time
    # it stirs that tank (pre-feed/pre-flush/baseline). The baseline top-up stirs a
    # tank only when now - its anchor >= baseline interval. Tracked PER TANK so that
    # frequent feeds (which only stir feed) still let the flush tank get its periodic
    # baseline stir — flush carries pH Down and must not go unstirred/stale.
    last_feed_service:
      name: Last Feed-Reservoir Service
      has_date: true
      has_time: true
      icon: mdi:water-sync
    last_flush_service:
      name: Last Flush-Reservoir Service
      has_date: true
      has_time: true
      icon: mdi:water-sync

    night_pulse_veg_1:
      name: Night Pulse Veg 1
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_veg_2:
      name: Night Pulse Veg 2
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_1:
      name: Night Pulse Flower 1
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_2:
      name: Night Pulse Flower 2
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_3:
      name: Night Pulse Flower 3
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_4:
      name: Night Pulse Flower 4
      has_date: false
      has_time: true
      icon: mdi:weather-night

    night_pulse_flower_5:
      name: Night Pulse Flower 5
      has_date: false
      has_time: true
      icon: mdi:weather-night

  input_number:
    # Active feed length (copied from the per-stage feed_dur_* helpers by the
    # feed-stage profile automation). Read by the feed cycle + schedule.
    feed_duration:
      name: Feed Duration
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer

    night_pulse_stir_pre_duration:
      name: Night Pulse Stir Pre Duration
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:rotate-3d-variant

    night_pulse_air_duration:
      name: Night Pulse Air Duration
      min: 5
      max: 55
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier

    night_pulse_stir_post_duration:
      name: Night Pulse Stir Post Duration
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:rotate-3d-variant

    feed_fill_timeout_duration:
      name: Feed Fill Timeout
      min: 60
      max: 600
      step: 10
      unit_of_measurement: s
      mode: box
      icon: mdi:timer-sand

    flush_fill_timeout_duration:
      name: Flush Fill Timeout
      min: 60
      max: 600
      step: 10
      unit_of_measurement: s
      mode: box
      icon: mdi:timer-sand

    # TOTAL scheduled line-clear flush period (run_feed_cycle); the end-of-line
    # drain valve is open for the LAST 30 s of it.
    # Default/original value was 6 min; running 3.5 min as of 2026-07-05 (user).
    daily_flush_duration:
      name: Daily Flush Duration
      min: 0.5
      max: 10
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:water-sync

    # Manual feed length (script.run_feed_now / "Feed Now"). Separate from the
    # automated scheduled feed cycle.
    feed_now_duration:
      name: Feed Now Duration
      min: 1
      max: 60
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:watering-can

    # Manual end-of-day plant flush length (script.run_flush_now / "Flush Now"):
    # TOTAL time the flush pump + flush valve are open. Separate from the
    # automated in-feed daily flush above.
    flush_now_duration:
      name: Flush Now Duration
      min: 1
      max: 60
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:water-sync

    # Drain tail for the manual flush (added 2026-07-05): the end-of-line drain
    # valve is open for the LAST this-many minutes of flush_now_duration
    # (clamped to the total in the script). Max 5 keeps it under the 10 min
    # drain-valve watchdog threshold.
    flush_now_drain_duration:
      name: Flush Now Drain Duration
      min: 0.5
      max: 5
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:valve

    daily_flush_day_interval:
      name: Daily Flush Interval
      min: 1
      max: 14
      step: 1
      unit_of_measurement: days
      mode: box
      icon: mdi:calendar-sync

    tent_irrigation_day_counter:
      name: Tent Irrigation Day Counter
      min: 0
      max: 30
      step: 1
      mode: box
      icon: mdi:counter
      initial: 0

    # --- Per-stage feed profile (added 2026-06-20) ---
    # Baseline feed-duration + feeds-per-day for each growth stage.
    # input_select.feed_stage selects which is active; the
    # "Apply Feed Stage Profile" automation copies the selected stage's values
    # into feed_duration + feeds_per_day_2 (which the feed cycle and
    # schedule already read). input_number state persists, so baselines carry
    # over to the next crop. Flush timing is intentionally NOT staged.
    feed_dur_seedling:
      name: "Feed Duration — Seedling"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_early_veg:
      name: "Feed Duration — Early Veg"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_medium_veg:
      name: "Feed Duration — Medium Veg"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_late_veg:
      name: "Feed Duration — Late Veg"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_early_flower:
      name: "Feed Duration — Early Flower"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_mid_flower:
      name: "Feed Duration — Mid Flower"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feed_dur_late_flower:
      name: "Feed Duration — Late Flower"
      min: 0.5
      max: 13
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer
    feeds_seedling:
      name: "Feeds/Day — Seedling"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_early_veg:
      name: "Feeds/Day — Early Veg"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_medium_veg:
      name: "Feeds/Day — Medium Veg"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_late_veg:
      name: "Feeds/Day — Late Veg"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_early_flower:
      name: "Feeds/Day — Early Flower"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_mid_flower:
      name: "Feeds/Day — Mid Flower"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter
    feeds_late_flower:
      name: "Feeds/Day — Late Flower"
      min: 2
      max: 12
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:counter

    # --- Air/Stir ↔ Feed coordination (added 2026-06-23) ---
    # Stir is sized by reservoir level: minutes = (rounded_vol_L / stir_pump_lpm)
    #   * turnover.  Volume uses the float level ROUNDED UP to the next float.
    stir_pump_lpm:
      name: "Stir Pump Flow"
      min: 5
      max: 60
      step: 1
      unit_of_measurement: "L/min"
      mode: box
      icon: mdi:pump
    feed_reservoir_liters:
      name: "Feed Reservoir Volume"
      min: 10
      max: 200
      step: 1
      unit_of_measurement: "L"
      mode: box
      icon: mdi:cup-water
    flush_reservoir_liters:
      name: "Flush Reservoir Volume"
      min: 10
      max: 200
      step: 1
      unit_of_measurement: "L"
      mode: box
      icon: mdi:cup-water
    stir_turnover_prefeed:
      name: "Stir Turnover — Pre-Feed"
      min: 0.25
      max: 3
      step: 0.25
      unit_of_measurement: "x"
      mode: box
      icon: mdi:rotate-3d-variant
    stir_turnover_baseline:
      name: "Stir Turnover — Baseline"
      min: 0.25
      max: 3
      step: 0.25
      unit_of_measurement: "x"
      mode: box
      icon: mdi:rotate-3d-variant
    feed_settle_duration:
      name: "Feed Settle (stir/air off before feed)"
      min: 0
      max: 10
      step: 0.5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer-pause
    pre_feed_lead_duration:
      name: "Pre-Feed Lead (stir window before feed)"
      min: 2
      max: 20
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:clock-start
    baseline_service_interval_duration:
      name: "Baseline Service Interval"
      min: 20
      max: 240
      step: 5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer-sync
    # --- Flush reservoir light schedule (added 2026-06-25) ---
    # Flush is clean water used only at end-of-day. Periodic STIR runs on its own
    # interval below (24/7, incl. overnight, via the maintenance cycle). Flush is
    # NOT periodically aired — it gets a full aeration only right before each flush
    # (flush_pre_use_air_duration), plus a homogenize stir, then the draw.
    flush_service_interval_duration:
      name: "Flush Stir Interval"
      min: 30
      max: 1440
      step: 15
      unit_of_measurement: min
      mode: box
      icon: mdi:timer-sync-outline
    flush_stir_turnover:
      name: "Flush Stir Turnover (periodic)"
      min: 0.25
      max: 3
      step: 0.25
      unit_of_measurement: "x"
      mode: box
      icon: mdi:rotate-3d-variant
    flush_pre_use_air_duration:
      name: "Flush Pre-Use Air (aerate before flush)"
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier
    feeds_per_day_max:
      name: "Feeds/Day Max (auto, per stage)"
      min: 1
      max: 48
      step: 1
      unit_of_measurement: feeds
      mode: box
      icon: mdi:car-speed-limiter

  input_select:
    feed_stage:
      name: Feed Stage
      options:
        - Seedling
        - Early Veg
        - Medium Veg
        - Late Veg
        - Early Flower
        - Mid Flower
        - Late Flower
      icon: mdi:sprout

  input_boolean:
    tent_irrigation_kill_automations:
      name: "Kill Tent Irrigation Automations"
      icon: mdi:robot-off

    irrigation_tent_kill:
      name: "Irrigation Tent — All Off"
      icon: mdi:power-off

    # Stops only water DELIVERY to the table (feed/flush pumps + feed/flush/drain
    # valves) and aborts any running feed/flush. Reservoir fills + table drain + air
    # + stir keep running. Reacted to by "Toggle — Irrigation Tent Stop Water".
    irrigation_tent_kill_water:
      name: "Irrigation Tent — Stop Water"
      icon: mdi:water-off

    # Stops only reservoir AIR + STIR (air pump + both stir pumps) and disables the
    # air/stir automations. Water plumbing is untouched. Reacted to by
    # "Toggle — Irrigation Tent Stop Air/Stir".
    irrigation_tent_kill_aeration:
      name: "Irrigation Tent — Stop Air/Stir"
      icon: mdi:air-filter

    # On while a Feed Now is running; lets the Feed Now button act as a
    # toggle (second press cancels). Set/cleared by script.run_feed_now.
    feed_now_running:
      name: "Feed Now Running"
      icon: mdi:watering-can

    # On while a Flush Now is running; lets the Flush Now button act as a
    # toggle (second press cancels). Set/cleared by script.run_flush_now.
    flush_now_running:
      name: "Flush Now Running"
      icon: mdi:water-sync

# --- SCRIPTS ---


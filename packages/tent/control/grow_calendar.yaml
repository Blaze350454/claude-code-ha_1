# Grow Calendar — date-based grow stage stat sheet.
#
# STATISTICAL ONLY (current state): editable stage-start dates + harvest date,
# plus derived sensors (scheduled stage, grow day, stage day, days to next
# stage / harvest) for the Tent dashboard. Nothing here changes any selector,
# schedule, or device.
#
# UPGRADE PATH (auto stage control): uncomment the `automation:` block at the
# bottom and push. It sets input_select.feed_stage and a mapped
# input_select.grow_tent_growth_stage when the scheduled stage changes, gated
# by input_boolean.grow_calendar_linked (declared below, default off). Then add
# the linked toggle to the dashboard's Grow Calendar section.
#
# Date semantics: each date is the day that stage STARTS. Scheduled stage =
# the latest stage in stage order whose date is <= today; dates set out of
# order resolve to the later stage in stage order. Unset dates read
# 1970-01-01, so anything < 2020-01-01 is treated as unset (ISO date strings
# compare correctly as plain strings).

tent_control_grow_calendar:

  input_datetime:
    grow_stage_seedling_date:
      name: "Grow — Seedling Start (Grow Start)"
      has_date: true
      has_time: false
      icon: mdi:sprout
    grow_stage_early_veg_date:
      name: "Grow — Early Veg Start"
      has_date: true
      has_time: false
      icon: mdi:leaf
    grow_stage_medium_veg_date:
      name: "Grow — Medium Veg Start"
      has_date: true
      has_time: false
      icon: mdi:leaf
    grow_stage_late_veg_date:
      name: "Grow — Late Veg Start"
      has_date: true
      has_time: false
      icon: mdi:leaf
    grow_stage_early_flower_date:
      name: "Grow — Early Flower Start"
      has_date: true
      has_time: false
      icon: mdi:flower-outline
    grow_stage_mid_flower_date:
      name: "Grow — Mid Flower Start"
      has_date: true
      has_time: false
      icon: mdi:flower
    grow_stage_late_flower_date:
      name: "Grow — Late Flower Start"
      has_date: true
      has_time: false
      icon: mdi:flower
    grow_harvest_date:
      name: "Grow — Harvest Date"
      has_date: true
      has_time: false
      icon: mdi:scissors-cutting
    # NO initial: on any helper — values must survive the push-triggered restarts.

  input_boolean:
    grow_active:
      name: "Grow Active"
      icon: mdi:leaf-circle
    # Used only by the (commented) advance automation below. Kept declared so
    # the upgrade is uncomment-only. Default off; harmless while unused.
    grow_calendar_linked:
      name: "Grow Calendar Linked"
      icon: mdi:link-variant

  input_text:
    # Notification dedupe latch for the (commented) advance automation.
    # NO initial: — must survive restarts or every push would re-notify.
    grow_calendar_last_announced:
      name: "Grow Calendar Last Announced Stage"
      max: 32

  template:
    - sensor:
        - name: "Grow Scheduled Stage"
          unique_id: grow_scheduled_stage
          icon: mdi:calendar-star
          state: >
            {% set pairs = [
                ('Seedling',     'input_datetime.grow_stage_seedling_date'),
                ('Early Veg',    'input_datetime.grow_stage_early_veg_date'),
                ('Medium Veg',   'input_datetime.grow_stage_medium_veg_date'),
                ('Late Veg',     'input_datetime.grow_stage_late_veg_date'),
                ('Early Flower', 'input_datetime.grow_stage_early_flower_date'),
                ('Mid Flower',   'input_datetime.grow_stage_mid_flower_date'),
                ('Late Flower',  'input_datetime.grow_stage_late_flower_date'),
                ('Harvest',      'input_datetime.grow_harvest_date'),
            ] %}
            {% set today = now().date().isoformat() %}
            {% set seed = states('input_datetime.grow_stage_seedling_date') %}
            {% set ns = namespace(stage='Not started') %}
            {% if is_state('input_boolean.grow_active', 'on')
                  and seed >= '2020-01-01' and seed <= today %}
              {% for name, ent in pairs %}
                {% set d = states(ent) %}
                {% if d >= '2020-01-01' and d <= today %}
                  {% set ns.stage = name %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {{ ns.stage }}

        - name: "Grow Day"
          unique_id: grow_day
          icon: mdi:counter
          state: >
            {% set seed = states('input_datetime.grow_stage_seedling_date') %}
            {% set today = now().date() %}
            {% if is_state('input_boolean.grow_active', 'on')
                  and seed >= '2020-01-01' and seed <= today.isoformat() %}
              {{ (today - strptime(seed, '%Y-%m-%d').date()).days + 1 }}
            {% else %}
              unknown
            {% endif %}

        - name: "Grow Stage Day"
          unique_id: grow_stage_day
          icon: mdi:calendar-today
          # Day within the current scheduled stage (1-based). When the stage is
          # Harvest this reads "days since harvest date" — the dashboard uses that.
          state: >
            {% set dates = [
                'input_datetime.grow_stage_seedling_date',
                'input_datetime.grow_stage_early_veg_date',
                'input_datetime.grow_stage_medium_veg_date',
                'input_datetime.grow_stage_late_veg_date',
                'input_datetime.grow_stage_early_flower_date',
                'input_datetime.grow_stage_mid_flower_date',
                'input_datetime.grow_stage_late_flower_date',
                'input_datetime.grow_harvest_date',
            ] %}
            {% set today = now().date().isoformat() %}
            {% set seed = states('input_datetime.grow_stage_seedling_date') %}
            {% set ns = namespace(date='') %}
            {% if is_state('input_boolean.grow_active', 'on')
                  and seed >= '2020-01-01' and seed <= today %}
              {% for ent in dates %}
                {% set d = states(ent) %}
                {% if d >= '2020-01-01' and d <= today %}
                  {% set ns.date = d %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% if ns.date == '' %}
              unknown
            {% else %}
              {{ (now().date() - strptime(ns.date, '%Y-%m-%d').date()).days + 1 }}
            {% endif %}

        - name: "Grow Days To Next Stage"
          unique_id: grow_days_to_next_stage
          icon: mdi:calendar-arrow-right
          # First stage in stage order whose date is strictly in the future.
          state: >
            {% set pairs = [
                ('Seedling',     'input_datetime.grow_stage_seedling_date'),
                ('Early Veg',    'input_datetime.grow_stage_early_veg_date'),
                ('Medium Veg',   'input_datetime.grow_stage_medium_veg_date'),
                ('Late Veg',     'input_datetime.grow_stage_late_veg_date'),
                ('Early Flower', 'input_datetime.grow_stage_early_flower_date'),
                ('Mid Flower',   'input_datetime.grow_stage_mid_flower_date'),
                ('Late Flower',  'input_datetime.grow_stage_late_flower_date'),
                ('Harvest',      'input_datetime.grow_harvest_date'),
            ] %}
            {% set today = now().date().isoformat() %}
            {% set ns = namespace(d='') %}
            {% if is_state('input_boolean.grow_active', 'on') %}
              {% for name, ent in pairs %}
                {% set d = states(ent) %}
                {% if ns.d == '' and d >= '2020-01-01' and d <= '2100-12-31'
                      and d > today %}
                  {% set ns.d = d %}
                {% endif %}
              {% endfor %}
            {% endif %}
            {% if ns.d == '' %}
              unknown
            {% else %}
              {{ (strptime(ns.d, '%Y-%m-%d').date() - now().date()).days }}
            {% endif %}
          attributes:
            next_stage: >
              {% set pairs = [
                  ('Seedling',     'input_datetime.grow_stage_seedling_date'),
                  ('Early Veg',    'input_datetime.grow_stage_early_veg_date'),
                  ('Medium Veg',   'input_datetime.grow_stage_medium_veg_date'),
                  ('Late Veg',     'input_datetime.grow_stage_late_veg_date'),
                  ('Early Flower', 'input_datetime.grow_stage_early_flower_date'),
                  ('Mid Flower',   'input_datetime.grow_stage_mid_flower_date'),
                  ('Late Flower',  'input_datetime.grow_stage_late_flower_date'),
                  ('Harvest',      'input_datetime.grow_harvest_date'),
              ] %}
              {% set today = now().date().isoformat() %}
              {% set ns = namespace(stage=none) %}
              {% if is_state('input_boolean.grow_active', 'on') %}
                {% for name, ent in pairs %}
                  {% set d = states(ent) %}
                  {% if ns.stage is none and d >= '2020-01-01'
                        and d <= '2100-12-31' and d > today %}
                    {% set ns.stage = name %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {{ ns.stage }}

        - name: "Grow Days To Harvest"
          unique_id: grow_days_to_harvest
          icon: mdi:scissors-cutting
          # 0 on harvest day, negative after (dashboard formats it).
          state: >
            {% set d = states('input_datetime.grow_harvest_date') %}
            {% if is_state('input_boolean.grow_active', 'on')
                  and d >= '2020-01-01' and d <= '2100-12-31' %}
              {{ (strptime(d, '%Y-%m-%d').date() - now().date()).days }}
            {% else %}
              unknown
            {% endif %}

  script:
    grow_calendar_fill_defaults:
      alias: "Grow Calendar — Fill Dates From Seedling Start"
      description: >
        Fills the seven downstream stage/harvest dates from the seedling start
        date using default stage lengths. Aborts silently if the seedling date
        is unset. Overwrites existing dates — edit individual dates afterward.
      icon: mdi:calendar-refresh
      mode: single
      sequence:
        - variables:
            start: "{{ states('input_datetime.grow_stage_seedling_date') }}"
            # Stage lengths (days) — edit here to change the default schedule.
            # Cumulative offsets: 14 / 28 / 42 / 49 / 70 / 91 / harvest 105.
            len_seedling: 14
            len_early_veg: 14
            len_medium_veg: 14
            len_late_veg: 7
            len_early_flower: 21
            len_mid_flower: 21
            len_late_flower: 14
        - condition: template
          value_template: "{{ start >= '2020-01-01' and start <= '2100-12-31' }}"
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.grow_stage_early_veg_date
          data:
            date: >
              {{ (strptime(start, '%Y-%m-%d')
                  + timedelta(days=len_seedling)).strftime('%Y-%m-%d') }}
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.grow_stage_medium_veg_date
          data:
            date: >
              {{ (strptime(start, '%Y-%m-%d')
                  + timedelta(days=len_seedling + len_early_veg)).strftime('%Y-%m-%d') }}
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.grow_stage_late_veg_date
          data:
            date: >
              {{ (strptime(start, '%Y-%m-%d')
                  + timedelta(days=len_seedling + len_early_veg
                                   + len_medium_veg)).strftime('%Y-%m-%d') }}
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.grow_stage_early_flower_date
          data:
            date: >
              {{ (strptime(start, '%Y-%m-%d')
                  + timedelta(days=len_seedling + len_early_veg
                                   + len_medium_veg + len_late_veg)).strftime('%Y-%m-%d') }}
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.grow_stage_mid_flower_date
          data:
            date: >
              {{ (strptime(start, '%Y-%m-%d')
                  + timedelta(days=len_seedling + len_early_veg + len_medium_veg
                                   + len_late_veg + len_early_flower)).strftime('%Y-%m-%d') }}
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.grow_stage_late_flower_date
          data:
            date: >
              {{ (strptime(start, '%Y-%m-%d')
                  + timedelta(days=len_seedling + len_early_veg + len_medium_veg
                                   + len_late_veg + len_early_flower
                                   + len_mid_flower)).strftime('%Y-%m-%d') }}
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.grow_harvest_date
          data:
            date: >
              {{ (strptime(start, '%Y-%m-%d')
                  + timedelta(days=len_seedling + len_early_veg + len_medium_veg
                                   + len_late_veg + len_early_flower
                                   + len_mid_flower + len_late_flower)).strftime('%Y-%m-%d') }}


tent_control_watchdogs:
  automation:
    # ----------------------------------------------------------------------
    # Critical Irrigation Offline Watchdog
    # Pages immediately when any pillar of the irrigation stack is offline >5 min.
    # Catches: ESP32 controller drop (wifi/power), HS300 (c074) cloud-API crash
    # or network drop.
    #
    # Not watched: KP303 [53db] "Power Strip Tent" — currently unplugged spare
    # with no active outlets. When that strip comes back into use, add a third
    # trigger block for `binary_sensor.tp_link_power_strip_53db_cloud_connection`
    # and matching device_label/hint entries.
    #
    # Tagging applied via Container Home/tag_watchdog_critical_offline.py:
    #   area_id: tent
    #   labels:  sys_irrigation, sev_critical, grow
    # ----------------------------------------------------------------------
    - id: watchdog_irrigation_critical_offline
      alias: "Watchdog — Irrigation Critical Device Offline"
      description: >
        Fires when the ESP32 controller, or the HS300 power strip (c074) cloud
        connection, has been offline for 5+ min. Pushes to phone and posts a
        persistent notification in HA.
      mode: parallel
      max: 5
      triggers:
        # ESP32 tent-irrigation-controller — float switches/valves/sensors all
        # go unavailable together when the device drops, so one entity is a
        # sufficient proxy.
        - trigger: state
          entity_id: binary_sensor.feed_empty_irrigation_tent
          to: unavailable
          for: "00:05:00"
          id: esp32_controller
        - trigger: state
          entity_id: binary_sensor.tp_link_power_strip_c074_cloud_connection
          to:
            - "off"
            - "unavailable"
          for: "00:05:00"
          id: power_strip_c074
      variables:
        device_label:
          esp32_controller: "ESP32 tent-irrigation-controller (float switches, valves, pressure/flow/temp sensors)"
          power_strip_c074: "HS300 power strip [c074 — Tent Irrigation Power Strip] cloud connection lost"
        hint:
          esp32_controller: "Check device power + wifi. ESPHome dashboard: http://192.168.2.14:6052"
          # The old hint pointed at a cloud-API service on :8765. That service is
          # GONE (nothing listens on 8765, no unit exists) — the strip runs on the
          # NATIVE tplink integration now. Verified 2026-08-05.
          power_strip_c074: "Known fix: Tapo app -> toggle Third-Party Services OFF then ON. An HA reload does NOT fix this. If the strip pings but HA shows no kasa retries in the log, that is this exact fault."
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.brenton_s_phone
          data:
            title: "Grow tent: critical device offline"
            message: >-
              {{ device_label[trigger.id] }} — offline 5+ min. {{ hint[trigger.id] }}
        - action: persistent_notification.create
          data:
            notification_id: "watchdog_irrigation_offline_{{ trigger.id }}"
            title: "Critical irrigation device offline"
            message: >-
              **{{ device_label[trigger.id] }}**

              Entity `{{ trigger.entity_id }}` is `{{ trigger.to_state.state }}`
              (since {{ trigger.from_state.last_changed }}).

              {{ hint[trigger.id] }}

    # ----------------------------------------------------------------------
    # Load Not Drawing Current Watchdog (2026-10-31)
    # A strip socket switched ON whose HS300 meter reads ~0 A means the load is
    # dead, unplugged, or its supply failed. Warn-only: nothing is switched.
    #
    # Timing: the HS300 meters poll about once a minute, and last_reported only
    # moves when the value changes, so a check at exactly 30 s can still hold the
    # 0 A from before switch-on. After 30 s ON it therefore waits up to 75 s for
    # a real reading before judging (a dead load alerts ~1.5 min after switch-on).
    # The second trigger per load catches one that dies mid-run.
    #
    # The irrigation controller socket is always on, so it only has the mid-run
    # style trigger, with a lower threshold: the ESP draws ~0.06 A.
    # ----------------------------------------------------------------------
    - id: watchdog_irrigation_load_no_current
      alias: "Watchdog — Irrigation Load ON But Drawing No Current"
      description: >
        Fires when an HS300 irrigation socket is switched on but its current
        meter still reads ~0 A after a fresh reading. Pushes to phone and posts
        a persistent notification in HA. Warn-only.
      mode: parallel
      max: 6
      triggers:
        - trigger: state
          entity_id: switch.feed_pump_irrigation_tent
          to: "on"
          for: "00:00:30"
          id: feed_pump
        - trigger: numeric_state
          entity_id: sensor.feed_pump_current_irrigation_tent
          below: 0.05
          for: "00:01:30"
          id: feed_pump
        - trigger: state
          entity_id: switch.feed_stir_pump_irrigation_tent
          to: "on"
          for: "00:00:30"
          id: feed_stir_pump
        - trigger: numeric_state
          entity_id: sensor.feed_stir_pump_current_irrigation_tent
          below: 0.05
          for: "00:01:30"
          id: feed_stir_pump
        - trigger: state
          entity_id: switch.flush_stir_pump_irrigation_tent
          to: "on"
          for: "00:00:30"
          id: flush_stir_pump
        - trigger: numeric_state
          entity_id: sensor.flush_stir_pump_current_irrigation_tent
          below: 0.05
          for: "00:01:30"
          id: flush_stir_pump
        - trigger: state
          entity_id: switch.air_pump_irrigation_tent
          to: "on"
          for: "00:00:30"
          id: air_pump
        - trigger: numeric_state
          entity_id: sensor.air_pump_current_irrigation_tent
          below: 0.05
          for: "00:01:30"
          id: air_pump
        - trigger: numeric_state
          entity_id: sensor.irrigation_controller_current_irrigation_tent
          below: 0.02
          for: "00:03:00"
          id: irrigation_controller
      variables:
        names:
          feed_pump: "Feed Pump (irrigation pump)"
          feed_stir_pump: "Feed Stir Pump"
          flush_stir_pump: "Flush Stir Pump"
          air_pump: "Air Pump"
          irrigation_controller: "Irrigation Controller (ESP32 supply)"
        thresholds:
          feed_pump: 0.05
          feed_stir_pump: 0.05
          flush_stir_pump: 0.05
          air_pump: 0.05
          irrigation_controller: 0.02
        load: "{{ trigger.id }}"
        name: "{{ names[load] }}"
        threshold: "{{ thresholds[load] }}"
        switch_entity: "switch.{{ load }}_irrigation_tent"
        current_entity: "sensor.{{ load }}_current_irrigation_tent"
      conditions:
        - condition: template
          value_template: "{{ is_state(switch_entity, 'on') }}"
        # Non-numeric (strip unavailable) is the offline watchdog's job, not this one.
        - condition: template
          value_template: >-
            {{ is_number(states(current_entity))
               and states(current_entity) | float < threshold | float }}
      actions:
        - wait_template: >-
            {{ not is_state(switch_entity, 'on')
               or states(current_entity) | float(0) >= threshold | float }}
          timeout: "00:01:15"
          continue_on_timeout: true
        - condition: template
          value_template: >-
            {{ is_state(switch_entity, 'on')
               and is_number(states(current_entity))
               and states(current_entity) | float < threshold | float }}
        - action: notify.send_message
          target:
            entity_id: notify.brenton_s_phone
          data:
            title: "Grow tent: {{ name }} not running"
            message: >-
              {{ name }} is switched ON but draws {{ states(current_entity) }} A.
              Dead, unplugged, or its supply failed.
        - action: persistent_notification.create
          data:
            notification_id: "watchdog_irrigation_no_current_{{ load }}"
            title: "{{ name }} ON but drawing no current"
            message: >-
              `{{ switch_entity }}` is **on** but `{{ current_entity }}` reads
              **{{ states(current_entity) }} A** (threshold {{ threshold }} A) at
              {{ now().strftime('%H:%M:%S') }}. Check the load is plugged in and alive.

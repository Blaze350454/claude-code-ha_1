tent_control_stage_changes:
  automation:
    - id: humidity_mode_changed
      alias: "Humidity - Mode Changed"
      trigger:
        - platform: state
          entity_id: input_select.tent_humidity_mode
      action:
        - choose:
        # Switched to Humidify — shut off dehumidifier + AC dry
            - conditions:
                - condition: state
                  entity_id: input_select.tent_humidity_mode
                  state: "Humidify"
              sequence:
                - service: humidifier.turn_off
                  target:
                    entity_id: humidifier.dehumidifier_tent

        # Switched to Dehumidify — shut off humidifier fogger + fan
            - conditions:
                - condition: state
                  entity_id: input_select.tent_humidity_mode
                  state: "Dehumidify"
              sequence:
                - service: switch.turn_off
                  target:
                    entity_id: switch.humidifier
                - service: fan.turn_off
                  target:
                    entity_id: fan.grow_tent_one_humidifier_fan_pwm

        # Switched to Off — shut off everything
            - conditions:
                - condition: state
                  entity_id: input_select.tent_humidity_mode
                  state: "Off"
              sequence:
                - service: switch.turn_off
                  target:
                    entity_id: switch.humidifier
                - service: fan.turn_off
                  target:
                    entity_id: fan.grow_tent_one_humidifier_fan_pwm
                - service: humidifier.turn_off
                  target:
                    entity_id: humidifier.dehumidifier_tent

########## HUMIDIFY MODE ##########

# Turn ON fogger + fan when RH drops below (target - hysteresis)
    - id: ac_stage_change_defaults
      alias: "AC — Stage Change Defaults"
      description: >
        When growth stage changes, auto-set day/night temperature targets
        to recommended cannabis values. Other selectors are not changed.
      triggers:
        - trigger: state
          entity_id: input_select.grow_tent_growth_stage
      conditions:
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
      actions:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Seedling
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.tent_day_temp_target
                  data:
                    value: 23
                - action: input_number.set_value
                  target:
                    entity_id: input_number.tent_night_temp_target
                  data:
                    value: 20
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Vegetative
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.tent_day_temp_target
                  data:
                    value: 25
                - action: input_number.set_value
                  target:
                    entity_id: input_number.tent_night_temp_target
                  data:
                    value: 20
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Flowering
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.tent_day_temp_target
                  data:
                    value: 24
                - action: input_number.set_value
                  target:
                    entity_id: input_number.tent_night_temp_target
                  data:
                    value: 19
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Harvest
              sequence:
                - action: climate.set_hvac_mode
                  target:
                    entity_id: climate.air_conditioner_tent
                  data:
                    hvac_mode: "off"
        - action: persistent_notification.create
          data:
            title: "AC — Stage Defaults Updated"
            message: >
              Growth stage changed to {{ states('input_select.grow_tent_growth_stage') }}.
              Day target: {{ states('input_number.tent_day_temp_target') }}°C,
              Night target: {{ states('input_number.tent_night_temp_target') }}°C.
      mode: single
    - id: humidity_stage_change_defaults
      alias: "Humidity — Stage Change Defaults"
      description: >
        When growth stage changes, auto-set day/night humidity targets to
        recommended cannabis values. User can still override from dashboard.
      triggers:
        - trigger: state
          entity_id: input_select.grow_tent_growth_stage
      conditions:
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
      actions:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Seedling
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.humidity_day_target
                  data:
                    value: 65
                - action: input_number.set_value
                  target:
                    entity_id: input_number.humidity_night_target
                  data:
                    value: 60
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Vegetative
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.humidity_day_target
                  data:
                    value: 60
                - action: input_number.set_value
                  target:
                    entity_id: input_number.humidity_night_target
                  data:
                    value: 55
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Flowering
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.humidity_day_target
                  data:
                    value: 45
                - action: input_number.set_value
                  target:
                    entity_id: input_number.humidity_night_target
                  data:
                    value: 40
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Harvest
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.humidity_day_target
                  data:
                    value: 45
                - action: input_number.set_value
                  target:
                    entity_id: input_number.humidity_night_target
                  data:
                    value: 40
        - action: persistent_notification.create
          data:
            title: "Humidity — Stage Defaults Updated"
            message: >
              Growth stage changed to {{ states('input_select.grow_tent_growth_stage') }}.
              Day RH target: {{ states('input_number.humidity_day_target') }}%,
              Night RH target: {{ states('input_number.humidity_night_target') }}%.
      mode: single

    - id: vpd_stage_change_defaults
      alias: "VPD — Stage Change Defaults"
      description: >
        When growth stage changes, auto-set VPD day/night targets to
        recommended cannabis values. User can override from dashboard.
      triggers:
        - trigger: state
          entity_id: input_select.grow_tent_growth_stage
      conditions:
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
      actions:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Seedling
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.vpd_day_target
                  data:
                    value: 0.6
                - action: input_number.set_value
                  target:
                    entity_id: input_number.vpd_night_target
                  data:
                    value: 0.5
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Vegetative
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.vpd_day_target
                  data:
                    value: 1.0
                - action: input_number.set_value
                  target:
                    entity_id: input_number.vpd_night_target
                  data:
                    value: 0.8
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Flowering
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.vpd_day_target
                  data:
                    value: 1.2
                - action: input_number.set_value
                  target:
                    entity_id: input_number.vpd_night_target
                  data:
                    value: 1.0
            - conditions:
                - condition: state
                  entity_id: input_select.grow_tent_growth_stage
                  state: Harvest
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.vpd_day_target
                  data:
                    value: 1.2
                - action: input_number.set_value
                  target:
                    entity_id: input_number.vpd_night_target
                  data:
                    value: 1.0
        - action: persistent_notification.create
          data:
            title: "VPD — Stage Defaults Updated"
            message: >
              Growth stage changed to {{ states('input_select.grow_tent_growth_stage') }}.
              VPD day target: {{ states('input_number.vpd_day_target') }} kPa,
              VPD night target: {{ states('input_number.vpd_night_target') }} kPa.
      mode: single


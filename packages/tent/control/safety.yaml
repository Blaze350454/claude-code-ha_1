tent_control_safety:
  automation:
    - id: safety_flower_night_humidifier_shutoff
      alias: "Safety — Flower Night Humidifier Shutoff (state-enforced)"
      description: >
        Continuously enforce: during flower stages with lights off and the
        bud-rot block enabled, the humidifier fogger and PWM fan must be off.
        Fires on relevant edges (lights-off, fogger-on, fan-on) AND re-checks
        every minute so a missed state transition can't leave the fogger
        running into a flower night.
      triggers:
        - trigger: state
          entity_id: binary_sensor.tent_lights_on
          to: "off"
        - trigger: state
          entity_id: switch.tent_humidifier
          to: "on"
        - trigger: state
          entity_id: fan.tent_humidifier_fan_pwm
          to: "on"
        - trigger: time_pattern
          minutes: "/1"
      conditions:
        - condition: template
          value_template: >
            {{ states('input_select.grow_tent_growth_stage')
               in ['Early Flower', 'Flower', 'Late Flower'] }}
        - condition: state
          entity_id: binary_sensor.tent_lights_on
          state: "off"
        - condition: state
          entity_id: input_boolean.tent_flower_night_humidifier_block
          state: "on"
    # Only act when something is actually on — keeps the periodic /1 trigger
    # silent during the long stretches when everything is already correct.
        - condition: or
          conditions:
            - condition: state
              entity_id: switch.tent_humidifier
              state: "on"
            - condition: state
              entity_id: fan.tent_humidifier_fan_pwm
              state: "on"
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.tent_humidifier
        - action: fan.turn_off
          target:
            entity_id: fan.tent_humidifier_fan_pwm
        - action: persistent_notification.create
          data:
            notification_id: flower_night_humidifier_shutoff
            title: "Humidifier Blocked — Flower Night"
            message: >
              {{ now().strftime('%Y-%m-%d %H:%M:%S') }} — humidifier shut off
              during {{ states('input_select.grow_tent_growth_stage') }} (lights off).
              Disable 'Block Humidifier During Flower Nights' toggle to override.
      mode: single
    - id: safety_table_drain_flood_stop
      alias: "Safety — Table Drain Flood Stop"
      description: >
        When the table drain float reports FULL, close inflow valves and stop
        feed/flush pumps so no more water enters the tent. Drain loop is
        intentionally untouched — the existing `Irrigation — Table Drain Pump`
        automation runs the drain pump and must keep power.

        Pump shutdowns are issued one outlet at a time with 300 ms between
        them. A simultaneous burst against the HS300 (5 outlets at once via
        label_id) was observed to also drop outlet E05 (the ESP32) and the
        strip master, killing the drain pump and creating a flood deadlock.
        At the end we explicitly turn the strip master, the ESP32 outlet,
        and the sonoff tent controller back ON as a guardrail so any stray
        cascade self-heals within seconds.

        Fires regardless of the automation-enabled master toggle (safety first).
      triggers:
        - trigger: state
          entity_id: binary_sensor.table_drain_full
          to: "on"
          for: "00:01:00"
      actions:
        - action: valve.close_valve
          target:
            label_id:
              - sys_irrigation
              - fn_valve
              - sub_irrigation_feed_loop
        - action: valve.close_valve
          target:
            label_id:
              - sys_irrigation
              - fn_valve
              - sub_irrigation_flush_loop
        - action: switch.turn_off
          target:
            entity_id: switch.feed_pump_irrigation_tent
        - delay: "00:00:00.300"
        - action: switch.turn_off
          target:
            entity_id: switch.flush_pump_irrigation_tent
        - delay: "00:00:00.300"
        - action: switch.turn_off
          target:
            entity_id: switch.feed_stir_pump_irrigation_tent
        - delay: "00:00:00.300"
        - action: switch.turn_off
          target:
            entity_id: switch.flush_stir_pump_irrigation_tent
        - delay: "00:00:00.300"
        - action: switch.turn_off
          target:
            entity_id: switch.air_pump_irrigation_tent
        - delay: "00:00:01"
        # Conditional guardrails — only re-power controllers that actually dropped.
        # Unconditional switch.turn_on against the HS300 master triggers a firmware
        # quirk that cascades ALL child outlets to ON, spuriously running every pump.
        # If the master really did drop, we stagger-off the 5 pump outlets afterward
        # to cancel that auto-on cascade. Drain pump outlet is intentionally left
        # alone — it must stay free to run.
        - if:
            - condition: state
              entity_id: switch.tent_irrigation_power_strip
              state: "off"
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.tent_irrigation_power_strip
            - delay: "00:00:00.500"
            - action: switch.turn_off
              target:
                entity_id: switch.feed_pump_irrigation_tent
            - delay: "00:00:00.300"
            - action: switch.turn_off
              target:
                entity_id: switch.flush_pump_irrigation_tent
            - delay: "00:00:00.300"
            - action: switch.turn_off
              target:
                entity_id: switch.feed_stir_pump_irrigation_tent
            - delay: "00:00:00.300"
            - action: switch.turn_off
              target:
                entity_id: switch.flush_stir_pump_irrigation_tent
            - delay: "00:00:00.300"
            - action: switch.turn_off
              target:
                entity_id: switch.air_pump_irrigation_tent
        - if:
            - condition: state
              entity_id: switch.irrigation_controller_tent
              state: "off"
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.irrigation_controller_tent
        - if:
            - condition: state
              entity_id: switch.controller_tent
              state: "off"
          then:
            - action: switch.turn_on
              target:
                entity_id: switch.controller_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: "TENT FLOOD STOP"
            message: >
              Table drain reported FULL at {{ now().strftime('%H:%M:%S') }}.
              Closed feed+flush inflow valves, stopped feed+flush pumps.
              Drain pump is handling overflow. Investigate before resuming.
        - action: persistent_notification.create
          data:
            notification_id: tent_flood_stop
            title: "Tent Flood Stop triggered"
            message: >
              {{ now().strftime('%Y-%m-%d %H:%M:%S') }} — binary_sensor.table_drain_full
              went ON. All feed+flush inflow halted. Drain pump engaged.
      mode: single

    - id: safety_flower_night_humidifier_warning
      alias: "Safety — Flower Night Humidity High Warning"
      description: >
        During flower nights, warn if humidity rises above 60% even though
        humidifier is blocked — may need to run dehumidifier.
      triggers:
        - trigger: numeric_state
          entity_id: sensor.tent_average_humidity
          above: 60
          for:
            minutes: 10
      conditions:
        - condition: template
          value_template: >
            {{ states('input_select.grow_tent_growth_stage')
               in ['Early Flower', 'Flower', 'Late Flower'] }}
        - condition: state
          entity_id: binary_sensor.tent_lights_on
          state: "off"
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
      actions:
        - action: persistent_notification.create
          data:
            title: "Flower Night — High Humidity Warning"
            message: >
              Humidity is {{ states('sensor.tent_average_humidity') }}% during flower night.
              Risk of bud rot above 60%. Consider switching to Dehumidify mode
              or increasing ventilation.
      mode: single


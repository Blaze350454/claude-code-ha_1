tent_control_safety:
  automation:
    - id: safety_flower_night_humidifier_shutoff
      alias: "Safety — Flower Night Humidifier Shutoff"
      description: >
        When lights turn off during Flowering stage, immediately shut off the
        humidifier fogger and fan to prevent bud rot. Only fires if the safety
        block toggle is enabled.
      triggers:
        - trigger: state
          entity_id: light.hlg
          to: "off"
      conditions:
        - condition: state
          entity_id: input_select.grow_tent_growth_stage
          state: Flowering
        - condition: state
          entity_id: input_boolean.flower_night_humidifier_block
          state: "on"
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.humidifier
        - action: fan.turn_off
          target:
            entity_id: fan.grow_tent_one_humidifier_fan_pwm
        - action: persistent_notification.create
          data:
            title: "Humidifier Blocked — Flower Night"
            message: >
              Lights off during Flowering stage. Humidifier shut off to prevent
              bud rot. Disable 'Block Humidifier During Flower Nights' toggle
              to override this behavior.
      mode: single
    - id: safety_table_drain_flood_stop
      alias: "Safety — Table Drain Flood Stop"
      description: >
        When the table drain float reports FULL, close inflow valves and stop
        feed/flush pumps so no more water enters the tent. Drain loop is
        intentionally untouched — the existing `Irrigation — Table Drain Pump`
        automation runs the drain pump and must keep power.

        Pump shutdowns are issued one outlet at a time with 300 ms between
        them. A simultaneous burst against the HS300 (5 outlets at once via
        label_id) was observed to also drop outlet E05 (the ESP32) and the
        strip master, killing the drain pump and creating a flood deadlock.
        At the end we explicitly turn the strip master, the ESP32 outlet,
        and the sonoff tent controller back ON as a guardrail so any stray
        cascade self-heals within seconds.

        Fires regardless of the automation-enabled master toggle (safety first).
      triggers:
        - trigger: state
          entity_id: binary_sensor.table_drain_full
          to: "on"
          for: "00:00:03"
      actions:
        - action: valve.close_valve
          target:
            label_id:
              - sys_irrigation
              - fn_valve
              - sub_irrigation_feed_loop
        - action: valve.close_valve
          target:
            label_id:
              - sys_irrigation
              - fn_valve
              - sub_irrigation_flush_loop
        - action: switch.turn_off
          target:
            entity_id: switch.feed_pump_irrigation_tent
        - delay: "00:00:00.300"
        - action: switch.turn_off
          target:
            entity_id: switch.flush_pump_irrigation_tent
        - delay: "00:00:00.300"
        - action: switch.turn_off
          target:
            entity_id: switch.feed_stir_pump_irrigation_tent
        - delay: "00:00:00.300"
        - action: switch.turn_off
          target:
            entity_id: switch.flush_stir_pump_irrigation_tent
        - delay: "00:00:00.300"
        - action: switch.turn_off
          target:
            entity_id: switch.air_pump_irrigation_tent
        - delay: "00:00:01"
        - action: switch.turn_on
          target:
            entity_id:
              - switch.irrigation_power_strip
              - switch.irrigation_controller_tent
              - switch.controller_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: "TENT FLOOD STOP"
            message: >
              Table drain reported FULL at {{ now().strftime('%H:%M:%S') }}.
              Closed feed+flush inflow valves, stopped feed+flush pumps.
              Drain pump is handling overflow. Investigate before resuming.
        - action: persistent_notification.create
          data:
            notification_id: tent_flood_stop
            title: "Tent Flood Stop triggered"
            message: >
              {{ now().strftime('%Y-%m-%d %H:%M:%S') }} — binary_sensor.table_drain_full
              went ON. All feed+flush inflow halted. Drain pump engaged.
      mode: single

    - id: safety_flower_night_humidifier_warning
      alias: "Safety — Flower Night Humidity High Warning"
      description: >
        During flower nights, warn if humidity rises above 60% even though
        humidifier is blocked — may need to run dehumidifier.
      triggers:
        - trigger: numeric_state
          entity_id: sensor.tent_humidity
          above: 60
          for:
            minutes: 10
      conditions:
        - condition: state
          entity_id: input_select.grow_tent_growth_stage
          state: Flowering
        - condition: state
          entity_id: light.hlg
          state: "off"
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
      actions:
        - action: persistent_notification.create
          data:
            title: "Flower Night — High Humidity Warning"
            message: >
              Humidity is {{ states('sensor.tent_humidity') }}% during flower night.
              Risk of bud rot above 60%. Consider switching to Dehumidify mode
              or increasing ventilation.
      mode: single


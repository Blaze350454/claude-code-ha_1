tent_irrigation_air:
  # ================================================
  # Air alternation (Phase 2) — DUMMY SERVO MODE
  # ------------------------------------------------
  # The single VIVOHOME air pump physically aerates BOTH reservoirs right now
  # (no pinch valves installed yet). input_select.air_route is a *dummy servo*:
  # it records which tank the air is "intended" for and lets the never-both /
  # never-both-closed alternation logic run for real. When the 2x DS3225 pinch
  # servos are flashed, flip input_boolean.air_real_servos on and add the servo
  # commands in script.tent_air_burst (marked TODO) — nothing else changes.
  # ================================================

  input_select:
    air_route:
      name: Air Route (dummy servo target)
      options:
        - none
        - feed
        - flush
      icon: mdi:valve

  input_boolean:
    air_real_servos:
      name: Air Real Servos Installed
      icon: mdi:robot-industrial

  input_number:
    air_burst_feed_duration:
      name: Air Burst — Feed
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier
    air_burst_flush_duration:
      name: Air Burst — Flush
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier
    air_refresh_interval_duration:
      name: Air Refresh Interval (per tank)
      min: 10
      max: 180
      step: 5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer-sync

  input_datetime:
    last_feed_air:
      name: Last Feed-Reservoir Air
      has_date: true
      has_time: true
      icon: mdi:air-purifier
    last_flush_air:
      name: Last Flush-Reservoir Air
      has_date: true
      has_time: true
      icon: mdi:air-purifier

  script:
    tent_air_burst:
      alias: Tent Air Burst (routed)
      # single = only ever one tank aired at a time (enforces never-both)
      mode: single
      fields:
        tank:
          description: "Which reservoir to route air to: feed or flush"
          required: true
          example: feed
          selector:
            select:
              options:
                - feed
                - flush
        minutes:
          description: "Optional burst length override (min). Defaults to air_burst_<tank>_duration."
          required: false
          example: 5
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: box
      sequence:
        - variables:
            air_seconds: >-
              {% set m = (minutes | float(0)) if (minutes is defined and minutes is not none) else 0 %}
              {% if m <= 0 %}{% set m = states('input_number.air_burst_' ~ tank ~ '_duration') | float(4) %}{% endif %}
              {{ (m * 60) | round | int }}
            air_dt_entity: "{{ 'input_datetime.last_' ~ tank ~ '_air' }}"
        # Move the (dummy) servo: route air to this tank, away from the other.
        - action: input_select.select_option
          target:
            entity_id: input_select.air_route
          data:
            option: "{{ tank }}"
        # TODO (real servos): when input_boolean.air_real_servos is on, command the
        # DS3225 pinch valves here — open <tank>, close the other. Never both open
        # (failsafe), never both closed while the pump runs (anti-dead-head). In
        # dummy mode the pump aerates both tanks; air_route is intent only.
        - delay:
            seconds: 1
        - action: switch.turn_on
          target:
            entity_id: switch.air_pump_irrigation_tent
        - delay:
            seconds: "{{ air_seconds }}"
        - action: switch.turn_off
          target:
            entity_id: switch.air_pump_irrigation_tent
        - action: input_select.select_option
          target:
            entity_id: input_select.air_route
          data:
            option: none
        - action: input_datetime.set_datetime
          target:
            entity_id: "{{ air_dt_entity }}"
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      icon: mdi:air-purifier

  automation:
    - id: automation.irrigation_air_alternate
      alias: Tent Irrigation — Air Alternation
      description: >-
        Periodic aeration of the FEED reservoir only: every 5 min, airs feed if it's
        past air_refresh_interval_duration. FLUSH is NOT periodically aired — it gets a
        full aeration only right before each flush (flush_pre_use_air_duration, in
        run_feed_cycle / run_flush_now). One tank at a time via the dummy air_route
        (Phase-2 real = DS3225 pinch servos). Stamps last_feed_air. Skips while feeding,
        in the feed settle window, or while a night pulse runs.
      triggers:
        - trigger: time_pattern
          minutes: /5
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: "on"
        - condition: not
          conditions:
            - condition: state
              entity_id: script.run_feed_cycle
              state: "on"
        - condition: state
          entity_id: script.tent_air_burst
          state: "off"
        - condition: state
          entity_id: script.run_night_pulse
          state: "off"
        # Not in the feed settle window
        - condition: template
          value_template: >
            {% set nf = state_attr('input_datetime.next_feed_time','timestamp') %}
            {% if nf is none %}true
            {% else %}
              {% set guard = (states('input_number.pre_feed_lead_duration') | float(7)
                              + states('input_number.feed_settle_duration') | float(3) + 5) * 60 %}
              {{ (nf - now().timestamp()) > guard }}
            {% endif %}
        # Feed reservoir is due for air (flush is aired only pre-flush, not here)
        - condition: template
          value_template: >
            {% set iv = states('input_number.air_refresh_interval_duration') | float(35) * 60 %}
            {% set ff = state_attr('input_datetime.last_feed_air','timestamp') %}
            {{ ff is none or (now().timestamp() - ff) >= iv }}
      actions:
        - action: script.tent_air_burst
          data:
            tank: feed
      mode: single

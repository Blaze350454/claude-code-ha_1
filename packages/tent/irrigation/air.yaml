tent_irrigation_air:
  # ================================================
  # Air routing — DS3225 cam pinch valve
  # ------------------------------------------------
  # The single VIVOHOME air pump feeds both reservoirs through one servo-driven
  # cam valve on the irrigation ESP32. Routing state lives ON THE DEVICE, in
  # select.air_route_irrigation_tent. There is deliberately no HA-side mirror of
  # it: a second copy would drift out of step the first time the ESP rebooted
  # (the ESP boots to Both Open) and nothing would reconcile them.
  #
  #   "Both Open"          both hoses open     — boot and idle default
  #   "Feed Air Blocked"   feed  hose pinched  -> all air reaches FLUSH
  #   "Flush Air Blocked"  flush hose pinched  -> all air reaches FEED
  #
  # The three cam positions are mutually exclusive by construction, so "both
  # pinched" — the state that would dead-head the pump — is not reachable. That
  # is a property of the mechanism, not of this config, so nothing here needs to
  # guard against it.
  #
  # ⚠ Options are named for WHICH HOSE IS PINCHED, so routing air TO a tank means
  # blocking the OTHER one. The mapping is crossed on purpose; see tent_air_burst.
  #
  # ⚠ DEPLOY ORDER: this file references an entity that only exists once the ESP
  # is flashed AND its entity_id is corrected from the area-prefixed default that
  # HA generates. Flash first, rename, then deploy this. Deploying this first
  # halts aeration (the select call fails and tent_air_burst aborts).
  # ================================================

  input_number:
    air_burst_feed_duration:
      name: Air Burst — Feed
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier
    air_burst_flush_duration:
      name: Air Burst — Flush
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier
    air_refresh_interval_duration:
      name: Air Refresh Interval (per tank)
      min: 10
      max: 180
      step: 5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer-sync

  input_datetime:
    last_feed_air:
      name: Last Feed-Reservoir Air
      has_date: true
      has_time: true
      icon: mdi:air-purifier
    last_flush_air:
      name: Last Flush-Reservoir Air
      has_date: true
      has_time: true
      icon: mdi:air-purifier

  script:
    tent_air_burst:
      alias: Tent Air Burst (routed)
      # single = only ever one tank aired at a time (enforces never-both)
      mode: single
      fields:
        tank:
          description: "Which reservoir to route air to: feed or flush"
          required: true
          example: feed
          selector:
            select:
              options:
                - feed
                - flush
        minutes:
          description: "Optional burst length override (min). Defaults to air_burst_<tank>_duration."
          required: false
          example: 5
          selector:
            number:
              min: 0
              max: 30
              step: 1
              mode: box
      sequence:
        - variables:
            air_seconds: >-
              {% set m = (minutes | float(0)) if (minutes is defined and minutes is not none) else 0 %}
              {% if m <= 0 %}{% set m = states('input_number.air_burst_' ~ tank ~ '_duration') | float(4) %}{% endif %}
              {{ (m * 60) | round | int }}
            air_dt_entity: "{{ 'input_datetime.last_' ~ tank ~ '_air' }}"
        # Route the air by pinching the OTHER tank's hose. The valve is named for
        # the hose it blocks, so this mapping is crossed on purpose:
        #   tank=feed  -> "Flush Air Blocked"  (flush pinched, all air reaches feed)
        #   tank=flush -> "Feed Air Blocked"   (feed  pinched, all air reaches flush)
        #
        # If the ESP32 is offline this action fails and the script aborts HERE,
        # before the pump is energised. That is the intended behaviour: with the cam
        # position unknown, do not run the pump. Being offline is separately alerted
        # by watchdog_irrigation_critical_offline, so this failure is not silent.
        - action: select.select_option
          target:
            entity_id: select.air_route_irrigation_tent
          data:
            # Spelled out rather than a two-way ternary on purpose: a ternary sends
            # any unexpected `tank` down the else branch and silently aerates the
            # WRONG reservoir. This emits a string that is not a valid option, so
            # select.select_option raises and the script aborts before the pump runs.
            option: "{% if tank == 'feed' %}Flush Air Blocked{% elif tank == 'flush' %}Feed Air Blocked{% else %}INVALID TANK: {{ tank }}{% endif %}"
        # Let the cam finish its swing before the pump loads the line.
        - delay:
            seconds: 1
        - action: switch.turn_on
          target:
            entity_id: switch.air_pump_irrigation_tent
        - delay:
            seconds: "{{ air_seconds }}"
        - action: switch.turn_off
          target:
            entity_id: switch.air_pump_irrigation_tent
        # Back to both-open at rest. Never leave a reservoir cut off between bursts,
        # and never leave the pump a pinched line to start against.
        - action: select.select_option
          target:
            entity_id: select.air_route_irrigation_tent
          data:
            option: "Both Open"
        - action: input_datetime.set_datetime
          target:
            entity_id: "{{ air_dt_entity }}"
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      icon: mdi:air-purifier

  automation:
    - id: automation.irrigation_air_alternate
      alias: Tent Irrigation — Air Alternation
      description: >-
        Periodic aeration of the FEED reservoir only: every 5 min, airs feed if it's
        past air_refresh_interval_duration. FLUSH is NOT periodically aired — it gets a
        full aeration only right before each flush (flush_pre_use_air_duration, in
        run_feed_cycle / run_flush_now). One tank at a time, enforced by the DS3225
        cam valve. Stamps last_feed_air. Skips while feeding, in the feed settle
        window, or while a night pulse runs.
      triggers:
        - trigger: time_pattern
          minutes: /5
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: "on"
        - condition: not
          conditions:
            - condition: state
              entity_id: script.run_feed_cycle
              state: "on"
        - condition: state
          entity_id: script.tent_air_burst
          state: "off"
        - condition: state
          entity_id: script.run_night_pulse
          state: "off"
        # Not in the feed settle window
        - condition: template
          value_template: >
            {% set nf = state_attr('input_datetime.next_feed_time','timestamp') %}
            {% if nf is none %}true
            {% else %}
              {% set guard = (states('input_number.pre_feed_lead_duration') | float(7)
                              + states('input_number.feed_settle_duration') | float(3) + 5) * 60 %}
              {{ (nf - now().timestamp()) > guard }}
            {% endif %}
        # Feed reservoir is due for air (flush is aired only pre-flush, not here)
        - condition: template
          value_template: >
            {% set iv = states('input_number.air_refresh_interval_duration') | float(35) * 60 %}
            {% set ff = state_attr('input_datetime.last_feed_air','timestamp') %}
            {{ ff is none or (now().timestamp() - ff) >= iv }}
      actions:
        - action: script.tent_air_burst
          data:
            tank: feed
      mode: single

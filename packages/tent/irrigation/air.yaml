tent_irrigation_air:
  # ================================================
  # Air alternation (Phase 2) — DUMMY SERVO MODE
  # ------------------------------------------------
  # The single VIVOHOME air pump physically aerates BOTH reservoirs right now
  # (no pinch valves installed yet). input_select.air_route is a *dummy servo*:
  # it records which tank the air is "intended" for and lets the never-both /
  # never-both-closed alternation logic run for real. When the 2x DS3225 pinch
  # servos are flashed, flip input_boolean.air_real_servos on and add the servo
  # commands in script.tent_air_burst (marked TODO) — nothing else changes.
  # ================================================

  input_select:
    air_route:
      name: Air Route (dummy servo target)
      options:
        - none
        - feed
        - flush
      icon: mdi:valve

  input_boolean:
    air_real_servos:
      name: Air Real Servos Installed
      icon: mdi:robot-industrial

  input_number:
    air_burst_feed_minutes:
      name: Air Burst — Feed
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier
    air_burst_flush_minutes:
      name: Air Burst — Flush
      min: 1
      max: 30
      step: 1
      unit_of_measurement: min
      mode: box
      icon: mdi:air-purifier
    air_refresh_interval_minutes:
      name: Air Refresh Interval (per tank)
      min: 10
      max: 180
      step: 5
      unit_of_measurement: min
      mode: box
      icon: mdi:timer-sync

  input_datetime:
    last_feed_air:
      name: Last Feed-Reservoir Air
      has_date: true
      has_time: true
      icon: mdi:air-purifier
    last_flush_air:
      name: Last Flush-Reservoir Air
      has_date: true
      has_time: true
      icon: mdi:air-purifier

  script:
    tent_air_burst:
      alias: Tent Air Burst (routed)
      # single = only ever one tank aired at a time (enforces never-both)
      mode: single
      fields:
        tank:
          description: "Which reservoir to route air to: feed or flush"
          required: true
          example: feed
          selector:
            select:
              options:
                - feed
                - flush
      sequence:
        - variables:
            air_seconds: "{{ (states('input_number.air_burst_' ~ tank ~ '_minutes') | float(4) * 60) | round | int }}"
            air_dt_entity: "{{ 'input_datetime.last_' ~ tank ~ '_air' }}"
        # Move the (dummy) servo: route air to this tank, away from the other.
        - action: input_select.select_option
          target:
            entity_id: input_select.air_route
          data:
            option: "{{ tank }}"
        # TODO (real servos): when input_boolean.air_real_servos is on, command the
        # DS3225 pinch valves here — open <tank>, close the other. Never both open
        # (failsafe), never both closed while the pump runs (anti-dead-head). In
        # dummy mode the pump aerates both tanks; air_route is intent only.
        - delay:
            seconds: 1
        - action: switch.turn_on
          target:
            entity_id: switch.air_pump_irrigation_tent
        - delay:
            seconds: "{{ air_seconds }}"
        - action: switch.turn_off
          target:
            entity_id: switch.air_pump_irrigation_tent
        - action: input_select.select_option
          target:
            entity_id: input_select.air_route
          data:
            option: none
        - action: input_datetime.set_datetime
          target:
            entity_id: "{{ air_dt_entity }}"
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
      icon: mdi:air-purifier

  automation:
    - id: automation.irrigation_air_alternate
      alias: Tent Irrigation — Air Alternation
      description: >-
        Deficit-based air "level": every 5 min, airs whichever tank is furthest past
        air_refresh_interval_minutes, ONE tank at a time (never both — the dummy
        air_route enforces it; Phase-2 real = DS3225 pinch servos). Stamps last_*_air.
        Skips while feeding, in the feed settle window, or while a night pulse runs
        (night pulses own the dark period).
      triggers:
        - trigger: time_pattern
          minutes: /5
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: "on"
        - condition: not
          conditions:
            - condition: state
              entity_id: script.run_feed_cycle
              state: "on"
        - condition: state
          entity_id: script.tent_air_burst
          state: "off"
        - condition: state
          entity_id: script.run_night_pulse
          state: "off"
        # Not in the feed settle window
        - condition: template
          value_template: >
            {% set nf = state_attr('input_datetime.next_feed_time','timestamp') %}
            {% if nf is none %}true
            {% else %}
              {% set guard = (states('input_number.pre_feed_lead_minutes') | float(7)
                              + states('input_number.feed_settle_minutes') | float(3) + 5) * 60 %}
              {{ (nf - now().timestamp()) > guard }}
            {% endif %}
        # At least one tank is due for air
        - condition: template
          value_template: >
            {% set iv = states('input_number.air_refresh_interval_minutes') | float(35) * 60 %}
            {% set ff = state_attr('input_datetime.last_feed_air','timestamp') %}
            {% set lu = state_attr('input_datetime.last_flush_air','timestamp') %}
            {{ (ff is none or (now().timestamp() - ff) >= iv) or (lu is none or (now().timestamp() - lu) >= iv) }}
      actions:
        - variables:
            iv: "{{ states('input_number.air_refresh_interval_minutes') | float(35) * 60 }}"
            ff: "{{ state_attr('input_datetime.last_feed_air','timestamp') }}"
            lu: "{{ state_attr('input_datetime.last_flush_air','timestamp') }}"
            feed_age: "{{ 9e9 if ff is none else (now().timestamp() - ff) }}"
            flush_age: "{{ 9e9 if lu is none else (now().timestamp() - lu) }}"
            feed_due: "{{ feed_age | float >= iv | float }}"
            flush_due: "{{ flush_age | float >= iv | float }}"
            # Pick the most-overdue due tank
            tank: >-
              {% if feed_due and flush_due %}{{ 'feed' if (feed_age | float) >= (flush_age | float) else 'flush' }}
              {% elif feed_due %}feed
              {% else %}flush{% endif %}
        - action: script.tent_air_burst
          data:
            tank: "{{ tank }}"
      mode: single

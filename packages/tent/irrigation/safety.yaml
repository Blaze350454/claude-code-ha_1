tent_irrigation_safety:
  automation:
    - id: tent_irrigation_watchdog
      alias: Tent Irrigation — Watchdog
      description: >
        Forces all pumps and valves off if any pump or valve stays active longer
        than its expected max. State-based triggers — fires regardless of how
        the pump/valve was activated. Tiered thresholds:
          PUMPS:
          - feed/flush 16 min (covers feed_duration capped at 13 min;
            low-flow safety also catches abnormal feed/flush at 2 min mark)
          - stir 65 min (5 min buffer over stir_on_duration_minutes max 60,
            also covers maintenance_stir/night_pulse_stir maxes)
          - air 65 min (5 min buffer over air_on_duration_minutes max 60)
          - table drain pump 35 min (drainage automation has 30 min internal
            timeout)
          VALVES (added 2026-05-09 after a feed_valve was found stuck open
          for 7+ hours with the feed pump off — pump-only watchdog had no
          coverage for that case):
          - feed/flush valve 25 min (longer than max feed cycle; catches stuck-
            open from missed close-command after a network blip)
          - feed/flush fill valves 7 min (fills are short — anything longer is
            either a sensor failure or a real overfill risk)
          - flush drain valve 10 min (drain pulses are seconds during line
            clear; 10 min is generous slack)
      triggers:
        - trigger: state
          entity_id:
            - switch.feed_pump_irrigation_tent
            - switch.flush_pump_irrigation_tent
          to: 'on'
          for:
            minutes: 16
        - trigger: state
          entity_id:
            - switch.feed_stir_pump_irrigation_tent
            - switch.flush_stir_pump_irrigation_tent
          to: 'on'
          for:
            minutes: 65
        - trigger: state
          entity_id: switch.air_pump_irrigation_tent
          to: 'on'
          for:
            minutes: 65
        - trigger: state
          entity_id: switch.table_drain_pump_irrigation_tent
          to: 'on'
          for:
            minutes: 35
        # --- Valve watchdog triggers ---
        - trigger: state
          entity_id:
            - valve.feed_valve_irrigation_tent
            - valve.flush_valve_irrigation_tent
          to: open
          for:
            minutes: 25
        - trigger: state
          entity_id:
            - valve.feed_fill_valve_irrigation_tent
            - valve.flush_fill_valve_irrigation_tent
          to: open
          for:
            minutes: 7
        - trigger: state
          entity_id: valve.flush_drain_valve_irrigation_tent
          to: open
          for:
            minutes: 10
      actions:
        - action: script.stop_alternating
        - action: script.turn_off
          target:
            entity_id:
              - script.run_feed_cycle
          data: {}
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_pump_irrigation_tent
              - switch.flush_pump_irrigation_tent
              - switch.air_pump_irrigation_tent
              - switch.feed_stir_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
              - switch.table_drain_pump_irrigation_tent
          data: {}
        - action: valve.close_valve
          target:
            entity_id:
              - valve.feed_valve_irrigation_tent
              - valve.flush_valve_irrigation_tent
              - valve.feed_fill_valve_irrigation_tent
              - valve.flush_fill_valve_irrigation_tent
              - valve.flush_drain_valve_irrigation_tent
        - action: input_text.set_value
          target:
            entity_id: input_text.tent_irrigation_status
          data:
            value: FAULT — Watchdog triggered
        - action: notify.mobile_app_sm_a166w
          data:
            title: Irrigation Watchdog Alert
            message: >
              {{ trigger.entity_id }} stayed active longer than its safety
              threshold ({{ trigger.for }}). All pumps and valves forced off
              — check system.
      mode: single
    - id: tent_irrigation_startup_recovery
      alias: Tent Irrigation — Startup Recovery
      description: Forces all pumps and valves off immediately on HA start or restart
      triggers:
        - trigger: homeassistant
          event: start
      actions:
        - action: script.turn_off
          target:
            entity_id:
              - script.run_feed_cycle
          data: {}
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.alternating_active
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_pump_irrigation_tent
              - switch.flush_pump_irrigation_tent
              - switch.air_pump_irrigation_tent
              - switch.feed_stir_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
              - switch.table_drain_pump_irrigation_tent
          data: {}
        - action: valve.close_valve
          target:
            entity_id:
              - valve.feed_valve_irrigation_tent
              - valve.flush_valve_irrigation_tent
              - valve.flush_drain_valve_irrigation_tent
              - valve.feed_fill_valve_irrigation_tent
              - valve.flush_fill_valve_irrigation_tent
        - action: input_text.set_value
          target:
            entity_id: input_text.tent_irrigation_status
          data:
            value: Idle
      mode: single
    - id: tent_irrigation_block_feed_when_reservoir_dry
      alias: Tent Irrigation — Block Feed When Reservoir Dry
      description: >
        Turns off feed pump, stir pump, and valve when feed reservoir is dry —
        either because they were activated while already dry, or because the
        reservoir drained while they were running. Reads the agitation-frozen
        level sensor (sensor.feed_level_irrigation_tent == 0) instead of the raw
        empty float, so stir/air splash can't false-trip it. A tank already empty
        when agitation starts still reads 0 and is caught immediately; one that
        drains mid-burst is caught once agitation stops and the level steps down.
      triggers:
        - trigger: state
          entity_id:
            - switch.feed_pump_irrigation_tent
            - switch.feed_stir_pump_irrigation_tent
          to: 'on'
        - trigger: state
          entity_id: valve.feed_valve_irrigation_tent
          to: open
        - trigger: numeric_state
          entity_id: sensor.feed_level_irrigation_tent
          below: 1
      conditions:
        - condition: numeric_state
          entity_id: sensor.feed_level_irrigation_tent
          below: 1
        - condition: or
          conditions:
            - condition: state
              entity_id: switch.feed_pump_irrigation_tent
              state: 'on'
            - condition: state
              entity_id: switch.feed_stir_pump_irrigation_tent
              state: 'on'
            - condition: state
              entity_id: valve.feed_valve_irrigation_tent
              state: open
      actions:
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_pump_irrigation_tent
              - switch.feed_stir_pump_irrigation_tent
        - action: valve.close_valve
          target:
            entity_id: valve.feed_valve_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Feed Blocked — Reservoir Dry
            message: Feed pump, stir pump, or valve turned off. Feed reservoir is dry.
      mode: single
    - id: tent_irrigation_block_flush_when_reservoir_dry
      alias: Tent Irrigation — Block Flush When Reservoir Dry
      description: >
        Turns off flush pump, stir pump, and valve when flush reservoir is dry —
        either because they were activated while already dry, or because the
        reservoir drained while they were running. Reads the agitation-frozen
        level sensor (sensor.flush_level_irrigation_tent == 0) instead of the raw
        empty float, so stir/air splash can't false-trip it. A tank already empty
        when agitation starts still reads 0 and is caught immediately; one that
        drains mid-burst is caught once agitation stops and the level steps down.
      triggers:
        - trigger: state
          entity_id:
            - switch.flush_pump_irrigation_tent
            - switch.flush_stir_pump_irrigation_tent
          to: 'on'
        - trigger: state
          entity_id: valve.flush_valve_irrigation_tent
          to: open
        - trigger: numeric_state
          entity_id: sensor.flush_level_irrigation_tent
          below: 1
      conditions:
        - condition: numeric_state
          entity_id: sensor.flush_level_irrigation_tent
          below: 1
        - condition: or
          conditions:
            - condition: state
              entity_id: switch.flush_pump_irrigation_tent
              state: 'on'
            - condition: state
              entity_id: switch.flush_stir_pump_irrigation_tent
              state: 'on'
            - condition: state
              entity_id: valve.flush_valve_irrigation_tent
              state: open
      actions:
        - action: switch.turn_off
          target:
            entity_id:
              - switch.flush_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
        - action: valve.close_valve
          target:
            entity_id: valve.flush_valve_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Flush Blocked — Reservoir Dry
            message: Flush pump, stir pump, or valve turned off. Flush reservoir is dry.
      mode: single
    - id: tent_irrigation_block_feed_fill_when_reservoir_full
      alias: Tent Irrigation — Block Feed Fill When Reservoir Full
      description: >
        Closes feed fill valve immediately if open while feed reservoir is full.
        Reads the level sensor (== 100); since the level sensor trusts a rising
        float immediately, a genuine full still closes the fill even mid-aeration.
        The ESP32 fill-full interlock is the hardware backstop.
      triggers:
        - trigger: state
          entity_id: valve.feed_fill_valve_irrigation_tent
          to: open
        - trigger: numeric_state
          entity_id: sensor.feed_level_irrigation_tent
          above: 99
      conditions:
        - condition: numeric_state
          entity_id: sensor.feed_level_irrigation_tent
          above: 99
        - condition: state
          entity_id: valve.feed_fill_valve_irrigation_tent
          state: open
      actions:
        - action: valve.close_valve
          target:
            entity_id: valve.feed_fill_valve_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Feed Fill Blocked — Reservoir Full
            message: Feed fill valve closed. Feed reservoir is full.
      mode: single
    - id: tent_irrigation_block_flush_fill_when_reservoir_full
      alias: Tent Irrigation — Block Flush Fill When Reservoir Full
      description: >
        Closes flush fill valve immediately if open while flush reservoir is full.
        Reads the level sensor (== 100); since the level sensor trusts a rising
        float immediately, a genuine full still closes the fill even mid-aeration.
        The ESP32 fill-full interlock is the hardware backstop.
      triggers:
        - trigger: state
          entity_id: valve.flush_fill_valve_irrigation_tent
          to: open
        - trigger: numeric_state
          entity_id: sensor.flush_level_irrigation_tent
          above: 99
      conditions:
        - condition: numeric_state
          entity_id: sensor.flush_level_irrigation_tent
          above: 99
        - condition: state
          entity_id: valve.flush_fill_valve_irrigation_tent
          state: open
      actions:
        - action: valve.close_valve
          target:
            entity_id: valve.flush_fill_valve_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Flush Fill Blocked — Reservoir Full
            message: Flush fill valve closed. Flush reservoir is full.
      mode: single
    - id: tent_irrigation_block_table_drain_pump_when_dry
      alias: Tent Irrigation — Block Table Drain Pump When Dry
      description: >
        Turns off the table-drain pump when the drain reservoir reports empty —
        either at pump turn-on, or if it stays empty for 20 minutes while the
        pump is running (catches the case where drain becomes empty mid-cycle).
        Independent of feed/flush — table drain is its own loop.
      triggers:
        - trigger: state
          entity_id: switch.table_drain_pump_irrigation_tent
          to: 'on'
        - trigger: state
          entity_id: binary_sensor.table_drain_empty
          to: 'off'
          for:
            minutes: 20
      conditions:
        - condition: state
          entity_id: binary_sensor.table_drain_empty
          state: 'off'
        - condition: state
          entity_id: switch.table_drain_pump_irrigation_tent
          state: 'on'
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.table_drain_pump_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Table Drain Blocked — Dry
            message: Table drain pump turned off. Table drain is empty.
      mode: single
    - id: tent_irrigation_re_enable_maintenance_on_enable
      alias: Tent Irrigation — Re-enable Maintenance on Enable
      description: >
        When input_boolean.tent_irrigation_enabled flips off→on:
          1. Re-enable automation.tent_irrigation_maintenance_cycle (covers the gap
             where lights_off_cleanup disabled it during the off period).
          2. If daily_setup hasn't run yet today, fire it now so today's
             feed/pre-feed schedule is recomputed instead of waiting until
             next daily_setup_time.
        Caveat: if user re-enables AFTER today's first-feed time
        (lights_on + 5min), that feed is in the past and the time trigger
        won't fire today — use script.run_feed_cycle manually for an
        immediate feed, or just wait for tomorrow's normal cycle.
      triggers:
        - platform: state
          entity_id: input_boolean.tent_irrigation_enabled
          from: 'off'
          to: 'on'
      actions:
        - action: automation.turn_on
          target:
            entity_id: automation.tent_irrigation_maintenance_cycle
        - if:
            - condition: template
              value_template: >
                {% set last = state_attr('automation.tent_irrigation_daily_setup_at_lights_on', 'last_triggered') %}
                {{ last is none or as_local(last).date() != now().date() }}
          then:
            - action: automation.trigger
              target:
                entity_id: automation.tent_irrigation_daily_setup_at_lights_on
      mode: single

    - alias: Toggle — Kill Tent Irrigation Automations
      id: toggle_kill_tent_irrigation_automations
      trigger:
        - platform: state
          entity_id: input_boolean.tent_irrigation_kill_automations
      action:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.tent_irrigation_kill_automations
                  state: 'on'
              sequence:
                - action: automation.turn_off
                  target:
                    entity_id:
                      - automation.tent_irrigation_block_feed_when_reservoir_dry
                      - automation.tent_irrigation_block_flush_when_reservoir_dry
                      - automation.tent_irrigation_block_feed_fill_when_reservoir_full
                      - automation.tent_irrigation_block_flush_fill_when_reservoir_full
                      - automation.tent_irrigation_block_table_drain_pump_when_dry
                      - automation.tent_irrigation_daily_setup_at_lights_on
                      - automation.tent_irrigation_feed_trigger
                      - automation.tent_irrigation_lights_off_cleanup
                      - automation.tent_irrigation_night_pulses_veg
                      - automation.tent_irrigation_night_pulses_flower
                      - automation.tent_irrigation_re_enable_maintenance_on_enable
                      - automation.tent_irrigation_pre_feed_air_stir_start
                      - automation.tent_irrigation_pre_feed_air_stir_stop
                      - automation.tent_irrigation_startup_recovery
                      - automation.tent_irrigation_table_drain_pump
                      - automation.tent_irrigation_watchdog
                      - automation.tent_irrigation_maintenance_cycle
                - action: script.turn_off
                  target:
                    entity_id: script.tent_irrigation_advance_to_next_feed
            - conditions:
                - condition: state
                  entity_id: input_boolean.tent_irrigation_kill_automations
                  state: 'off'
              sequence:
                - action: automation.turn_on
                  target:
                    entity_id:
                      - automation.tent_irrigation_block_feed_when_reservoir_dry
                      - automation.tent_irrigation_block_flush_when_reservoir_dry
                      - automation.tent_irrigation_block_feed_fill_when_reservoir_full
                      - automation.tent_irrigation_block_flush_fill_when_reservoir_full
                      - automation.tent_irrigation_block_table_drain_pump_when_dry
                      - automation.tent_irrigation_daily_setup_at_lights_on
                      - automation.tent_irrigation_feed_trigger
                      - automation.tent_irrigation_lights_off_cleanup
                      - automation.tent_irrigation_night_pulses_veg
                      - automation.tent_irrigation_night_pulses_flower
                      - automation.tent_irrigation_re_enable_maintenance_on_enable
                      - automation.tent_irrigation_pre_feed_air_stir_start
                      - automation.tent_irrigation_pre_feed_air_stir_stop
                      - automation.tent_irrigation_startup_recovery
                      - automation.tent_irrigation_table_drain_pump
                      - automation.tent_irrigation_maintenance_cycle
                      - automation.tent_irrigation_watchdog
    - alias: Toggle — Irrigation Tent All Off
      id: toggle_irrigation_tent_all_off
      trigger:
        - platform: state
          entity_id: input_boolean.irrigation_tent_kill
      action:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.irrigation_tent_kill
                  state: 'on'
              sequence:
                - action: automation.turn_off
                  target:
                    entity_id:
                      - automation.fill_feed_reservoir
                      - automation.fill_flush_reservoir
                      - automation.tent_irrigation_block_feed_when_reservoir_dry
                      - automation.tent_irrigation_block_flush_when_reservoir_dry
                      - automation.tent_irrigation_block_feed_fill_when_reservoir_full
                      - automation.tent_irrigation_block_flush_fill_when_reservoir_full
                      - automation.tent_irrigation_block_table_drain_pump_when_dry
                      - automation.tent_irrigation_daily_setup_at_lights_on
                      - automation.tent_irrigation_feed_trigger
                      - automation.tent_irrigation_lights_off_cleanup
                      - automation.tent_irrigation_night_pulses_veg
                      - automation.tent_irrigation_night_pulses_flower
                      - automation.tent_irrigation_re_enable_maintenance_on_enable
                      - automation.tent_irrigation_pre_feed_air_stir_start
                      - automation.tent_irrigation_pre_feed_air_stir_stop
                      - automation.tent_irrigation_startup_recovery
                      - automation.tent_irrigation_table_drain_pump
                      - automation.tent_irrigation_watchdog
                      - automation.tent_irrigation_maintenance_cycle
                - action: script.turn_off
                  target:
                    entity_id:
                      - script.tent_irrigation_advance_to_next_feed
                      - script.run_feed_cycle
                      - script.stop_alternating
                - action: switch.turn_off
                  target:
                    entity_id:
                      - switch.feed_pump_irrigation_tent
                      - switch.feed_stir_pump_irrigation_tent
                      - switch.flush_pump_irrigation_tent
                      - switch.flush_stir_pump_irrigation_tent
                      - switch.air_pump_irrigation_tent
                - action: valve.close_valve
                  target:
                    entity_id:
                      - valve.feed_fill_valve_irrigation_tent
                      - valve.feed_valve_irrigation_tent
                      - valve.flush_drain_valve_irrigation_tent
                      - valve.flush_fill_valve_irrigation_tent
                      - valve.flush_valve_irrigation_tent
            - conditions:
                - condition: state
                  entity_id: input_boolean.irrigation_tent_kill
                  state: 'off'
              sequence:
                - action: automation.turn_on
                  target:
                    entity_id:
                      - automation.fill_feed_reservoir
                      - automation.fill_flush_reservoir
                      - automation.tent_irrigation_block_feed_when_reservoir_dry
                      - automation.tent_irrigation_block_flush_when_reservoir_dry
                      - automation.tent_irrigation_block_feed_fill_when_reservoir_full
                      - automation.tent_irrigation_block_flush_fill_when_reservoir_full
                      - automation.tent_irrigation_block_table_drain_pump_when_dry
                      - automation.tent_irrigation_daily_setup_at_lights_on
                      - automation.tent_irrigation_feed_trigger
                      - automation.tent_irrigation_lights_off_cleanup
                      - automation.tent_irrigation_night_pulses_veg
                      - automation.tent_irrigation_night_pulses_flower
                      - automation.tent_irrigation_re_enable_maintenance_on_enable
                      - automation.tent_irrigation_pre_feed_air_stir_start
                      - automation.tent_irrigation_pre_feed_air_stir_stop
                      - automation.tent_irrigation_startup_recovery
                      - automation.tent_irrigation_table_drain_pump
                      - automation.tent_irrigation_maintenance_cycle
                      - automation.tent_irrigation_watchdog

    - id: tent_irrigation_maintenance_cycle
      alias: Tent Irrigation — Maintenance Cycle
      description: >-
        Baseline reservoir service (deficit/credit). Every 5 min: stirs a tank only if
        it hasn't been serviced within its interval, tracked PER TANK
        (last_feed_service / last_flush_service). FEED uses baseline_service_interval_duration
        at stir_turnover_baseline; FLUSH uses its own longer flush_service_interval_duration
        at flush_stir_turnover (clean water, end-of-day use — much lighter cadence).
        Pre-feed/pre-flush bursts stamp those anchors. Feed-stir respects the feed window;
        flush is independent (separate pump). Air is handled in the Air Alternation automation.
      triggers:
        - trigger: time_pattern
          minutes: /5
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: "on"
        - condition: not
          conditions:
            - condition: state
              entity_id: script.run_feed_cycle
              state: "on"
        # At least one tank is due for service
        - condition: template
          value_template: >
            {% set iv = states('input_number.baseline_service_interval_duration') | float(75) * 60 %}
            {% set fiv = states('input_number.flush_service_interval_duration') | float(360) * 60 %}
            {% set lf = state_attr('input_datetime.last_feed_service','timestamp') %}
            {% set lu = state_attr('input_datetime.last_flush_service','timestamp') %}
            {% set feed_due = lf is none or (now().timestamp() - lf) >= iv %}
            {% set flush_due = lu is none or (now().timestamp() - lu) >= fiv %}
            {{ feed_due or flush_due }}
      actions:
        - variables:
            iv: "{{ states('input_number.baseline_service_interval_duration') | float(75) * 60 }}"
            turn: "{{ states('input_number.stir_turnover_baseline') | float(1) }}"
            fiv: "{{ states('input_number.flush_service_interval_duration') | float(360) * 60 }}"
            fturn: "{{ states('input_number.flush_stir_turnover') | float(0.5) }}"
            feed_imminent: >
              {% set nf = state_attr('input_datetime.next_feed_time','timestamp') %}
              {% if nf is none %}false
              {% else %}
                {% set guard = (states('input_number.pre_feed_lead_duration') | float(7)
                                + states('input_number.feed_settle_duration') | float(3) + 15) * 60 %}
                {{ (nf - now().timestamp()) <= guard }}
              {% endif %}
        # Feed tank: stir only if due AND no feed imminent (pre-feed handles it otherwise)
        - if:
            - condition: template
              value_template: >
                {% set lf = state_attr('input_datetime.last_feed_service','timestamp') %}
                {{ not feed_imminent and (lf is none or (now().timestamp() - lf) >= iv) }}
          then:
            - action: script.tent_stir_burst
              data:
                tank: feed
                turnover: "{{ turn }}"
        # Flush tank: own light interval (clean water, end-of-day use) — quick stir when due
        - if:
            - condition: template
              value_template: >
                {% set lu = state_attr('input_datetime.last_flush_service','timestamp') %}
                {{ lu is none or (now().timestamp() - lu) >= fiv }}
          then:
            - action: script.tent_stir_burst
              data:
                tank: flush
                turnover: "{{ fturn }}"
      mode: single

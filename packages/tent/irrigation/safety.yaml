tent_irrigation_safety:
  automation:
    - id: automation.irrigation_watchdog
      alias: Irrigation — Watchdog
      description: >
        Forces all pumps and valves off if any pump runs longer than its
        expected max. Tiered thresholds: feed/flush 10 min, stir 30 min
        (covers full alternating cycles + buffer), air 60 min (covers night
        cycle ramp + buffer), drain 35 min (drainage automation has 30 min
        internal timeout).
      triggers:
        - trigger: state
          entity_id:
            - switch.feed_pump_irrigation_tent
            - switch.flush_pump_irrigation_tent
          to: 'on'
          for:
            minutes: 10
        - trigger: state
          entity_id:
            - switch.feed_stir_pump_irrigation_tent
            - switch.flush_stir_pump_irrigation_tent
          to: 'on'
          for:
            minutes: 30
        - trigger: state
          entity_id: switch.air_pump_irrigation_tent
          to: 'on'
          for:
            minutes: 60
        - trigger: state
          entity_id: switch.table_drain_pump_irrigation_tent
          to: 'on'
          for:
            minutes: 35
      actions:
        - action: script.stop_alternating
        - action: script.turn_off
          target:
            entity_id:
              - script.run_feed_cycle
          data: {}
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_pump_irrigation_tent
              - switch.flush_pump_irrigation_tent
              - switch.air_pump_irrigation_tent
              - switch.feed_stir_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
              - switch.table_drain_pump_irrigation_tent
          data: {}
        - action: valve.close_valve
          target:
            entity_id:
              - valve.feed_valve_irrigation_tent
              - valve.flush_valve_irrigation_tent
              - valve.flush_drain_valve_irrigation_tent
        - action: input_text.set_value
          target:
            entity_id: input_text.irrigation_status
          data:
            value: FAULT — Watchdog triggered
        - action: notify.mobile_app_sm_a166w
          data:
            title: Irrigation Watchdog Alert
            message: A pump has been running for over 10 minutes. All pumps and valves forced off — check system.
      mode: single
    - id: automation.irrigation_startup_recovery
      alias: Irrigation — Startup Recovery
      description: Forces all pumps and valves off immediately on HA start or restart
      triggers:
        - trigger: homeassistant
          event: start
      actions:
        - action: script.turn_off
          target:
            entity_id:
              - script.run_feed_cycle
              - script.run_alternating
          data: {}
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.alternating_active
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_pump_irrigation_tent
              - switch.flush_pump_irrigation_tent
              - switch.air_pump_irrigation_tent
              - switch.feed_stir_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
              - switch.table_drain_pump_irrigation_tent
          data: {}
        - action: valve.close_valve
          target:
            entity_id:
              - valve.feed_valve_irrigation_tent
              - valve.flush_valve_irrigation_tent
              - valve.flush_drain_valve_irrigation_tent
              - valve.feed_fill_valve_irrigation_tent
              - valve.flush_fill_valve_irrigation_tent
        - action: input_text.set_value
          target:
            entity_id: input_text.irrigation_status
          data:
            value: Idle
      mode: single
    - id: automation.irrigation_feed_empty_block
      alias: Irrigation — Block Feed When Reservoir Dry
      description: >
        Turns off feed pump, stir pump, and valve when feed reservoir is dry —
        either because they were activated while already dry, or because the
        reservoir drained while they were running.
      triggers:
        - trigger: state
          entity_id:
            - switch.feed_pump_irrigation_tent
            - switch.feed_stir_pump_irrigation_tent
          to: 'on'
        - trigger: state
          entity_id: valve.feed_valve_irrigation_tent
          to: open
        - trigger: state
          entity_id: binary_sensor.feed_empty_irrigation_tent
          to: 'off'
      conditions:
        - condition: state
          entity_id: binary_sensor.feed_empty_irrigation_tent
          state: 'off'
        - condition: or
          conditions:
            - condition: state
              entity_id: switch.feed_pump_irrigation_tent
              state: 'on'
            - condition: state
              entity_id: switch.feed_stir_pump_irrigation_tent
              state: 'on'
            - condition: state
              entity_id: valve.feed_valve_irrigation_tent
              state: open
      actions:
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_pump_irrigation_tent
              - switch.feed_stir_pump_irrigation_tent
        - action: valve.close_valve
          target:
            entity_id: valve.feed_valve_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Feed Blocked — Reservoir Dry
            message: Feed pump, stir pump, or valve turned off. Feed reservoir is dry.
      mode: single
    - id: automation.irrigation_flush_empty_block
      alias: Irrigation — Block Flush When Reservoir Dry
      description: >
        Turns off flush pump, stir pump, and valve when flush reservoir is dry —
        either because they were activated while already dry, or because the
        reservoir drained while they were running.
      triggers:
        - trigger: state
          entity_id:
            - switch.flush_pump_irrigation_tent
            - switch.flush_stir_pump_irrigation_tent
          to: 'on'
        - trigger: state
          entity_id: valve.flush_valve_irrigation_tent
          to: open
        - trigger: state
          entity_id: binary_sensor.flush_empty_irrigation_tent
          to: 'off'
      conditions:
        - condition: state
          entity_id: binary_sensor.flush_empty_irrigation_tent
          state: 'off'
        - condition: or
          conditions:
            - condition: state
              entity_id: switch.flush_pump_irrigation_tent
              state: 'on'
            - condition: state
              entity_id: switch.flush_stir_pump_irrigation_tent
              state: 'on'
            - condition: state
              entity_id: valve.flush_valve_irrigation_tent
              state: open
      actions:
        - action: switch.turn_off
          target:
            entity_id:
              - switch.flush_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
        - action: valve.close_valve
          target:
            entity_id: valve.flush_valve_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Flush Blocked — Reservoir Dry
            message: Flush pump, stir pump, or valve turned off. Flush reservoir is dry.
      mode: single
    - id: automation.irrigation_block_feed_fill_when_reservoir_full
      alias: Irrigation — Block Feed Fill When Reservoir Full
      description: Closes feed fill valve immediately if open while feed reservoir is full
      triggers:
        - trigger: state
          entity_id: valve.feed_fill_valve_irrigation_tent
          to: open
        - trigger: state
          entity_id: binary_sensor.feed_full_irrigation_tent
          to: 'on'
      conditions:
        - condition: state
          entity_id: binary_sensor.feed_full_irrigation_tent
          state: 'on'
        - condition: state
          entity_id: valve.feed_fill_valve_irrigation_tent
          state: open
      actions:
        - action: valve.close_valve
          target:
            entity_id: valve.feed_fill_valve_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Feed Fill Blocked — Reservoir Full
            message: Feed fill valve closed. Feed reservoir is full.
      mode: single
    - id: automation.irrigation_block_flush_fill_when_reservoir_full
      alias: Irrigation — Block Flush Fill When Reservoir Full
      description: Closes flush fill valve immediately if open while flush reservoir is full
      triggers:
        - trigger: state
          entity_id: valve.flush_fill_valve_irrigation_tent
          to: open
        - trigger: state
          entity_id: binary_sensor.flush_full_irrigation_tent
          to: 'on'
      conditions:
        - condition: state
          entity_id: binary_sensor.flush_full_irrigation_tent
          state: 'on'
        - condition: state
          entity_id: valve.flush_fill_valve_irrigation_tent
          state: open
      actions:
        - action: valve.close_valve
          target:
            entity_id: valve.flush_fill_valve_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Flush Fill Blocked — Reservoir Full
            message: Flush fill valve closed. Flush reservoir is full.
      mode: single
    - id: automation.irrigation_table_drain_empty_block
      alias: Irrigation — Block Table Drain Pump When Dry
      description: Turns off table drain pump immediately if activated while table drain is empty
      triggers:
        - trigger: state
          entity_id: switch.table_drain_pump_irrigation_tent
          to: 'on'
      conditions:
        - condition: state
          entity_id: binary_sensor.table_drain_empty
          state: 'off'
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.table_drain_pump_irrigation_tent
        - action: notify.mobile_app_sm_a166w
          data:
            title: Table Drain Blocked — Dry
            message: Table drain pump turned off. Table drain is empty.
      mode: single
    - id: automation.irrigation_enabled_resync
      alias: Irrigation — Re-enable Maintenance on Enable
      description: >
        When input_boolean.irrigation_enabled flips off→on, immediately
        re-enable automation.irrigation_maintenance_cycle. Otherwise maintenance
        stays disabled (from prior lights_off_cleanup) until the next
        daily_setup_time fires — up to ~24h gap if user re-enables irrigation
        right after lights_off. Closes that gap.
      triggers:
        - platform: state
          entity_id: input_boolean.irrigation_enabled
          from: 'off'
          to: 'on'
      actions:
        - action: automation.turn_on
          target:
            entity_id: automation.irrigation_maintenance_cycle
      mode: single

    - alias: Toggle — Kill Irrigation Automations
      id: toggle_irrigation_kill_automations
      trigger:
        - platform: state
          entity_id: input_boolean.irrigation_kill_automations
      action:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.irrigation_kill_automations
                  state: 'on'
              sequence:
                - action: automation.turn_off
                  target:
                    entity_id:
                      - automation.irrigation_block_feed_when_reservoir_dry
                      - automation.irrigation_block_flush_when_reservoir_dry
                      - automation.irrigation_block_feed_fill_when_reservoir_full
                      - automation.irrigation_block_flush_fill_when_reservoir_full
                      - automation.irrigation_block_table_drain_pump_when_dry
                      - automation.irrigation_daily_setup_at_lights_on
                      - automation.irrigation_feed_trigger
                      - automation.irrigation_lights_off_cleanup
                      - automation.irrigation_night_pulses_veg
                      - automation.irrigation_night_pulses_flower
                      - automation.irrigation_re_enable_maintenance_on_enable
                      - automation.irrigation_pre_feed_air_stir_start
                      - automation.irrigation_pre_feed_air_stir_stop
                      - automation.irrigation_startup_recovery
                      - automation.irrigation_table_drain_pump
                      - automation.irrigation_watchdog
                      - automation.irrigation_maintenance_cycle
                - action: script.turn_off
                  target:
                    entity_id: script.irrigation_advance_to_next_feed
            - conditions:
                - condition: state
                  entity_id: input_boolean.irrigation_kill_automations
                  state: 'off'
              sequence:
                - action: automation.turn_on
                  target:
                    entity_id:
                      - automation.irrigation_block_feed_when_reservoir_dry
                      - automation.irrigation_block_flush_when_reservoir_dry
                      - automation.irrigation_block_feed_fill_when_reservoir_full
                      - automation.irrigation_block_flush_fill_when_reservoir_full
                      - automation.irrigation_block_table_drain_pump_when_dry
                      - automation.irrigation_daily_setup_at_lights_on
                      - automation.irrigation_feed_trigger
                      - automation.irrigation_lights_off_cleanup
                      - automation.irrigation_night_pulses_veg
                      - automation.irrigation_night_pulses_flower
                      - automation.irrigation_re_enable_maintenance_on_enable
                      - automation.irrigation_pre_feed_air_stir_start
                      - automation.irrigation_pre_feed_air_stir_stop
                      - automation.irrigation_startup_recovery
                      - automation.irrigation_table_drain_pump
                      - automation.irrigation_maintenance_cycle
                      - automation.irrigation_watchdog
    - alias: Toggle — Irrigation Tent All Off
      id: toggle_irrigation_tent_kill
      trigger:
        - platform: state
          entity_id: input_boolean.irrigation_tent_kill
      action:
        - choose:
            - conditions:
                - condition: state
                  entity_id: input_boolean.irrigation_tent_kill
                  state: 'on'
              sequence:
                - action: automation.turn_off
                  target:
                    entity_id:
                      - automation.fill_feed_reservoir
                      - automation.fill_flush_reservoir
                      - automation.irrigation_block_feed_when_reservoir_dry
                      - automation.irrigation_block_flush_when_reservoir_dry
                      - automation.irrigation_block_feed_fill_when_reservoir_full
                      - automation.irrigation_block_flush_fill_when_reservoir_full
                      - automation.irrigation_block_table_drain_pump_when_dry
                      - automation.irrigation_daily_setup_at_lights_on
                      - automation.irrigation_feed_trigger
                      - automation.irrigation_lights_off_cleanup
                      - automation.irrigation_night_pulses_veg
                      - automation.irrigation_night_pulses_flower
                      - automation.irrigation_re_enable_maintenance_on_enable
                      - automation.irrigation_pre_feed_air_stir_start
                      - automation.irrigation_pre_feed_air_stir_stop
                      - automation.irrigation_startup_recovery
                      - automation.irrigation_table_drain_pump
                      - automation.irrigation_watchdog
                      - automation.irrigation_maintenance_cycle
                - action: script.turn_off
                  target:
                    entity_id:
                      - script.irrigation_advance_to_next_feed
                      - script.run_alternating
                      - script.run_feed_cycle
                      - script.stop_alternating
                - action: switch.turn_off
                  target:
                    entity_id:
                      - switch.feed_pump_irrigation_tent
                      - switch.feed_stir_pump_irrigation_tent
                      - switch.flush_pump_irrigation_tent
                      - switch.flush_stir_pump_irrigation_tent
                      - switch.air_pump_irrigation_tent
                - action: valve.close_valve
                  target:
                    entity_id:
                      - valve.feed_fill_valve_irrigation_tent
                      - valve.feed_valve_irrigation_tent
                      - valve.flush_drain_valve_irrigation_tent
                      - valve.flush_fill_valve_irrigation_tent
                      - valve.flush_valve_irrigation_tent
            - conditions:
                - condition: state
                  entity_id: input_boolean.irrigation_tent_kill
                  state: 'off'
              sequence:
                - action: automation.turn_on
                  target:
                    entity_id:
                      - automation.fill_feed_reservoir
                      - automation.fill_flush_reservoir
                      - automation.irrigation_block_feed_when_reservoir_dry
                      - automation.irrigation_block_flush_when_reservoir_dry
                      - automation.irrigation_block_feed_fill_when_reservoir_full
                      - automation.irrigation_block_flush_fill_when_reservoir_full
                      - automation.irrigation_block_table_drain_pump_when_dry
                      - automation.irrigation_daily_setup_at_lights_on
                      - automation.irrigation_feed_trigger
                      - automation.irrigation_lights_off_cleanup
                      - automation.irrigation_night_pulses_veg
                      - automation.irrigation_night_pulses_flower
                      - automation.irrigation_re_enable_maintenance_on_enable
                      - automation.irrigation_pre_feed_air_stir_start
                      - automation.irrigation_pre_feed_air_stir_stop
                      - automation.irrigation_startup_recovery
                      - automation.irrigation_table_drain_pump
                      - automation.irrigation_maintenance_cycle
                      - automation.irrigation_watchdog

    - id: automation.irrigation_maintenance_cycle
      alias: Irrigation — Maintenance Cycle
      description: Runs stir then air every maintenance_interval_minutes. Skips if feed is within 60 min or a feed/pre-feed is running.
      triggers:
        - trigger: time_pattern
          minutes: /5
      conditions:
        - condition: state
          entity_id: input_boolean.irrigation_enabled
          state: "on"
        - condition: state
          entity_id: input_boolean.alternating_active
          state: "off"
        - condition: not
          conditions:
            - condition: state
              entity_id: script.run_feed_cycle
              state: "on"
        - condition: template
          value_template: >
            {% set next_feed = states("input_datetime.next_feed_time") %}
            {% if next_feed in ["unknown", "unavailable"] %}true
            {% else %}
              {{ (as_timestamp(next_feed) - as_timestamp(now())) > 3600 }}
            {% endif %}
        - condition: template
          value_template: >
            {% set last = state_attr("automation.irrigation_maintenance_cycle", "last_triggered") %}
            {% if last is none %}true
            {% else %}
              {{ (as_timestamp(now()) - as_timestamp(last)) >= (states("input_number.maintenance_interval_minutes") | int * 60) }}
            {% endif %}
      actions:
        - action: switch.turn_on
          target:
            entity_id:
              - switch.feed_stir_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
        - delay:
            minutes: "{{ states('input_number.maintenance_stir_minutes') | int }}"
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_stir_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
        - delay:
            milliseconds: 500
        - action: switch.turn_on
          target:
            entity_id: switch.air_pump_irrigation_tent
        - delay:
            minutes: "{{ states('input_number.maintenance_air_minutes') | int }}"
        - action: switch.turn_off
          target:
            entity_id: switch.air_pump_irrigation_tent
      mode: single

    - id: automation.irrigation_low_flow_safety
      alias: Irrigation — Low Flow Safety
      description: >
        If a feed/flush pump has been running for 2 minutes but flow rate is
        still below 0.5 L/min, assume clogged emitter, dry pump head, kinked
        line, or sensor failure. Force all pumps and valves off, set FAULT
        status, notify. 2 min waits for the pulse-counter sensor (60 s update
        interval) to publish at least one reading from a fully pump-on window.
      triggers:
        - trigger: state
          entity_id:
            - switch.feed_pump_irrigation_tent
            - switch.flush_pump_irrigation_tent
          to: 'on'
          for:
            minutes: 2
      conditions:
        - condition: numeric_state
          entity_id: sensor.flow_rate_irrigation_tent
          below: 0.5
      actions:
        - action: script.stop_alternating
        - action: script.turn_off
          target:
            entity_id:
              - script.run_feed_cycle
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_pump_irrigation_tent
              - switch.flush_pump_irrigation_tent
              - switch.feed_stir_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
              - switch.air_pump_irrigation_tent
        - action: valve.close_valve
          target:
            entity_id:
              - valve.feed_valve_irrigation_tent
              - valve.flush_valve_irrigation_tent
        - action: input_text.set_value
          target:
            entity_id: input_text.irrigation_status
          data:
            value: FAULT — Low flow with pump on
        - action: notify.mobile_app_sm_a166w
          data:
            title: Irrigation Low Flow Alert
            message: >
              Pump running but flow rate is {{ states('sensor.flow_rate_irrigation_tent') }} L/min
              after 2 min. Possible clogged emitter, dry pump, kinked line, or
              sensor failure. All pumps and valves forced off — investigate.
      mode: single

# Humidity Control — mode-based switching between humidify / dehumidify
# Mode selector: input_select.tent_humidity_mode (Humidify / Dehumidify / Off)
# Fogger smart plug: switch.humidifier
# Fan PWM: fan.grow_tent_one_humidifier_fan_pwm (grow-tent-one ESP32-C3)
# Dehumidifier: humidifier.dehumidifier_tent (Midea, standalone)
# AC dry mode: climate.air_conditioner_tent (Midea, set to 'dry')
# Humidity sensor: sensor.tent_average_humidity (averaged template)

########## MODE SWITCHING ##########

# When mode changes, shut off the opposing equipment

tent_irrigation_schedule:
  script:
    tent_irrigation_rebuild_feed_schedule:
      alias: Tent Irrigation — Rebuild Feed Schedule
      description: >-
        Recomputes today's feed slots from feeds_per_day_2 and the light window,
        then points next_feed_time, current_feed_number and the pre-feed window at
        the next FUTURE feed. Pure schedule math with no day-counter, maintenance
        or status side effects. Shared by Daily Setup and the
        Rebuild-on-Feeds-Change automation.
      sequence:
        - variables:
            feeds_per_day: '{{ states(''input_number.feeds_per_day_2'') | int }}'
            lead_min: '{{ states(''input_number.air_stir_lead_minutes'') | int }}'
            lights_on_h: '{{ states(''input_datetime.veg_lights_on_time'')[0:2] | int }}'
            lights_on_m: '{{ states(''input_datetime.veg_lights_on_time'')[3:5] | int }}'
            lights_off_h: '{{ states(''input_datetime.veg_lights_off_time'')[0:2] | int }}'
            lights_off_m: '{{ states(''input_datetime.veg_lights_off_time'')[3:5] | int }}'
            today_str: '{{ now().date() | string }}'
            on_total_min: '{{ lights_on_h * 60 + lights_on_m }}'
            off_total_min: '{{ lights_off_h * 60 + lights_off_m }}'
            lights_on_duration_min: >-
              {% if off_total_min | int > on_total_min | int %}{{ off_total_min | int - on_total_min | int }}{% else %}{{ (24 * 60 - on_total_min | int) + off_total_min | int }}{% endif %}
            interval_min: >-
              {% set dur = lights_on_duration_min | int - 35 %}
              {% if feeds_per_day > 1 %}{{ (dur / (feeds_per_day - 1)) | round(0) | int }}{% else %}{{ dur | int }}{% endif %}
            # Two parallel loop templates instead of one + JSON pack/unpack — HA's
            # from_json filter rejected our JSON output for an opaque reason
            # (input was valid JSON per error display). Cheaper to just iterate twice.
            chosen_feed_n: >-
              {% set base = today_at('%02d:%02d:00' | format(lights_on_h, lights_on_m)) %}
              {% set ns = namespace(n=0) %}
              {% for n in range(1, feeds_per_day + 1) %}
                {% set offset = 5 + (n - 1) * (interval_min | int) %}
                {% set fdt = base + timedelta(minutes=offset) %}
                {% if ns.n == 0 and fdt > now() %}
                  {% set ns.n = n %}
                {% endif %}
              {% endfor %}
              {{ ns.n if ns.n > 0 else 1 }}
            chosen_feed_dt: >-
              {% set base = today_at('%02d:%02d:00' | format(lights_on_h, lights_on_m)) %}
              {% set ns = namespace(n=0, dt=none) %}
              {% for n in range(1, feeds_per_day + 1) %}
                {% set offset = 5 + (n - 1) * (interval_min | int) %}
                {% set fdt = base + timedelta(minutes=offset) %}
                {% if ns.n == 0 and fdt > now() %}
                  {% set ns.n = n %}
                  {% set ns.dt = fdt %}
                {% endif %}
              {% endfor %}
              {% if ns.n == 0 %}
                {{ (base + timedelta(days=1, minutes=5)).strftime('%Y-%m-%d %H:%M:%S') }}
              {% else %}
                {{ ns.dt.strftime('%Y-%m-%d %H:%M:%S') }}
              {% endif %}
            chosen_pre_start_dt: >-
              {% set f = strptime(chosen_feed_dt, '%Y-%m-%d %H:%M:%S') %}
              {{ (f - timedelta(minutes=lead_min)).strftime('%Y-%m-%d %H:%M:%S') }}
            chosen_pre_stop_dt: >-
              {% set f = strptime(chosen_feed_dt, '%Y-%m-%d %H:%M:%S') %}
              {{ (f - timedelta(minutes=5)).strftime('%Y-%m-%d %H:%M:%S') }}
        - action: input_number.set_value
          target:
            entity_id: input_number.current_feed_number
          data:
            value: '{{ (chosen_feed_n | int) - 1 }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.next_feed_time
          data:
            datetime: '{{ chosen_feed_dt }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.next_pre_feed_start
          data:
            datetime: '{{ chosen_pre_start_dt }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.next_pre_feed_stop
          data:
            datetime: '{{ chosen_pre_stop_dt }}'
  automation:
    - id: automation.irrigation_daily_setup
      alias: Tent Irrigation — Daily Setup at Lights On
      description: >
        Resets daily counters, calculates feed schedule, sets next_feed_time to
        the **next future feed in today's window** (not just the first one).
        Normally fires at input_datetime.daily_setup_time (~17:00) when all of
        today's feeds are in the future, so the chosen feed = feed 1.
        When fired mid-day via automation.tent_irrigation_re_enable_maintenance_on_enable
        (user re-enabled irrigation after some of today's feeds already passed),
        iterates today's planned feeds, picks the first one still in the future,
        and sets current_feed_number = (chosen_n - 1) so feed_trigger increments
        cleanly. Falls back to tomorrow's first feed if all of today's are past.
      triggers:
        - platform: time
          at: input_datetime.daily_setup_time
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: 'on'
      actions:
        - action: automation.turn_on
          target:
            entity_id: automation.tent_irrigation_maintenance_cycle
        # Feed-slot math is shared with script.tent_irrigation_rebuild_feed_schedule.
        - action: script.tent_irrigation_rebuild_feed_schedule
        - variables:
            current_day: '{{ states(''input_number.tent_irrigation_day_counter'') | int }}'
            interval: '{{ states(''input_number.flush_day_interval'') | int }}'
        - choose:
            - conditions:
                - condition: template
                  value_template: '{{ current_day > interval * 2 }}'
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.tent_irrigation_day_counter
                  data:
                    value: 0
                - action: notify.mobile_app_sm_a166w
                  data:
                    title: Irrigation Counter Reset
                    message: >
                      Day counter was {{ current_day }} (>2x interval of {{ interval }}).
                      Reset to 0. Investigate why flushes have been missing.
            - conditions:
                - condition: template
                  value_template: '{{ true }}'
              sequence:
                - action: input_number.increment
                  target:
                    entity_id: input_number.tent_irrigation_day_counter
        - action: input_text.set_value
          target:
            entity_id: input_text.tent_irrigation_status
          data:
            value: Idle
      mode: single
    - id: automation.irrigation_rebuild_on_feeds_change
      alias: Tent Irrigation — Rebuild Schedule on Feeds/Day Change
      description: >-
        Re-spaces the remaining feeds the moment feeds_per_day_2 changes (dashboard
        edit, per-stage profile, etc.) so a mid-cycle change applies immediately
        instead of waiting for the next daily setup. Uses the shared rebuild script,
        so no day-counter or maintenance side effects.
      triggers:
        - trigger: state
          entity_id: input_number.feeds_per_day_2
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: 'on'
        - condition: template
          value_template: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unknown', 'unavailable'] }}"
      actions:
        - action: script.tent_irrigation_rebuild_feed_schedule
      mode: single
    - id: automation.irrigation_lights_off_stop
      alias: Tent Irrigation — Lights Off Cleanup
      description: Stops all irrigation activity at lights-off
      triggers:
        - at: input_datetime.veg_lights_off_time
          trigger: time
      actions:
        - action: script.stop_alternating
        - action: script.turn_off
          target:
            entity_id:
              - script.run_feed_cycle
          data: {}
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_pump_irrigation_tent
              - switch.flush_pump_irrigation_tent
              - switch.air_pump_irrigation_tent
              - switch.feed_stir_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
          data: {}
        - action: valve.close_valve
          target:
            entity_id:
              - valve.feed_valve_irrigation_tent
              - valve.flush_valve_irrigation_tent
              - valve.flush_drain_valve_irrigation_tent
        - action: automation.turn_off
          target:
            entity_id: automation.tent_irrigation_maintenance_cycle
          data:
            stop_actions: true
        - action: input_text.set_value
          target:
            entity_id: input_text.tent_irrigation_status
          data:
            value: Idle
      mode: single

tent_irrigation_schedule:
  automation:
    - id: automation.irrigation_daily_setup
      alias: Irrigation — Daily Setup at Lights On
      description: >
        Resets daily counters, calculates feed schedule, sets next_feed_time to
        first feed. Triggered by input_datetime.daily_setup_time (default 17:00,
        i.e. ~1 hour before veg_lights_on_time of 18:00) so that pre-feed
        datetimes computed here land in the future relative to "now" — otherwise
        the pre-feed time trigger for the first feed of the day silently fails.
        If you shift veg_lights_on_time, also shift daily_setup_time to stay
        comfortably ahead of (first_feed - air_stir_lead_minutes).
      triggers:
        - platform: time
          at: input_datetime.daily_setup_time
      conditions:
        - condition: state
          entity_id: input_boolean.irrigation_enabled
          state: 'on'
      actions:
        - action: automation.turn_on
          target:
            entity_id: automation.irrigation_maintenance_cycle
        - action: input_number.set_value
          target:
            entity_id: input_number.current_feed_number
          data:
            value: 0
        - variables:
            lights_on_h: '{{ states(''input_datetime.veg_lights_on_time'')[0:2] | int }}'
            lights_on_m: '{{ states(''input_datetime.veg_lights_on_time'')[3:5] | int }}'
            lights_off_h: '{{ states(''input_datetime.veg_lights_off_time'')[0:2] | int }}'
            lights_off_m: '{{ states(''input_datetime.veg_lights_off_time'')[3:5] | int }}'
            today_str: '{{ now().date() | string }}'
            on_total_min: '{{ lights_on_h * 60 + lights_on_m }}'
            off_total_min: '{{ lights_off_h * 60 + lights_off_m }}'
            first_feed_total_min: '{{ on_total_min + 5 }}'
            first_feed_h: '{{ (first_feed_total_min // 60) % 24 }}'
            first_feed_m: '{{ first_feed_total_min % 60 }}'
            first_feed_dt: '{{ today_str ~ '' '' ~ (''0'' ~ (first_feed_h | string))[-2:] ~ '':'' ~ (''0'' ~ (first_feed_m | string))[-2:] ~ '':00'' }}'
            lead_min: '{{ states(''input_number.air_stir_lead_minutes'') | int }}'
            pre_start_total: '{{ first_feed_total_min - lead_min }}'
            pre_start_h: '{{ (pre_start_total // 60) % 24 }}'
            pre_start_m: '{{ pre_start_total % 60 }}'
            pre_start_dt: '{{ today_str ~ '' '' ~ (''0'' ~ (pre_start_h | string))[-2:] ~ '':'' ~ (''0'' ~ (pre_start_m | string))[-2:] ~ '':00'' }}'
            pre_stop_total: '{{ first_feed_total_min - 5 }}'
            pre_stop_h: '{{ (pre_stop_total // 60) % 24 }}'
            pre_stop_m: '{{ pre_stop_total % 60 }}'
            pre_stop_dt: '{{ today_str ~ '' '' ~ (''0'' ~ (pre_stop_h | string))[-2:] ~ '':'' ~ (''0'' ~ (pre_stop_m | string))[-2:] ~ '':00'' }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.next_feed_time
          data:
            datetime: '{{ first_feed_dt }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.next_pre_feed_start
          data:
            datetime: '{{ pre_start_dt }}'
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.next_pre_feed_stop
          data:
            datetime: '{{ pre_stop_dt }}'
        - variables:
            current_day: '{{ states(''input_number.irrigation_day_counter'') | int }}'
            interval: '{{ states(''input_number.flush_day_interval'') | int }}'
        - choose:
            - conditions:
                - condition: template
                  value_template: '{{ current_day > interval * 2 }}'
              sequence:
                - action: input_number.set_value
                  target:
                    entity_id: input_number.irrigation_day_counter
                  data:
                    value: 0
                - action: notify.mobile_app_sm_a166w
                  data:
                    title: Irrigation Counter Reset
                    message: >
                      Day counter was {{ current_day }} (>2x interval of {{ interval }}).
                      Reset to 0. Investigate why flushes have been missing.
            - conditions:
                - condition: template
                  value_template: '{{ true }}'
              sequence:
                - action: input_number.increment
                  target:
                    entity_id: input_number.irrigation_day_counter
        - action: input_text.set_value
          target:
            entity_id: input_text.irrigation_status
          data:
            value: Idle
      mode: single
    - id: automation.irrigation_lights_off_stop
      alias: Irrigation — Lights Off Cleanup
      description: Stops all irrigation activity at lights-off
      triggers:
        - at: input_datetime.veg_lights_off_time
          trigger: time
      actions:
        - action: script.stop_alternating
        - action: script.turn_off
          target:
            entity_id:
              - script.run_feed_cycle
          data: {}
        - action: switch.turn_off
          target:
            entity_id:
              - switch.feed_pump_irrigation_tent
              - switch.flush_pump_irrigation_tent
              - switch.air_pump_irrigation_tent
              - switch.feed_stir_pump_irrigation_tent
              - switch.flush_stir_pump_irrigation_tent
          data: {}
        - action: valve.close_valve
          target:
            entity_id:
              - valve.feed_valve_irrigation_tent
              - valve.flush_valve_irrigation_tent
              - valve.flush_drain_valve_irrigation_tent
        - action: automation.turn_off
          target:
            entity_id: automation.irrigation_maintenance_cycle
          data:
            stop_actions: true
        - action: input_text.set_value
          target:
            entity_id: input_text.irrigation_status
          data:
            value: Idle
      mode: single

tent_irrigation_reservoirs:
  automation:
    - id: automation.fill_feed_reservoir
      alias: Fill — Feed Reservoir
      description: >
        Whenever the feed fill valve opens (manually or scripted), waits for
        the reservoir-full float to trip and then closes the valve. If the
        float never trips within input_number.feed_fill_timeout_duration,
        closes the valve as a safety timeout. Adjust the helper if you
        change reservoir size, line size, or supply pressure.
      triggers:
        - trigger: state
          entity_id: valve.feed_fill_valve_irrigation_tent
          to: 'open'
      actions:
        - wait_for_trigger:
            - platform: numeric_state
              entity_id: sensor.feed_level_irrigation_tent
              above: 99
          timeout:
            seconds: "{{ states('input_number.feed_fill_timeout_duration') | int }}"
        - action: valve.close_valve
          target:
            entity_id: valve.feed_fill_valve_irrigation_tent
        - if:
            - condition: template
              value_template: '{{ wait.completed == false }}'
          then:
            - action: notify.mobile_app_sm_a166w
              data:
                title: Feed Fill Timeout
                message: >
                  Feed fill valve was open for
                  {{ states('input_number.feed_fill_timeout_duration') | int }} sec
                  without the full float tripping — auto-closed. Verify
                  reservoir level and float sensor.
      mode: single
    - id: automation.fill_flush_reservoir
      alias: Fill — Flush Reservoir
      description: >
        Whenever the flush fill valve opens (manually or scripted), waits for
        the reservoir-full float to trip and then closes the valve. If the
        float never trips within input_number.flush_fill_timeout_duration,
        closes the valve as a safety timeout. Adjust the helper if you
        change reservoir size, line size, or supply pressure.
      triggers:
        - trigger: state
          entity_id: valve.flush_fill_valve_irrigation_tent
          to: 'open'
      actions:
        - wait_for_trigger:
            - platform: numeric_state
              entity_id: sensor.flush_level_irrigation_tent
              above: 99
          timeout:
            seconds: "{{ states('input_number.flush_fill_timeout_duration') | int }}"
        - action: valve.close_valve
          target:
            entity_id: valve.flush_fill_valve_irrigation_tent
        - if:
            - condition: template
              value_template: '{{ wait.completed == false }}'
          then:
            - action: notify.mobile_app_sm_a166w
              data:
                title: Flush Fill Timeout
                message: >
                  Flush fill valve was open for
                  {{ states('input_number.flush_fill_timeout_duration') | int }} sec
                  without the full float tripping — auto-closed. Verify
                  reservoir level and float sensor.
      mode: single
    - id: automation.feed_reservoir_empty_alert
      alias: Alert — Feed Reservoir Dry
      description: Immediate push notification when feed reservoir goes dry
      triggers:
        - trigger: numeric_state
          entity_id: sensor.feed_level_irrigation_tent
          below: 1
          for:
            minutes: 1
      actions:
        - action: notify.mobile_app_sm_a166w
          data:
            title: Feed Reservoir Empty
            message: Feed reservoir is dry — refill needed.
      mode: single
    - id: automation.feed_reservoir_empty_repeat
      alias: Alert — Feed Reservoir Dry (Repeat)
      description: Repeats push notification every 30 minutes while feed reservoir stays dry
      triggers:
        - trigger: time_pattern
          minutes: /30
      conditions:
        - condition: numeric_state
          entity_id: sensor.feed_level_irrigation_tent
          below: 1
      actions:
        - action: notify.mobile_app_sm_a166w
          data:
            title: Feed Reservoir Still Empty
            message: Feed reservoir is still dry — refill needed.
      mode: single
    - id: automation.flush_reservoir_empty_alert
      alias: Alert — Flush Reservoir Dry
      description: Immediate push notification when flush reservoir goes dry
      triggers:
        - trigger: numeric_state
          entity_id: sensor.flush_level_irrigation_tent
          below: 1
          for:
            minutes: 1
      actions:
        - action: notify.mobile_app_sm_a166w
          data:
            title: Flush Reservoir Empty
            message: Flush reservoir is dry — refill needed.
      mode: single
    - id: automation.flush_reservoir_empty_repeat
      alias: Alert — Flush Reservoir Dry (Repeat)
      description: Repeats push notification every 30 minutes while flush reservoir stays dry
      triggers:
        - trigger: time_pattern
          minutes: /30
      conditions:
        - condition: numeric_state
          entity_id: sensor.flush_level_irrigation_tent
          below: 1
      actions:
        - action: notify.mobile_app_sm_a166w
          data:
            title: Flush Reservoir Still Empty
            message: Flush reservoir is still dry — refill needed.
      mode: single

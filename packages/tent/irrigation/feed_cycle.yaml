tent_irrigation_feed_cycle:
  automation:
    - id: automation.irrigation_feed_trigger
      alias: Tent Irrigation — Feed Trigger
      description: Triggers a feed cycle when next_feed_time is reached
      triggers:
        - platform: time
          at: input_datetime.next_feed_time
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: 'on'
      actions:
        - action: input_number.increment
          target:
            entity_id: input_number.current_feed_number
        - action: script.run_feed_cycle
        - wait_template: '{{ not is_state(''script.run_feed_cycle'', ''on'') }}'
          timeout: 00:60:00
        - action: script.tent_irrigation_advance_to_next_feed
      mode: single
    - id: automation.irrigation_pre_feed_start
      alias: Tent Irrigation — Pre-Feed Air/Stir Start
      description: Starts air/stir alternating at lead time before next feed
      triggers:
        - platform: time
          at: input_datetime.next_pre_feed_start
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: 'on'
        - condition: template
          value_template: '{{ states(''input_number.current_feed_number'') | int < states(''input_number.feeds_per_day_2'') | int }}'
      actions:
        - action: script.run_alternating
      mode: single
    - id: automation.irrigation_pre_feed_stop
      alias: Tent Irrigation — Pre-Feed Air/Stir Stop
      description: Stops air/stir alternating 5 minutes before next feed
      triggers:
        - platform: time
          at: input_datetime.next_pre_feed_stop
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: 'on'
      actions:
        - action: script.stop_alternating
      mode: single

    - id: oneshot_feed_check_20260619
      alias: Oneshot Feed Check 20260619
      description: >-
        Temporary one-shot. Fires at 18:25 local tonight (2026-06-19), reports
        whether today 18:05 feed ran (feed trigger + flow total), pushes a phone
        notification, then disables itself. Safe to delete after tonight.
      mode: single
      triggers:
        - trigger: time
          at: "18:25:00"
      conditions:
        - condition: template
          value_template: "{{ now().date() | string == '2026-06-19' }}"
      actions:
        - variables:
            last_fed: "{{ state_attr('automation.tent_irrigation_feed_trigger','last_triggered') }}"
            fed_today: "{{ last_fed is not none and as_local(last_fed).date() == now().date() }}"
            flow: "{{ states('sensor.flow_total_irrigation_tent') | float(0) }}"
            status: "{{ states('input_text.tent_irrigation_status') }}"
            nextfeed: "{{ states('input_datetime.next_feed_time') }}"
            verdict: "{{ 'ran' if (fed_today and flow > 0) else ('attempted_no_flow' if fed_today else 'no_trigger') }}"
        - action: notify.mobile_app_sm_a166w
          data:
            title: "{{ 'Tent feed ran (' ~ flow ~ ' L)' if verdict == 'ran' else ('Tent feed attempted - NO FLOW' if verdict == 'attempted_no_flow' else 'Tent feed did NOT run') }}"
            message: >-
              {% if verdict == 'ran' %}18:05 feed fired at {{ as_local(last_fed).strftime('%H:%M') }}. Flow total {{ flow }} L. Status: {{ status }}. Next feed: {{ nextfeed }}.{% elif verdict == 'attempted_no_flow' %}Feed trigger fired at {{ as_local(last_fed).strftime('%H:%M') }} but flow total is {{ flow }} L - possible dry reservoir, blockage, or pump issue. Status: {{ status }}.{% else %}No feed trigger today as of 18:25. Status: {{ status }}, flow {{ flow }} L, next feed still {{ nextfeed }}. Check the system.{% endif %}
        - action: persistent_notification.create
          data:
            notification_id: oneshot_feed_check_20260619
            title: Tent feed check (18:25)
            message: >-
              Verdict: {{ verdict }}. Feed trigger last_triggered: {{ last_fed }}. Flow total: {{ flow }} L. Status: {{ status }}. Next feed: {{ nextfeed }}.
        - action: automation.turn_off
          target:
            entity_id: automation.oneshot_feed_check_20260619

tent_irrigation_feed_cycle:
  automation:
    - id: automation.irrigation_feed_trigger
      alias: Tent Irrigation — Feed Trigger
      description: Triggers a feed cycle when next_feed_time is reached
      triggers:
        - platform: time
          at: input_datetime.next_feed_time
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: 'on'
      actions:
        - action: input_number.increment
          target:
            entity_id: input_number.current_feed_number
        - action: script.run_feed_cycle
        - wait_template: '{{ not is_state(''script.run_feed_cycle'', ''on'') }}'
          timeout: 00:60:00
        - action: script.tent_irrigation_advance_to_next_feed
      mode: single
    - id: automation.irrigation_pre_feed_start
      alias: Tent Irrigation — Pre-Feed Stir
      description: >-
        Level-sized stir of the FEED reservoir in the lead window before each feed
        (homogenize right before the draw). Self-sizes from the float level, so it
        finishes well before the settle window.
      triggers:
        - platform: time
          at: input_datetime.next_pre_feed_start
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: 'on'
        - condition: template
          value_template: '{{ states(''input_number.current_feed_number'') | int < states(''input_number.feeds_per_day_2'') | int }}'
      actions:
        - action: script.tent_stir_burst
          data:
            tank: feed
            turnover: "{{ states('input_number.stir_turnover_prefeed') | float(0.5) }}"
      mode: single
    - id: automation.irrigation_pre_feed_stop
      alias: Tent Irrigation — Pre-Feed Settle
      description: >-
        Settle window: turns stir + air off (via stop_alternating) feed_settle_duration
        before the feed so the vortex calms and entrained bubbles clear, giving the
        feed pump a clean prime.
      triggers:
        - platform: time
          at: input_datetime.next_pre_feed_stop
      conditions:
        - condition: state
          entity_id: input_boolean.tent_irrigation_enabled
          state: 'on'
      actions:
        - action: script.stop_alternating
      mode: single

# Feed volume — how much water each pump run delivered, for the Grow Journal.
#
# STATISTICS ONLY: nothing here switches a pump, valve or selector.
#
# Formula: litres = (Flow Total at pump-off − Flow Total at pump-on) × Feed Volume Factor.
# sensor.flow_total_irrigation_tent is the ESP pulse counter's running total, already
# bucket-calibrated on the device (62.72 pulses/L, 2026-05-10). The factor is the fine
# correction: catch a feed in a jug, type the measured litres next to that feed in the Grow
# Journal (Stats tab), and it suggests a factor = median(measured ÷ raw). Set it here by hand.
# The journal never writes to Home Assistant.
#
# One pump serves both lines (lines.yaml): `line` records which IN valve was open at start.
# The pump-off trigger waits 20 s so the line's drain-down flow is counted.
# The device resets the pulse total when the feed tank's empty float releases; if the total
# went down during a run, only the litres counted since the reset are used (an undercount,
# flagged in `note`).
# If the flow total is unavailable at either end, the previous value is kept and `error`
# says why: the journal records nothing rather than an invented number.
#
# The journal keys each feed on `ended`, so a restart (which re-renders nothing here) never
# records a feed twice.

tent_irrigation_feed_volume:

  input_number:
    feed_volume_factor:
      name: "Feed Volume Factor"
      min: 0.1
      max: 2
      step: 0.001
      mode: box
      icon: mdi:tune-variant
    # NO initial: — the calibrated value must survive the push-triggered restarts.
    # A never-set helper reads its minimum (0.1); the template treats anything < 0.5 as 1.0,
    # so an unset factor can never pass for a real one.

  template:
    - triggers:
        - trigger: state
          entity_id: switch.feed_pump_irrigation_tent
          to: "on"
          id: start
        - trigger: state
          entity_id: switch.feed_pump_irrigation_tent
          to: "off"
          for:
            seconds: 20
          id: end
      # Only plain values here: `this` (the sensor's previous state) is available to the
      # entity's own templates below, not to these action variables.
      actions:
        - variables:
            total: "{{ states('sensor.flow_total_irrigation_tent') | float(none) }}"
            factor_raw: "{{ states('input_number.feed_volume_factor') | float(1) }}"
            factor: "{{ factor_raw if factor_raw >= 0.5 else 1.0 }}"
      sensor:
        - name: "Tent Last Feed Volume"
          unique_id: tent_last_feed_volume
          unit_of_measurement: "L"
          device_class: volume
          icon: mdi:water-pump
          state: >
            {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
            {%- if ok %}{{ (raw * factor) | round(2) }}{%- else %}{{ this.state if this is defined else 'unknown' }}{%- endif %}
          attributes:
            running: "{{ trigger.id == 'start' }}"
            start_total: "{{ total if trigger.id == 'start' else none }}"
            started: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {{ now().isoformat() if trigger.id == 'start' else p.get('started') }}
            line: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {%- if trigger.id == 'start' %}{{ 'feed' if is_state('valve.feed_valve_irrigation_tent', 'open') else ('flush' if is_state('valve.flush_valve_irrigation_tent', 'open') else 'unknown') }}{%- else %}{{ p.get('line', 'unknown') }}{%- endif %}
            ended: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {{ now().isoformat() if ok else p.get('ended') }}
            seconds: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {%- if ok and p.get('started') %}{{ (now() - as_datetime(p.get('started'))).total_seconds() | round(0) }}
              {%- else %}{{ p.get('seconds') }}{%- endif %}
            raw_l: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {{ raw if ok else p.get('raw_l') }}
            factor: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {{ factor if ok else p.get('factor') }}
            note: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {%- if ok %}{{ 'flow total reset during the run; counted since the reset' if total < st else '' }}
              {%- else %}{{ p.get('note', '') }}{%- endif %}
            error: >
              {%- set p = this.attributes if this is defined else {} -%}{%- set st = p.get('start_total') -%}{%- set ok = trigger.id == 'end' and p.get('running', false) and total is number and st is number -%}{%- set raw = (((total - st) if total >= st else total) | round(3)) if ok else none -%}
              {%- if trigger.id == 'end' and not ok %}{{ 'flow total unavailable' if p.get('running', false)
                 else 'pump stopped without a recorded start' }}{%- endif %}

tent_irrigation_random_timer_auto:
  timer:
    random_timer:
      name: Random Timer
      icon: mdi:timer-outline
      duration: "00:05:00"
      restore: true

  input_number:
    random_timer_minutes:
      name: Random Timer Minutes
      min: 1
      max: 60
      step: 1
      initial: 5
      unit_of_measurement: min
      mode: slider
      icon: mdi:timer-outline

  automation:
    - id: random_timer_finished
      alias: "Random Timer — Finished cleanup"
      description: >
        When timer.random_timer finishes naturally, close the feed valve
        and turn off the feed pump. The script handles cancel cleanup
        inline.
      triggers:
        - platform: event
          event_type: timer.finished
          event_data:
            entity_id: timer.random_timer
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.feed_pump_irrigation_tent
        - action: valve.close_valve
          target:
            entity_id: valve.feed_valve_irrigation_tent
      mode: single

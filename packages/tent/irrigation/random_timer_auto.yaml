tent_irrigation_random_timer_auto:
  timer:
    random_timer:
      name: Random Timer
      icon: mdi:timer-outline
      duration: "00:05:00"
      restore: true

  input_number:
    random_timer_minutes:
      name: Random Timer Minutes
      min: 1
      max: 60
      step: 1
      initial: 5
      unit_of_measurement: min
      mode: slider
      icon: mdi:timer-outline

  automation:
    - id: random_timer_finished
      alias: "Random Timer — Finished cleanup"
      description: >
        When timer.random_timer finishes naturally, turn OFF every member
        of group.random_timer_targets (valves close, switches turn off).
        Cancel cleanup is handled inline by the random_timer_auto script.
      triggers:
        - platform: event
          event_type: timer.finished
          event_data:
            entity_id: timer.random_timer
      actions:
        - repeat:
            for_each: "{{ expand('group.random_timer_targets') | map(attribute='entity_id') | list }}"
            sequence:
              - choose:
                  - conditions: "{{ repeat.item.startswith('valve.') }}"
                    sequence:
                      - action: valve.close_valve
                        target:
                          entity_id: "{{ repeat.item }}"
                default:
                  - action: switch.turn_off
                    target:
                      entity_id: "{{ repeat.item }}"
      mode: single

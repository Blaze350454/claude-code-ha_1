tent_camera_timelapse:
  # ================================================
  # Tent camera timelapse  (multi-camera, round-robin)
  # ------------------------------------------------
  # input_select.tent_timelapse is the single Start/Stop + cadence control:
  # "Off" disables; any interval sets the COMBINED gap between pics.
  #
  # Capture is ROUND-ROBIN: each scheduler fire snapshots ONE camera — the next
  # in rotation across all discovered camera.tent_* cams (the *_last_capture
  # local_file tiles and any unavailable cam are excluded). With N cams and a
  # combined interval I, each camera is shot every I*N, staggered I apart.
  # N=3 + "Every 30 min" => each cam every 90 min, 30 min apart = 1 pic / 30 min
  # overall. Adding tent_2 / tent_overhead needs ZERO changes here.
  #
  # Each cam stores into its own folder /config/www/timelapse/<shortname>/ as
  # <shortname>_<YYYYmmdd_HHMM>.jpg, and also overwrites <shortname>/latest.jpg.
  # That latest.jpg is shown on the dashboard via a per-camera "last capture"
  # local_file camera (camera.<shortname>_last_capture). NOTE: local_file is a
  # CONFIG-ENTRY integration now (no YAML); add one per camera via Settings ->
  # Devices & Services -> Add Integration -> Local File (file_path =
  # /config/www/timelapse/<shortname>/latest.jpg), or via the REST config-flow.
  # The per-camera folders must pre-exist (camera.snapshot does not mkdir):
  # tent_1, tent_2, tent_overhead are created on the host.
  #
  # Retention: on the 1st of each month, frames captured BEFORE the current month
  # are MOVED (not deleted) into /archive/<shortname>/ (host
  # ~/timelapse_archive/<shortname>/, bind-mounted), so www holds the current
  # month and the archive accumulates completed months. Served at
  # http://192.168.2.151:8123/local/timelapse/<shortname>/.
  #
  # Requires `allowlist_external_dirs: [/config/www/timelapse]` (covers subdirs).
  # www/ is gitignored. Rotation persists in input_number.timelapse_rotation_index.
  #
  # Compile one camera's lapse later, e.g.:
  #   ffmpeg -framerate 24 -pattern_type glob \
  #          -i '/archive/tent_1/tent_1_*.jpg' -pix_fmt yuv420p \
  #          -vf scale=1280:-2 tent_1_timelapse.mp4
  # ================================================

  shell_command:
    # On the 1st of each month, move every frame captured BEFORE this calendar
    # month into the per-camera archive (bind-mounted at /archive), so www holds
    # the current month. BusyBox find has no -newermt, so stamp a reference file
    # at the 1st of the month and use `! -newer`. latest.jpg is skipped (it
    # doesn't match <name>_*.jpg).
    timelapse_archive: >-
      sh -c 'ref=/tmp/tl_cut; touch -d "$(date +%Y-%m-01) 00:00:00" "$ref";
      for d in /config/www/timelapse/tent_*; do [ -d "$d" ] || continue;
      n=$(basename "$d"); mkdir -p "/archive/$n";
      find "$d" -type f -name "${n}_*.jpg" ! -newer "$ref" -exec mv {} "/archive/$n/" \; ;
      done; rm -f "$ref"'

  # Single control for the whole feature: "Off" disables it (button shows red),
  # any interval enables it (green) and sets the COMBINED gap between pics. No
  # `initial:` so the choice persists across restarts.
  input_select:
    tent_timelapse:
      name: Tent Timelapse
      icon: mdi:camera-timer
      options:
        - "Off"
        - Every 15 min
        - Every 30 min
        - Every 1 hour
        - Every 2 hours
        - Every 3 hours
        - Every 6 hours
        - Every 12 hours
        - Every 24 hours

  input_datetime:
    tent_timelapse_last_capture:
      name: Tent Timelapse Last Capture
      icon: mdi:camera-timer
      has_date: true
      has_time: true

  # Persistent round-robin pointer: which camera the next capture targets
  # (cams[idx % N]). No `initial:` so it survives restarts. Grows unbounded;
  # max is decades of captures away.
  input_number:
    timelapse_rotation_index:
      name: Timelapse Rotation Index
      icon: mdi:rotate-3d-variant
      min: 0
      max: 1000000
      step: 1
      mode: box

  script:
    camera_timelapse_capture:
      alias: Camera Timelapse — Capture
      icon: mdi:camera-timer
      mode: single
      sequence:
        # Discover tent cameras (exclude the *_last_capture local_file tiles and
        # any unavailable/unknown cam); sort for a stable rotation order
        # (tent_1, tent_2, tent_overhead).
        - variables:
            cams: >
              {{ states.camera | map(attribute='entity_id')
                 | select('match', 'camera.tent_')
                 | reject('search', '_last_capture')
                 | reject('is_state', 'unavailable')
                 | reject('is_state', 'unknown')
                 | list | sort }}
        # Nothing online -> stop quietly.
        - condition: template
          value_template: "{{ cams | length > 0 }}"
        - variables:
            idx: "{{ states('input_number.timelapse_rotation_index') | int(0) }}"
            cam: "{{ cams[idx % (cams | length)] }}"
            shortname: "{{ cams[idx % (cams | length)].split('.')[1] }}"
            stamp: "{{ now().strftime('%Y%m%d_%H%M') }}"
            is_blink: "{{ state_attr(cams[idx % (cams | length)], 'brand') == 'Blink' }}"
        # Blink quirk: trigger_camera only captures into Blink's cloud and HA
        # shows the cached thumbnail until refreshed. A flat wait is unreliable —
        # weak-signal cams (e.g. overhead, -64 dBm) need ~40s to upload while
        # tent_1 needs ~10s, so an 8s wait snapshotted STALE frames. Instead:
        # trigger, then poll (update_entity every 6s) until the thumbnail URL
        # actually changes, capped at ~48s so a stuck cam can't hang the rotation.
        # Non-Blink (streaming) cams skip straight to the snapshot.
        - if:
            - condition: template
              value_template: "{{ is_blink }}"
          then:
            - variables:
                pre_thumb: "{{ state_attr(cam, 'thumbnail') }}"
            - action: blink.trigger_camera
              target:
                entity_id: "{{ cam }}"
            - repeat:
                sequence:
                  - delay:
                      seconds: 6
                  - action: homeassistant.update_entity
                    target:
                      entity_id: "{{ cam }}"
                until:
                  - condition: template
                    value_template: >
                      {{ state_attr(cam, 'thumbnail') != pre_thumb or repeat.index >= 8 }}
        # Timestamped frame for the lapse sequence...
        - action: camera.snapshot
          target:
            entity_id: "{{ cam }}"
          data:
            filename: "/config/www/timelapse/{{ shortname }}/{{ shortname }}_{{ stamp }}.jpg"
        # ...and overwrite the per-cam latest.jpg (dashboard tile) — same frame,
        # no extra Blink trigger.
        - action: camera.snapshot
          target:
            entity_id: "{{ cam }}"
          data:
            filename: "/config/www/timelapse/{{ shortname }}/latest.jpg"
        # Advance the rotation pointer.
        - action: input_number.set_value
          target:
            entity_id: input_number.timelapse_rotation_index
          data:
            value: "{{ idx + 1 }}"

  automation:
    - id: camera_timelapse_scheduler
      alias: Camera Timelapse — Scheduler
      description: >-
        Checks every minute; captures the next camera in rotation when
        input_select.tent_timelapse is not Off and the combined interval has
        elapsed since the last capture.
      triggers:
        - trigger: time_pattern
          minutes: "/1"
      conditions:
        - condition: template
          value_template: >
            {% set sel = states('input_select.tent_timelapse') %}
            {% if sel in ['Off', 'unknown', 'unavailable'] %}
              false
            {% else %}
              {% set m = {'Every 15 min':15,'Every 30 min':30,'Every 1 hour':60,
                          'Every 2 hours':120,'Every 3 hours':180,'Every 6 hours':360,
                          'Every 12 hours':720,'Every 24 hours':1440} %}
              {% set iv = m.get(sel, 60) %}
              {% set last = state_attr('input_datetime.tent_timelapse_last_capture','timestamp') %}
              {{ last is none or (now().timestamp() - last) >= (iv * 60 - 30) }}
            {% endif %}
      actions:
        - action: script.camera_timelapse_capture
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.tent_timelapse_last_capture
          data:
            timestamp: "{{ now().timestamp() }}"
      mode: single

    - id: camera_timelapse_cleanup
      alias: Camera Timelapse — Monthly Archive (1st)
      description: >-
        On the 1st of each month at 03:30, moves frames from previous months into
        the per-camera archive (bind-mounted /archive); www keeps the current month.
      triggers:
        - trigger: time
          at: "03:30:00"
      conditions:
        - condition: template
          value_template: "{{ now().day == 1 }}"
      actions:
        - action: shell_command.timelapse_archive
      mode: single

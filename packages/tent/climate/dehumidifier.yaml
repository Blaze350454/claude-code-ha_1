tent_climate_dehumidifier:
  automation:
    - id: dehumidifier_on
      alias: "Dehumidifier - Turn On"
      trigger:
        - platform: template
          value_template: >
            {{ states('sensor.tent_average_humidity') | float(0) >
               (states('input_number.tent_humidifier_target_rh') | float(65) +
                states('input_number.tent_humidifier_hysteresis') | float(5)) }}
      condition:
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
        - condition: state
          entity_id: input_select.tent_humidity_mode
          state: "Dehumidify"
    # Sensor must be reporting a real value — see humidifier.yaml for why the
    # old `condition: not` with a list of state checks was always-true.
        - condition: template
          value_template: >
            {{ states('sensor.tent_average_humidity') not in ['unavailable', 'unknown'] }}
      action:
        - service: humidifier.turn_on
          target:
            entity_id: humidifier.dehumidifier_tent

# Turn OFF dehumidifier + AC when RH drops to target
    - id: dehumidifier_off
      alias: "Dehumidifier - Turn Off"
      trigger:
        - platform: template
          value_template: >
            {{ states('sensor.tent_average_humidity') | float(0) <=
               states('input_number.tent_humidifier_target_rh') | float(65) }}
      condition:
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
        - condition: state
          entity_id: humidifier.dehumidifier_tent
          state: "on"
      action:
        - service: humidifier.turn_off
          target:
            entity_id: humidifier.dehumidifier_tent

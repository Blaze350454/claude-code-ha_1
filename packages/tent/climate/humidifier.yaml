tent_climate_humidifier:
  automation:
    - id: humidifier_on
      alias: "Humidifier - Turn On"
      trigger:
        - platform: template
          value_template: >
            {{ states('sensor.tent_average_humidity') | float(0) <
               (states('input_number.humidifier_target_rh') | float(65) -
                states('input_number.humidifier_hysteresis') | float(5)) }}
      condition:
        - condition: state
          entity_id: input_select.tent_humidity_mode
          state: "Humidify"
        - condition: not
          conditions:
            - condition: state
              entity_id: sensor.tent_average_humidity
              state: "unavailable"
            - condition: state
              entity_id: sensor.tent_average_humidity
              state: "unknown"
    # Safety: block humidifier during flower nights (bud rot prevention)
        - condition: template
          value_template: >
            {% set is_flower = is_state('input_select.grow_tent_growth_stage', 'Flowering') %}
            {% set lights_off = is_state('light.hlg', 'off') %}
            {% set block_on = is_state('input_boolean.flower_night_humidifier_block', 'on') %}
            {{ not (is_flower and lights_off and block_on) }}
      action:
        - service: switch.turn_on
          target:
            entity_id: switch.humidifier
        - service: fan.turn_on
          target:
            entity_id: fan.grow_tent_one_humidifier_fan_pwm
          data:
            percentage: 80

# Turn OFF fogger when RH reaches target, fan runs 1 min extra to push remaining mist
    - id: humidifier_off
      alias: "Humidifier - Turn Off"
      trigger:
        - platform: template
          value_template: >
            {{ states('sensor.tent_average_humidity') | float(0) >=
               states('input_number.humidifier_target_rh') | float(65) }}
      condition:
        - condition: state
          entity_id: switch.humidifier
          state: "on"
      action:
        - service: switch.turn_off
          target:
            entity_id: switch.humidifier
        - delay: "00:01:00"
        - service: fan.turn_off
          target:
            entity_id: fan.grow_tent_one_humidifier_fan_pwm

# Safety: shut off fogger if reservoir temp exceeds 38°C
    - id: humidifier_overheat_shutoff
      alias: "Humidifier - Overheat Shutoff"
      trigger:
        - platform: numeric_state
          entity_id: sensor.grow_tent_one_humidifier_reservoir_temperature
          above: 38
      action:
        - service: switch.turn_off
          target:
            entity_id: switch.humidifier
        - service: fan.turn_off
          target:
            entity_id: fan.grow_tent_one_humidifier_fan_pwm
        - service: notify.persistent_notification
          data:
            title: "Humidifier Overheat"
            message: >
              Fogger shut off — reservoir temperature exceeded 38°C
              ({{ states('sensor.grow_tent_one_humidifier_reservoir_temperature') }}°C).
              Check water level and float valve.


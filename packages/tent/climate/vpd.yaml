tent_climate_vpd:
  automation:
    - id: vpd_out_of_range_alert
      alias: "VPD — Out of Range Alert"
      description: >
        Alert when VPD drifts outside the target +/- tolerance for 10 minutes.
        Tells user current VPD, target, and ideal RH to help them adjust.
      triggers:
        - trigger: template
          value_template: >
            {% set vpd = states('sensor.grow_tent_vpd') | float(0) %}
            {% set target = states('sensor.active_vpd_target') | float(1.0) %}
            {% set tol = states('input_number.vpd_tolerance') | float(0.3) %}
            {{ vpd > 0 and (vpd < target - tol or vpd > target + tol) }}
          for:
            minutes: 10
      conditions:
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
        - condition: template
          value_template: >
            {{ states('sensor.grow_tent_vpd') not in ['unknown', 'unavailable'] }}
      actions:
        - action: persistent_notification.create
          data:
            title: "VPD Out of Range"
            message: >
              VPD is {{ states('sensor.grow_tent_vpd') }} kPa
              (target: {{ states('sensor.active_vpd_target') }} kPa ± {{ states('input_number.vpd_tolerance') }}).
              Temp: {{ states('sensor.tent_average_temperature') }}°C,
              RH: {{ states('sensor.tent_average_humidity') }}%.
              Ideal RH for current temp: {{ states('sensor.vpd_ideal_rh') }}%.
      mode: single
    # Option A: humidifier loop tracks VPD via vpd_ideal_rh.
    # Whenever the ideal RH (back-solved from active VPD target + current temp)
    # changes, push the value into humidifier_target_rh, clamped by per-stage
    # min/max RH (set by the growth_stage_change_defaults automation).
    - id: vpd_sync_humidifier_target_rh
      alias: "VPD — Sync Humidifier Target RH (clamped)"
      description: >
        Copies sensor.vpd_ideal_rh into input_number.humidifier_target_rh on
        every change, clamped to [humidifier_min_rh, humidifier_max_rh] so the
        target never strays outside what's safe for the current growth stage.
      triggers:
        - trigger: state
          entity_id: sensor.vpd_ideal_rh
      conditions:
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
        - condition: template
          value_template: >
            {{ states('sensor.vpd_ideal_rh') not in ['unknown', 'unavailable', 'none', 'None'] }}
      variables:
        ideal: "{{ states('sensor.vpd_ideal_rh') | float(none) }}"
        rh_min: "{{ states('input_number.humidifier_min_rh') | float(40) }}"
        rh_max: "{{ states('input_number.humidifier_max_rh') | float(75) }}"
        clamped: "{{ [[ideal, rh_min] | max, rh_max] | min | round(1) }}"
      actions:
        - action: input_number.set_value
          target:
            entity_id: input_number.humidifier_target_rh
          data:
            value: "{{ clamped }}"
      mode: single

    - id: vpd_recovered_alert
      alias: "VPD — Back in Range"
      description: >
        Dismiss VPD alert when VPD returns to target range for 5 minutes.
      triggers:
        - trigger: template
          value_template: >
            {% set vpd = states('sensor.grow_tent_vpd') | float(0) %}
            {% set target = states('sensor.active_vpd_target') | float(1.0) %}
            {% set tol = states('input_number.vpd_tolerance') | float(0.3) %}
            {{ vpd > 0 and vpd >= target - tol and vpd <= target + tol }}
          for:
            minutes: 5
      conditions:
        - condition: state
          entity_id: input_boolean.grow_tent_automation_enabled
          state: "on"
      actions:
        - action: persistent_notification.create
          data:
            title: "VPD Recovered"
            message: >
              VPD back in range at {{ states('sensor.grow_tent_vpd') }} kPa
              (target: {{ states('sensor.active_vpd_target') }} kPa).
      mode: single

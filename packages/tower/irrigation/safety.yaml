tower_irrigation_safety:
  automation:
    - id: tower_irrigation_block_pump_when_dry
      alias: "Tower Irrigation — Block Pump When Reservoir Dry"
      description: >
        Force-stops the pump whenever the reservoir is dry — either because
        the pump was turned on while already dry, or because the reservoir
        drained while it was running. Mirrors tent's
        tent_irrigation_block_feed_when_reservoir_dry (packages/tent/irrigation/
        safety.yaml) simplified to this tower's single pump/single sensor
        (no separate feed/flush loops). Double trigger (equipment turned on
        OR sensor turned dry) with a re-check condition on both, so it's an
        independent backstop for whatever script.tower_irrigation_pump_cycle
        is doing — this still force-stops the pump even if the switch is ever
        driven from outside that script (manual dashboard toggle, etc).

        binary_sensor.grow_tower_water_level_low is device_class moisture:
        'on' = wet (water present), 'off' = dry. Now also pushes to phone +
        posts a persistent_notification every time it fires (2026-07 — LOW
        dry is the tower's single most catastrophic irrigation event, so it
        gets the same push+persistent_notification pairing tent reserves for
        its flood-stop automation, not just a plain push). The ongoing "still
        dry" nag every 30 min lives separately in
        automation.alert_tower_reservoir_low_dry_repeat
        (packages/tower/irrigation/reservoir.yaml) so this automation stays
        focused on the safety action.
      triggers:
        - trigger: state
          entity_id: switch.grow_tower_water_pump
          to: "on"
        - trigger: state
          entity_id: binary_sensor.grow_tower_water_level_low
          to: "off"
      conditions:
        - condition: state
          entity_id: binary_sensor.grow_tower_water_level_low
          state: "off"
        - condition: state
          entity_id: switch.grow_tower_water_pump
          state: "on"
      actions:
        - action: switch.turn_off
          target:
            entity_id: switch.grow_tower_water_pump
        - action: notify.send_message
          target:
            entity_id: notify.brenton_s_phone
          data:
            title: "Grow tower: reservoir critically low"
            message: >-
              Water level LOW sensor reads dry — pump force-stopped by the
              safety interlock. Refill the reservoir before resuming.
        - action: persistent_notification.create
          data:
            notification_id: tower_reservoir_low_dry
            title: "Grow tower reservoir critically low"
            message: >-
              {{ now().strftime('%Y-%m-%d %H:%M:%S') }} —
              binary_sensor.grow_tower_water_level_low is dry. Pump
              force-stopped by automation.tower_irrigation_block_pump_when_dry.
              Refill needed.
      mode: single

system_updates:
  # Two `version` sensors (running + latest stable container release) feed a
  # template binary_sensor that flips when they differ. The digest below
  # treats this binary_sensor the same as any `update.*` entity.
  sensor:
    - platform: version
      name: "HA Core Running"
      source: local
    - platform: version
      name: "HA Core Latest"
      source: container

  template:
    - binary_sensor:
        - name: "HA Core Update Available"
          unique_id: ha_core_update_available
          state: >-
            {% set latest = states('sensor.ha_core_latest') %}
            {% set running = states('sensor.ha_core_running') %}
            {{ latest not in ('unknown','unavailable','')
               and running not in ('unknown','unavailable','')
               and latest != running }}
          attributes:
            running_version: "{{ states('sensor.ha_core_running') }}"
            latest_version: "{{ states('sensor.ha_core_latest') }}"

  automation:
    # ----------------------------------------------------------------------
    # HA Updates Daily Digest
    # Single push at 09:00 local time listing available updates across all
    # `update.*` entities (HACS, custom integrations, device firmware,
    # custom cards) AND HA Core itself (via the version sensors above).
    # Only fires if at least one update is pending.
    #
    # Tagging applied via tag_ha_server_watchdog.py:
    #   area_id: ha_server
    #   labels:  sys_infrastructure, sev_warning
    # ----------------------------------------------------------------------
    - id: watchdog_ha_updates_daily_digest
      alias: "Watchdog — HA Updates Daily Digest"
      description: >
        Fires once daily at 09:00 local time with a list of available
        updates across HACS, custom integrations, custom cards, and
        device firmware. Only sends a push if at least one update is
        pending; otherwise silent.
      mode: single
      triggers:
        - trigger: time
          at: "09:00:00"
      conditions:
        - condition: template
          value_template: >-
            {{ (states.update | selectattr('state','eq','on') | list | count > 0)
               or is_state('binary_sensor.ha_core_update_available','on') }}
      variables:
        pending_updates: >-
          {{ states.update
             | selectattr('state','eq','on')
             | map(attribute='attributes.friendly_name')
             | list }}
        core_line: >-
          {% if is_state('binary_sensor.ha_core_update_available','on') %}
          HA Core: {{ states('sensor.ha_core_running') }} → {{ states('sensor.ha_core_latest') }}
          {% endif %}
        all_items: >-
          {{ ([core_line | trim] if core_line | trim else []) + pending_updates }}
        pending_count: "{{ all_items | count }}"
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.brenton_s_phone
          data:
            title: "HA updates available ({{ pending_count }})"
            message: >-
              {{ all_items | join(' • ') }}
        - action: persistent_notification.create
          data:
            notification_id: "watchdog_ha_updates_digest"
            title: "HA updates available ({{ pending_count }})"
            message: >-
              {% for name in all_items %}
              - {{ name }}
              {% endfor %}

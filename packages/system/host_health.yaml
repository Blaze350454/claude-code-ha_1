system_host_health:
  # External dead-man heartbeat to healthchecks.io. If HA dies (so it can't
  # ping out), healthchecks alerts via the channel configured on the check
  # page. This is the only watchdog that can catch "HA itself is gone" —
  # everything else in this file runs inside HA.
  rest_command:
    hc_ping_ha_alive:
      url: !secret hc_ha_alive_url
      method: get
      timeout: 10

  command_line:
    # Recorder DB size in MB. `stat -c%s` runs inside the HA container and
    # returns bytes — converted via value_template. Polled every 10 min.
    - sensor:
        name: "HA Database Size"
        unique_id: ha_database_size
        command: "stat -c%s /config/home-assistant_v2.db"
        scan_interval: 600
        unit_of_measurement: MB
        device_class: data_size
        state_class: measurement
        value_template: "{{ (value | float / 1048576) | round(1) }}"

  automation:
    # ----------------------------------------------------------------------
    # External Heartbeat (healthchecks.io)
    # Pings the configured healthchecks.io check every 10 min. The check is
    # set to 15-min period + 5-min grace, so missing 2 consecutive pings
    # triggers an alert from healthchecks.io via the channel set there.
    # This is the only watchdog in the system that can catch HA itself
    # being dead — all the others run inside HA.
    # ----------------------------------------------------------------------
    - id: watchdog_ha_external_heartbeat
      alias: "Watchdog — External Heartbeat (healthchecks.io)"
      description: >
        Every 10 min, ping healthchecks.io. No notification on success;
        healthchecks.io alerts you if pings stop coming.
      mode: single
      triggers:
        - trigger: time_pattern
          minutes: "/10"
      actions:
        - action: rest_command.hc_ping_ha_alive

    # ----------------------------------------------------------------------
    # HA Started Notifier
    # Fires when HA finishes booting (all integrations loaded). If you did
    # NOT trigger the restart yourself, the message itself is the alert —
    # investigate logs, host-pressure watchdog, OOM, etc. Will also fire on
    # every planned restart (config push, upgrade) — that's fine, it's a
    # heartbeat.
    # ----------------------------------------------------------------------
    - id: watchdog_ha_started
      alias: "Watchdog — HA Started"
      description: >
        Fires once when HA finishes booting (homeassistant event=start, after
        all integrations are loaded). Pushes to phone so unplanned restarts
        don't go unnoticed.
      mode: single
      triggers:
        - trigger: homeassistant
          event: start
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.brenton_s_phone
          data:
            title: "HA started"
            message: >-
              HA Core {{ states('sensor.ha_core_running') }} came back up at
              {{ now().strftime('%H:%M %Z') }}. If you didn't expect this,
              check container logs and the host-pressure watchdog.
        - action: persistent_notification.create
          data:
            notification_id: "watchdog_ha_started_{{ now().strftime('%Y%m%d_%H%M%S') }}"
            title: "HA started"
            message: >-
              HA Core {{ states('sensor.ha_core_running') }} started at
              {{ now().strftime('%Y-%m-%d %H:%M:%S %Z') }}.

    # ----------------------------------------------------------------------
    # HA Host Resource Pressure Watchdog
    # Fires when CPU / memory / swap / disk / 15-min load cross thresholds
    # on the HA VM (192.168.2.151), sustained for the per-resource window.
    #
    # Trigger philosophy: each condition is a single-cross event (HA's
    # numeric_state trigger only fires when value crosses the threshold).
    # If a value increases from 75 → 95, both the warn and crit triggers
    # fire in sequence. If it stays high, neither fires again — no spam.
    #
    # Sensors are systemmonitor integration (enabled via the bootstrap
    # script Container Home/setup_ha_server_monitoring.py).
    #
    # Tagging applied via Container Home/tag_ha_server_watchdog.py:
    #   area_id: ha_server
    #   labels:  sys_infrastructure, sev_critical
    # ----------------------------------------------------------------------
    - id: watchdog_ha_host_resource_pressure
      alias: "Watchdog — HA Host Resource Pressure"
      description: >
        Fires on threshold crossings for HA VM disk / memory / swap / CPU /
        15-min load. Pushes to phone and posts a persistent notification.
        Critical thresholds use the same channel — severity is in the title.
      mode: parallel
      max: 10
      triggers:
        - trigger: numeric_state
          entity_id: sensor.system_monitor_disk_usage_config
          above: 80
          for: "00:05:00"
          id: disk_warn
        - trigger: numeric_state
          entity_id: sensor.system_monitor_disk_usage_config
          above: 90
          for: "00:05:00"
          id: disk_crit
        - trigger: numeric_state
          entity_id: sensor.system_monitor_memory_usage
          above: 90
          for: "00:10:00"
          id: memory_warn
        - trigger: numeric_state
          entity_id: sensor.system_monitor_memory_usage
          above: 95
          for: "00:10:00"
          id: memory_crit
        - trigger: numeric_state
          entity_id: sensor.system_monitor_swap_usage
          above: 50
          for: "00:10:00"
          id: swap_warn
        - trigger: numeric_state
          entity_id: sensor.system_monitor_swap_usage
          above: 80
          for: "00:10:00"
          id: swap_crit
        - trigger: numeric_state
          entity_id: sensor.system_monitor_processor_use
          above: 95
          for: "00:15:00"
          id: cpu_warn
        # load_15_min is already a 15-min smoothed average — `for: 5m` is plenty
        - trigger: numeric_state
          entity_id: sensor.system_monitor_load_15_min
          above: 8
          for: "00:05:00"
          id: load_warn
      variables:
        severity:
          disk_warn: "warning"
          disk_crit: "CRITICAL"
          memory_warn: "warning"
          memory_crit: "CRITICAL"
          swap_warn: "warning"
          swap_crit: "warning"
          cpu_warn: "warning"
          load_warn: "warning"
        resource_label:
          disk_warn: "Disk /config usage above 80%"
          disk_crit: "Disk /config usage above 90% — HA at risk of write failures"
          memory_warn: "Memory usage above 90%"
          memory_crit: "Memory usage above 95% — OOM risk"
          swap_warn: "Swap usage above 50% — system under memory pressure"
          swap_crit: "Swap usage above 80% — severe memory pressure"
          cpu_warn: "CPU usage above 95% sustained 15 min"
          load_warn: "15-min load average above 8"
        hint:
          disk_warn: "Free space on /config. Check `docker image prune`, snapshot retention, recorder DB size."
          disk_crit: "Free space on /config immediately. `sdb` (57.7G) is unused — can extend the LV."
          memory_warn: "Restart noisy integrations or HA. Check top consumers via `docker stats`."
          memory_crit: "OOM imminent. Restart HA: `sudo docker restart homeassistant`."
          swap_warn: "Memory pressure. Investigate integration leaks."
          swap_crit: "Severe pressure — restart HA soon."
          cpu_warn: "Likely a stuck integration. Check HA logs for tight loops."
          load_warn: "VM is under sustained load. May need more vCPUs."
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.brenton_s_phone
          data:
            title: "HA host {{ severity[trigger.id] }}: {{ trigger.id }}"
            message: >-
              {{ resource_label[trigger.id] }} ({{ trigger.to_state.state }}{{ trigger.to_state.attributes.unit_of_measurement }}).
              {{ hint[trigger.id] }}
        - action: persistent_notification.create
          data:
            notification_id: "watchdog_ha_host_{{ trigger.id }}"
            title: "HA host {{ severity[trigger.id] }} — {{ trigger.id }}"
            message: >-
              **{{ resource_label[trigger.id] }}**

              Entity: `{{ trigger.entity_id }}` = `{{ trigger.to_state.state }} {{ trigger.to_state.attributes.unit_of_measurement }}` (threshold `{{ trigger.above }}`).

              {{ hint[trigger.id] }}

    # ----------------------------------------------------------------------
    # HA Backup + Database Health Watchdog
    # Fires when automatic backups go stale or the recorder DB grows too big.
    #
    # Backup signal: time since `last_successful_automatic_backup`. If a
    # scheduled backup fails (or didn't run), that timestamp gets stale.
    # 36h = ~one missed day; 72h = sustained problem.
    #
    # DB signal: `sensor.ha_database_size` (command_line above) in MB.
    # Current size as of 2026-05-11 is ~660 MB — thresholds give 3x and 8x
    # headroom before alerting.
    # ----------------------------------------------------------------------
    - id: watchdog_ha_backup_and_database
      alias: "Watchdog — HA Backup & Database Health"
      description: >
        Pages when automatic backups stop succeeding or the recorder DB
        grows past safe thresholds. Single-cross triggers, so no spam if
        a value sits above a threshold.
      mode: parallel
      max: 5
      triggers:
        - trigger: template
          value_template: >-
            {% set s = states('sensor.backup_last_successful_automatic_backup') %}
            {{ s not in ('unknown','unavailable','') and
               (now() - (s | as_datetime)).total_seconds() > 36 * 3600 }}
          for: "00:10:00"
          id: backup_stale_warn
        - trigger: template
          value_template: >-
            {% set s = states('sensor.backup_last_successful_automatic_backup') %}
            {{ s not in ('unknown','unavailable','') and
               (now() - (s | as_datetime)).total_seconds() > 72 * 3600 }}
          for: "00:10:00"
          id: backup_stale_crit
        - trigger: numeric_state
          entity_id: sensor.ha_database_size
          above: 2000
          for: "00:05:00"
          id: db_size_warn
        - trigger: numeric_state
          entity_id: sensor.ha_database_size
          above: 5000
          for: "00:05:00"
          id: db_size_crit
      variables:
        severity:
          backup_stale_warn: "warning"
          backup_stale_crit: "CRITICAL"
          db_size_warn: "warning"
          db_size_crit: "CRITICAL"
        resource_label:
          backup_stale_warn: "Backup last succeeded >36h ago"
          backup_stale_crit: "Backup last succeeded >72h ago — backups are broken"
          db_size_warn: "Recorder DB above 2 GB"
          db_size_crit: "Recorder DB above 5 GB — UI slowdown likely"
        hint:
          backup_stale_warn: "Check Settings → Backups for failed runs and destination disk space."
          backup_stale_crit: "Backups have been failing for 3+ days. Restore-from-backup is your insurance policy — fix this now."
          db_size_warn: "Consider lowering recorder `purge_keep_days` or excluding noisy entities (power-meter telemetry, etc.)."
          db_size_crit: "DB performance will degrade. Lower `purge_keep_days` and run `recorder.purge` service."
      actions:
        - action: notify.send_message
          target:
            entity_id: notify.brenton_s_phone
          data:
            title: "HA {{ severity[trigger.id] }}: {{ trigger.id }}"
            message: >-
              {{ resource_label[trigger.id] }}. {{ hint[trigger.id] }}
        - action: persistent_notification.create
          data:
            notification_id: "watchdog_backup_db_{{ trigger.id }}"
            title: "HA {{ severity[trigger.id] }} — {{ trigger.id }}"
            message: >-
              **{{ resource_label[trigger.id] }}**

              {{ hint[trigger.id] }}

# House-wide power / network outage detection
# ---------------------------------------------------------------------------
# WHY THIS EXISTS (2026-08-04)
# An area power cut took out the tent, the mom-grow area and the house fans at
# 15:15. HA is on a UPS, so it stayed up and watched it happen — but it had no
# concept of "the house lost power". It reported a pile of unrelated-looking
# per-device faults, and the tent banner could only say TENT OFFLINE, which
# points the finger at the tent when the tent is a victim, not a cause.
#
#   sensor.house_offline_witnesses   -> count of power chains unreachable;
#                                       `witnesses` attribute lists them.
#   binary_sensor.house_power_outage -> on when >=3 chains dropped TOGETHER.
#                                       `kind` says POWER vs POWER OR NETWORK.
#
# THE MODEL: CHAINS + SIMULTANEITY (not rooms)
# The signal is >=3 INDEPENDENT POWER CHAINS dropping at the same time.
#
# A chain = a set of devices that cannot fail independently — because they
# share a supply, or share the integration/cloud path that reports them. Each
# chain is worth exactly ONE vote no matter how many entities it owns:
#   * grow-tent-one + grow-tent-two + grow-tent-climate share a supply -> 1 vote
#   * the HS300 strip AND the irrigation ESP32 it powers               -> 1 vote
#   * all 8 Sonoff plugs are ONE vote, so 4 of 8 dropping is still     -> 1 vote
# This is why a single ESP32 dying, taking 26 entities with it, can never trip
# this on its own.
#
# >>> PLANNED CHANGE — SPLIT tent_hs300 WHEN THE ESP32 MOVES <<<
# The irrigation ESP32 is currently powered from an HS300 outlet, so the strip
# and the ESP32 cannot fail independently and share one vote. The user intends
# to move the ESP32 onto its own smart plug. WHEN THAT HAPPENS, split the
# `tent_hs300` chain back into two, in BOTH tables below:
#     ('tent_strip', ['sensor.tp_link_power_strip_c074_voltage'],
#      ['unavailable','unknown']),
#     ('tent_irrig', ['binary_sensor.feed_empty_irrigation_tent'],
#      ['unavailable','unknown']),
# That restores a 6th independent vote. Until then, counting them separately
# would double-count one power source and make a single strip failure look
# like two-thirds of an outage.
#
# The Sonoff grouping is the important one and it is about CORRELATED FAILURE,
# not shared wiring: the 8 plugs are 8 physically separate devices, but they
# report through one integration and one cloud/LAN path, so a Sonoff outage
# drops all of them at once for reasons that have nothing to do with power.
# Before they were grouped, HLG, Chilled, the AC circulation fan and the duct
# fan were four independent votes — a single Sonoff hiccup would have cleared
# the 3-chain threshold on its own and cried outage. Now it is one vote and
# cannot.
#
# Of the 8, PC and Prusa are fed FROM THE UPS, so they never drop in a power
# cut and never actually cast the vote — but that is exactly what makes them
# the sharpest POWER-vs-NETWORK test in the system (see the binary_sensor).
#
# Rooms/areas were deliberately REMOVED from the test (they were in the first
# cut of this file). Chunks of the smart house get unplugged when not in use,
# so "devices in N rooms are offline" is a normal resting state here, not an
# event. SIMULTANEITY is what separates the two: something unplugged last week
# carries a week-old timestamp and will never cluster with a live event.
#
# WITNESS SELECTION
# Chains were checked against 7 days of recorder history — every member below
# was >=94% available. Flakier entities generate false alarms:
# media_player.loft_tv was rejected at 61.6% because the TV sleeps.
#
# The `bad` list is per CHAIN, so every member of a chain must agree on what
# "dead" looks like. That is why the HS300 is represented by its VOLTAGE sensor
# rather than binary_sensor.*_cloud_connection: the cloud sensor needs 'off' in
# its bad list, but 'off' on its chain-mate binary_sensor.feed_empty_irrigation_tent
# is a perfectly normal reading (device_class moisture — 'on' means liquid
# PRESENT), so a shared 'off' would have silently marked a healthy ESP32 dead.
# Voltage simply goes unavailable when the strip loses power, which is exactly
# the question being asked, and needs no special case.
#
# A CHAIN MUST BE ON UNPROTECTED MAINS. Anything on the UPS cannot witness a
# power cut — it stays up by design, so it can never report the event, and if
# it ever DOES drop (unplugged, powered off) it casts a bogus vote. Currently
# on UPS, and therefore permanently ineligible:
#   * both PCs + displays
#   * the Brentons WiFi router
#   * both 3D printers   <- switch.bambu was a witness briefly, removed 08-04
# During an area outage the house also runs a generator, but it feeds only a
# few isolated outlets and none of the grow equipment is on them.
#
# WHAT STOPS AN HA RESTART FAKING AN OUTAGE
# This is the classic false positive and it is why the code looks paranoid:
# after a restart EVERY entity carries last_changed = restart time, so the
# whole house looks like it dropped in the same instant. That is exactly what
# made the 08-04 banner mis-date the outage as 15:50 (the restart) instead of
# 15:15 (the truth). Three guards:
#   1. grace        - a chain must be dead OFFLINE_GRACE_S continuously before
#                     it counts, so reboots and OTA flashes never qualify.
#   2. restart blind - a chain whose drop-time sits within RESTART_BLIND_S of
#                     the last HA start is IGNORED for clustering. Its true
#                     onset is unknowable, so it is not evidence of simultaneity.
#   3. start guard  - suppressed entirely for START_GRACE_S after HA boots.
#
# now() in the templates makes HA re-render every minute, which is what lets
# the grace periods expire without anything else changing state.
# ---------------------------------------------------------------------------
system_power_outage:

  input_datetime:
    # Stamped by the automation below on every HA start. Used by the restart
    # blind spot + start guard. Its initial value is deliberately ancient so a
    # fresh install fails OPEN (detector active) rather than silently muted.
    ha_last_start:
      name: "HA Last Start"
      icon: mdi:restart
      has_date: true
      has_time: true
      initial: "2000-01-01 00:00:00"

  template:
    - sensor:
        # ------------------------------------------------------------------
        # How many power chains are unreachable right now.
        #
        # A chain's `ts` is the MOST RECENT drop among its dead members, not
        # the earliest: that answers "when did something in this chain go
        # down", which is what clustering needs. Using the earliest would let
        # one long-unplugged member anchor the whole chain in the past and
        # hide a live event.
        #
        # NOTE the chain table is written twice, once for the state (count)
        # and once for the `witnesses` attribute (the detail). Keep them in
        # sync. It is NOT safe to have the state read state_attr() of its own
        # `witnesses`: HA renders state before attributes, so a self-reference
        # serves the PREVIOUS render and the count trails the list by one
        # update. Cross-entity reads (the binary_sensor below) are fine.
        # ------------------------------------------------------------------
        - name: "House Offline Witnesses"
          unique_id: house_offline_witnesses
          icon: mdi:transmission-tower-off
          state: >
            {% set grace = 180 %}
            {% set chains = [
                 ('tent_esps',    ['sensor.tent_grow_tent_one_wifi_signal',
                                   'sensor.tent_grow_tent_two_wifi_signal',
                                   'sensor.grow_tent_climate_canopy_temperature'],
                  ['unavailable','unknown']),
                 ('tent_hs300',   ['sensor.tp_link_power_strip_c074_voltage',
                                   'binary_sensor.feed_empty_irrigation_tent'],
                  ['unavailable','unknown']),
                 ('sonoff_plugs', ['switch.hlg','switch.chilled',
                                   'switch.ac_circulation_fan',
                                   'switch.circulation_fans',
                                   'switch.duct_fan','switch.controller_tent',
                                   'switch.pc','switch.prusa'],
                  ['unavailable','unknown']),
                 ('mom_grow',     ['switch.mom_grow_1','switch.mom_grow_lights'],
                  ['unavailable','unknown']),
                 ('kasa_outdoor', ['switch.kasa_smart_outdoor_plug_switch_1',
                                   'switch.kasa_smart_outdoor_plug_switch_2'],
                  ['unavailable','unknown'])
               ] %}
            {% set ns = namespace(n=0) %}
            {% for key, ents, bad in chains %}
              {% set g = namespace(dead=0) %}
              {% for e in ents %}
                {% set st = states[e] %}
                {% if st is not none and st.state in bad
                      and (now() - st.last_changed).total_seconds() >= grace %}
                  {% set g.dead = g.dead + 1 %}
                {% endif %}
              {% endfor %}
              {% if g.dead > 0 %}{% set ns.n = ns.n + 1 %}{% endif %}
            {% endfor %}
            {{ ns.n }}
          attributes:
            witnesses: >
              {% set grace = 180 %}
              {% set chains = [
                   ('tent_esps',    'Tent ESP trio (one/two/climate)',
                    ['sensor.tent_grow_tent_one_wifi_signal',
                     'sensor.tent_grow_tent_two_wifi_signal',
                     'sensor.grow_tent_climate_canopy_temperature'],
                    ['unavailable','unknown']),
                   ('tent_hs300',   'HS300 strip + irrigation ESP32',
                    ['sensor.tp_link_power_strip_c074_voltage',
                     'binary_sensor.feed_empty_irrigation_tent'],
                    ['unavailable','unknown']),
                   ('sonoff_plugs', 'Sonoff plug set (8)',
                    ['switch.hlg','switch.chilled',
                     'switch.ac_circulation_fan','switch.circulation_fans',
                     'switch.duct_fan','switch.controller_tent',
                     'switch.pc','switch.prusa'],
                    ['unavailable','unknown']),
                   ('mom_grow',     'Mom-grow Kasa plug pair',
                    ['switch.mom_grow_1','switch.mom_grow_lights'],
                    ['unavailable','unknown']),
                   ('kasa_outdoor', 'Irrigation multi-plug (Kasa outdoor)',
                    ['switch.kasa_smart_outdoor_plug_switch_1',
                     'switch.kasa_smart_outdoor_plug_switch_2'],
                    ['unavailable','unknown'])
                 ] %}
              {% set ns = namespace(off=[]) %}
              {% for key, label, ents, bad in chains %}
                {% set g = namespace(dead=[], ts=0) %}
                {% for e in ents %}
                  {% set st = states[e] %}
                  {% if st is not none and st.state in bad
                        and (now() - st.last_changed).total_seconds() >= grace %}
                    {% set g.dead = g.dead + [e] %}
                    {% set t = st.last_changed.timestamp() %}
                    {% set g.ts = [g.ts, t] | max %}
                  {% endif %}
                {% endfor %}
                {% if g.dead | length > 0 %}
                  {% set ns.off = ns.off + [{
                       'key': key, 'label': label,
                       'members': g.dead | length, 'ts': g.ts,
                       'since': (g.ts | as_datetime | as_local).strftime('%H:%M')
                     }] %}
                {% endif %}
              {% endfor %}
              {{ ns.off }}

    - binary_sensor:
        # ------------------------------------------------------------------
        # On when >=3 chains dropped within SIMUL_WINDOW_S of each other.
        #
        # Finds the largest cluster of chains sharing a drop-time, rather than
        # just counting chains that are down. That is the whole point: eight
        # chains down at eight different times over three weeks is a house
        # with things unplugged; three chains down in the same two minutes is
        # an outage.
        #
        # POWER vs POWER OR NETWORK, from two independent references that ride
        # out a mains cut:
        #
        #   1. switch.pc + switch.prusa are Sonoff plugs fed FROM THE UPS. They
        #      are the sharpest test available, because they share vendor,
        #      integration, cloud path and WiFi with the six mains Sonoff plugs
        #      and differ ONLY in power source. Six dead while these two report
        #      cannot be the Sonoff integration or the network — it is power.
        #      (Confirmed on the 08-04 outage: exactly that split.)
        #   2. The Blink tent cameras are battery powered but cloud connected,
        #      so they also prove the network and internet are still up.
        #
        # Either alive -> POWER. Both dark -> POWER OR NETWORK: something bigger
        # (modem/ISP down, or the UPS has run flat), and the two are not
        # distinguishable from inside HA, hence the deliberately vague label.
        # The Brentons router is itself on the UPS, so WiFi surviving a cut is
        # the EXPECTED case — which is what makes a POWER verdict trustworthy.
        # ------------------------------------------------------------------
        - name: "House Power Outage"
          unique_id: house_power_outage
          device_class: problem
          icon: mdi:flash-off
          state: >
            {% set min_chains = 3 %}
            {% set window = 180 %}
            {% set start_grace = 300 %}
            {% set blind = 90 %}
            {% set w = state_attr('sensor.house_offline_witnesses','witnesses') or [] %}
            {# input_datetime stores LOCAL time; as_timestamp() on its raw string
               misparses it as UTC. Its own `timestamp` attribute is already a
               correct epoch — use that, never the state string. #}
            {% set started = state_attr('input_datetime.ha_last_start','timestamp') | float(0) %}
            {% set ns = namespace(c=[]) %}
            {% for x in w %}
              {% if ((x.ts - started) | abs) > blind %}{% set ns.c = ns.c + [x.ts] %}{% endif %}
            {% endfor %}
            {% set best = namespace(n=0) %}
            {% for a in ns.c %}
              {% set g = namespace(n=0) %}
              {% for b in ns.c %}
                {% if ((b - a) | abs) <= window %}{% set g.n = g.n + 1 %}{% endif %}
              {% endfor %}
              {% if g.n > best.n %}{% set best.n = g.n %}{% endif %}
            {% endfor %}
            {{ best.n >= min_chains
               and (now().timestamp() - started) >= start_grace }}
          attributes:
            kind: >
              {# Two independent references that survive a mains cut. Either one
                 alive means the drop was about power, not connectivity. #}
              {% set refs = ['sensor.temperature_camera_tent_1',
                             'sensor.temperature_camera_tent_2',
                             'sensor.temperature_camera_tent_overhead',
                             'switch.pc','switch.prusa'] %}
              {% set ns = namespace(up=0) %}
              {% for c in refs %}
                {% if states(c) not in ['unavailable','unknown','none'] %}
                  {% set ns.up = ns.up + 1 %}
                {% endif %}
              {% endfor %}
              {{ 'POWER' if ns.up > 0 else 'POWER OR NETWORK' }}
            # Chains in the largest simultaneous cluster — the ones that make
            # up the actual event, as opposed to everything merely offline.
            chains: >
              {% set window = 180 %}
              {% set blind = 90 %}
              {% set w = state_attr('sensor.house_offline_witnesses','witnesses') or [] %}
              {% set started = state_attr('input_datetime.ha_last_start','timestamp') | float(0) %}
              {% set ns = namespace(c=[]) %}
              {% for x in w %}
                {% if ((x.ts - started) | abs) > blind %}{% set ns.c = ns.c + [x] %}{% endif %}
              {% endfor %}
              {% set best = namespace(n=0, m=[]) %}
              {% for a in ns.c %}
                {% set g = namespace(m=[]) %}
                {% for b in ns.c %}
                  {% if ((b.ts - a.ts) | abs) <= window %}{% set g.m = g.m + [b] %}{% endif %}
                {% endfor %}
                {% if g.m | length > best.n %}{% set best.n = g.m | length %}{% set best.m = g.m %}{% endif %}
              {% endfor %}
              {{ best.n }}
            since: >
              {% set window = 180 %}
              {% set blind = 90 %}
              {% set w = state_attr('sensor.house_offline_witnesses','witnesses') or [] %}
              {% set started = state_attr('input_datetime.ha_last_start','timestamp') | float(0) %}
              {% set ns = namespace(c=[]) %}
              {% for x in w %}
                {% if ((x.ts - started) | abs) > blind %}{% set ns.c = ns.c + [x] %}{% endif %}
              {% endfor %}
              {% set best = namespace(n=0, m=[]) %}
              {% for a in ns.c %}
                {% set g = namespace(m=[]) %}
                {% for b in ns.c %}
                  {% if ((b.ts - a.ts) | abs) <= window %}{% set g.m = g.m + [b] %}{% endif %}
                {% endfor %}
                {% if g.m | length > best.n %}{% set best.n = g.m | length %}{% set best.m = g.m %}{% endif %}
              {% endfor %}
              {{ (best.m | map(attribute='ts') | min | as_datetime | as_local).strftime('%H:%M')
                 if best.n > 0 else 'n/a' }}
            detail: >
              {% set window = 180 %}
              {% set blind = 90 %}
              {% set w = state_attr('sensor.house_offline_witnesses','witnesses') or [] %}
              {% set started = state_attr('input_datetime.ha_last_start','timestamp') | float(0) %}
              {% set ns = namespace(c=[]) %}
              {% for x in w %}
                {% if ((x.ts - started) | abs) > blind %}{% set ns.c = ns.c + [x] %}{% endif %}
              {% endfor %}
              {% set best = namespace(n=0, m=[]) %}
              {% for a in ns.c %}
                {% set g = namespace(m=[]) %}
                {% for b in ns.c %}
                  {% if ((b.ts - a.ts) | abs) <= window %}{% set g.m = g.m + [b] %}{% endif %}
                {% endfor %}
                {% if g.m | length > best.n %}{% set best.n = g.m | length %}{% set best.m = g.m %}{% endif %}
              {% endfor %}
              {{ best.m | map(attribute='label') | join(', ') }}

  automation:
    # ----------------------------------------------------------------------
    # Stamp HA's start time. Without it the restart blind spot and the start
    # guard cannot work, and a restart reads as a house-wide simultaneous drop.
    # ----------------------------------------------------------------------
    - id: power_outage_stamp_ha_start
      alias: "Power Outage — Stamp HA Start Time"
      description: >
        Records when HA last booted into input_datetime.ha_last_start, so
        outage detection can ignore drop-times that are really just the
        restart re-stamping every entity.
      mode: single
      triggers:
        - trigger: homeassistant
          event: start
      actions:
        - action: input_datetime.set_datetime
          target:
            entity_id: input_datetime.ha_last_start
          data:
            datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"

    # ----------------------------------------------------------------------
    # Announce the outage once, and announce recovery once. Deliberately not
    # per-device: the whole point is that this is ONE event.
    # ----------------------------------------------------------------------
    - id: power_outage_detected
      alias: "Power Outage — Detected"
      description: >
        Fires when 3+ independent power chains drop within minutes of each
        other. HA runs on a UPS, so it survives the cut and can report it.
      mode: single
      triggers:
        - trigger: state
          entity_id: binary_sensor.house_power_outage
          from: "off"
          to: "on"
      actions:
        - variables:
            kind: "{{ state_attr('binary_sensor.house_power_outage','kind') }}"
            since: "{{ state_attr('binary_sensor.house_power_outage','since') }}"
            chains: "{{ state_attr('binary_sensor.house_power_outage','chains') }}"
            detail: "{{ state_attr('binary_sensor.house_power_outage','detail') }}"
        - action: notify.send_message
          target:
            entity_id: notify.brenton_s_phone
          data:
            title: "{{ kind }} OUTAGE"
            message: >-
              {{ chains }} separate power chains dropped together at
              {{ since }}: {{ detail }}. HA is on UPS and still up. Readings
              from these systems are stale and are not being alerted on.
        - action: persistent_notification.create
          data:
            notification_id: house_power_outage
            title: "{{ kind }} OUTAGE — since {{ since }}"
            message: >-
              **{{ chains }} separate power chains** dropped together at
              **{{ since }}**.

              {{ detail }}

              Treat this as one event, not several faults. Per-device errors
              from these systems are suppressed until they come back.

    - id: power_outage_cleared
      alias: "Power Outage — Cleared"
      description: Fires when the simultaneous-drop pattern has resolved.
      mode: single
      triggers:
        - trigger: state
          entity_id: binary_sensor.house_power_outage
          from: "on"
          to: "off"
      actions:
        - action: persistent_notification.dismiss
          data:
            notification_id: house_power_outage
        - action: notify.send_message
          target:
            entity_id: notify.brenton_s_phone
          data:
            title: "Power restored"
            message: >-
              The simultaneous-outage pattern cleared as of
              {{ now().strftime('%H:%M') }}. Check that pumps, lights and the
              feed schedule resumed as expected.

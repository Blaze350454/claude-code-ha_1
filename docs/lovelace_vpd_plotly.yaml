# VPD Status — plotly-graph-card
#
# Lovelace card YAML. Paste into Edit Dashboard → Add Card → Manual.
# Requires HACS dbuezas/lovelace-plotly-graph-card (custom repo).
#
# X axis = temp (°C), Y axis = RH (%). Plots:
#   - Green curve: (T, RH) combos that yield the active VPD target.
#   - Two dashed orange curves: target ± vpd_tolerance with a soft green
#     band filling between them = "in target zone".
#   - Grey dotted crosshair: current temp (vertical) + current RH (horizontal).
#   - Big red dot: current (T, RH) point.
#
# Implementation notes for future tweaks:
#   - layout.xaxis.type: linear is REQUIRED. Without it plotly auto-detects
#     and treats x values as Unix timestamps (curves stack as if on a
#     timeline, x-axis labels say "20:00:00 Dec 31").
#   - entity: '' on every trace skips history fetching. With a real entity
#     bound, plotly-graph-card iterates the entity's history samples and
#     calls $fn once per sample, drawing one curve per past state — you
#     get visible "ghost" copies of every curve.
#   - refresh_interval drives all updates; 30s is fine for tent climate.

type: custom:plotly-graph
title: VPD Status
refresh_interval: 30
hours_to_show: 0
ha_theme: false

layout:
  height: 460
  paper_bgcolor: '#1c1c1e'
  plot_bgcolor: '#1c1c1e'
  font:
    color: '#e6e6e6'
  margin:
    t: 30
    r: 20
    b: 80
    l: 70
  xaxis:
    type: linear
    title: Temperature (°C)
    range: [15, 35]
    dtick: 2
    gridcolor: '#3a3a3a'
    zeroline: false
    showspikes: false
    fixedrange: true
  yaxis:
    type: linear
    title: Relative Humidity (%)
    range: [30, 90]
    dtick: 10
    gridcolor: '#3a3a3a'
    zeroline: false
    showspikes: false
    fixedrange: true
  showlegend: true
  legend:
    orientation: h
    y: 1.08
    x: 0
    bgcolor: rgba(0,0,0,0)
  hovermode: closest
  annotations:
    # Stage + active VPD target badge, top-left inside the plot
    - xref: paper
      yref: paper
      x: 0.02
      y: 0.98
      xanchor: left
      yanchor: top
      showarrow: false
      bgcolor: 'rgba(28,28,30,0.75)'
      bordercolor: '#3a3a3a'
      borderwidth: 1
      borderpad: 6
      font:
        color: '#30d158'
        size: 12
      text: |
        $ex 'Stage: ' + hass.states['input_select.grow_tent_growth_stage'].state + '  •  Target: ' + parseFloat(hass.states['sensor.active_vpd_target'].state).toFixed(2) + ' kPa'

entities:
  # 1) Target VPD curve (drawn first — band traces will fill relative to this)
  - entity: ''
    name: Target VPD
    mode: lines
    line:
      color: '#30d158'
      width: 3
    x: |
      $fn ({hass}) => {
        const xs = [];
        for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
        return xs;
      }
    "y": |
      $fn ({hass}) => {
        const target = parseFloat(hass.states['sensor.active_vpd_target']?.state);
        if (isNaN(target)) return [];
        const ys = [];
        for (let t = 15; t <= 35.01; t += 0.25) {
          const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
          ys.push(100 * (1 - target / svp));
        }
        return ys;
      }

  # 2) Upper tolerance — drier, LOWER RH curve (drawn before lower so the
  #    band trace can fill upward to the lower-tolerance curve)
  - entity: ''
    name: '+ tol'
    mode: lines
    line:
      color: '#ff9500'
      width: 1
      dash: dash
    x: |
      $fn ({hass}) => {
        const xs = [];
        for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
        return xs;
      }
    "y": |
      $fn ({hass}) => {
        const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
        const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
        if (isNaN(tgt) || isNaN(tol)) return [];
        const v = tgt + tol;
        const ys = [];
        for (let t = 15; t <= 35.01; t += 0.25) {
          const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
          ys.push(100 * (1 - v / svp));
        }
        return ys;
      }

  # 3) Lower tolerance — wetter, HIGHER RH curve, fills DOWN to trace #2
  #    creating the green target band between the two tolerance curves
  - entity: ''
    name: '− tol'
    mode: lines
    line:
      color: '#ff9500'
      width: 1
      dash: dash
    fill: tonexty
    fillcolor: 'rgba(48,209,88,0.10)'
    x: |
      $fn ({hass}) => {
        const xs = [];
        for (let t = 15; t <= 35.01; t += 0.25) xs.push(t);
        return xs;
      }
    "y": |
      $fn ({hass}) => {
        const tgt = parseFloat(hass.states['sensor.active_vpd_target']?.state);
        const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
        if (isNaN(tgt) || isNaN(tol)) return [];
        const v = Math.max(0.05, tgt - tol);
        const ys = [];
        for (let t = 15; t <= 35.01; t += 0.25) {
          const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
          ys.push(100 * (1 - v / svp));
        }
        return ys;
      }

  # 4) Vertical crosshair @ current temp
  - entity: ''
    name: T
    mode: lines
    showlegend: false
    line:
      color: '#888'
      width: 1
      dash: dot
    x: |
      $fn ({hass}) => {
        const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
        return isNaN(t) ? [] : [t, t];
      }
    "y": |
      $fn ({hass}) => [30, 90]

  # 5) Horizontal crosshair @ current RH
  - entity: ''
    name: RH
    mode: lines
    showlegend: false
    line:
      color: '#888'
      width: 1
      dash: dot
    x: |
      $fn ({hass}) => [15, 35]
    "y": |
      $fn ({hass}) => {
        const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
        return isNaN(r) ? [] : [r, r];
      }

  # 6) Current (T, RH) point — big red dot, drawn last so it sits on top
  - entity: ''
    name: Now
    mode: markers
    marker:
      color: '#ff3b30'
      size: 18
      line:
        color: '#ffffff'
        width: 2
    x: |
      $fn ({hass}) => {
        const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
        return isNaN(t) ? [] : [t];
      }
    "y": |
      $fn ({hass}) => {
        const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
        return isNaN(r) ? [] : [r];
      }

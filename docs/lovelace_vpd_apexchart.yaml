# VPD Status — ApexCharts card
#
# Lovelace card YAML. Paste into Edit Dashboard → Add Card → Manual.
# Requires HACS apexcharts-card.
#
# What it shows:
#   - Big red marker at (current tent temp, current tent RH).
#   - Green curve = the (Temp, RH) combo that would yield the active VPD target.
#   - Two orange dashed curves = target ± vpd_tolerance band; in-band means
#     you're between them.
#   - Faint grey crosshair lines pin the current point on both axes.
#
# Tuning ideas (tell me if you want any of these):
#   - Wider/narrower temp range (currently 15–35 °C, RH 30–90 %).
#   - Hue per growth stage instead of one green curve (multiple targets).
#   - Range-area fill between the two tolerance curves.
#   - Stage-tinted background bands using xaxis annotations.

type: custom:apexcharts-card
header:
  show: true
  show_states: true
  colorize_states: true
  title: VPD Status
chart_type: line
graph_span: 1m
update_interval: 30s

apex_config:
  chart:
    height: 420
    animations:
      enabled: false
    toolbar:
      show: false
    zoom:
      enabled: false
  xaxis:
    type: numeric
    min: 15
    max: 35
    tickAmount: 10
    decimalsInFloat: 1
    title:
      text: Temperature (°C)
    labels:
      formatter: |
        EVAL:function(v){return v.toFixed(1) + '°';}
  yaxis:
    min: 30
    max: 90
    tickAmount: 6
    decimalsInFloat: 0
    title:
      text: Relative Humidity (%)
    labels:
      formatter: |
        EVAL:function(v){return v.toFixed(0) + '%';}
  legend:
    position: top
    fontSize: '12px'
  stroke:
    width: [0, 3, 1, 1, 1, 1]
    curve: smooth
    dashArray: [0, 0, 4, 4, 2, 2]
  markers:
    size: [12, 0, 0, 0, 0, 0]
    strokeWidth: 2
    strokeColors: '#ffffff'
  grid:
    borderColor: '#404040'
    strokeDashArray: 2
  tooltip:
    enabled: true
    shared: false
    intersect: true
    x:
      formatter: |
        EVAL:function(v){return v.toFixed(1) + ' °C';}
    "y":
      formatter: |
        EVAL:function(v){return v.toFixed(1) + ' %';}

series:
  # ---- 1) Current temp/RH point — big red marker ---------------------------
  - entity: sensor.grow_tent_vpd
    name: Now
    type: line
    stroke_width: 0
    color: '#ff3b30'
    show:
      legend_value: true
      in_header: true
      header_color_threshold: false
    data_generator: |
      const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
      const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
      if (isNaN(t) || isNaN(r)) return [];
      return [[t, r]];

  # ---- 2) Target VPD curve -------------------------------------------------
  - entity: sensor.active_vpd_target
    name: Target VPD
    type: line
    color: '#30d158'
    show:
      legend_value: true
      in_header: true
    data_generator: |
      const target = parseFloat(hass.states['sensor.active_vpd_target']?.state);
      if (isNaN(target)) return [];
      const pts = [];
      for (let t = 15; t <= 35.01; t += 0.25) {
        const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
        const rh = 100 * (1 - target / svp);
        if (rh >= 0 && rh <= 100) pts.push([t, rh]);
      }
      return pts;

  # ---- 3) Upper VPD tolerance (drier — lower RH curve) --------------------
  - entity: input_number.vpd_tolerance
    name: '+ tol'
    type: line
    color: '#ff9500'
    show:
      legend_value: false
      in_header: false
    data_generator: |
      const target = parseFloat(hass.states['sensor.active_vpd_target']?.state);
      const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
      if (isNaN(target) || isNaN(tol)) return [];
      const v = target + tol;
      const pts = [];
      for (let t = 15; t <= 35.01; t += 0.25) {
        const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
        const rh = 100 * (1 - v / svp);
        if (rh >= 0 && rh <= 100) pts.push([t, rh]);
      }
      return pts;

  # ---- 4) Lower VPD tolerance (wetter — higher RH curve) ------------------
  - entity: input_number.vpd_tolerance
    name: '− tol'
    type: line
    color: '#ff9500'
    show:
      legend_value: false
      in_header: false
    data_generator: |
      const target = parseFloat(hass.states['sensor.active_vpd_target']?.state);
      const tol = parseFloat(hass.states['input_number.vpd_tolerance']?.state);
      if (isNaN(target) || isNaN(tol)) return [];
      const v = Math.max(0.05, target - tol);
      const pts = [];
      for (let t = 15; t <= 35.01; t += 0.25) {
        const svp = 0.61078 * Math.exp((17.27 * t) / (t + 237.3));
        const rh = 100 * (1 - v / svp);
        if (rh >= 0 && rh <= 100) pts.push([t, rh]);
      }
      return pts;

  # ---- 5) Vertical crosshair @ current temp -------------------------------
  - entity: sensor.tent_average_temperature
    name: T
    type: line
    color: '#888888'
    show:
      legend_value: false
      in_header: false
    data_generator: |
      const t = parseFloat(hass.states['sensor.tent_average_temperature']?.state);
      if (isNaN(t)) return [];
      return [[t, 0], [t, 100]];

  # ---- 6) Horizontal crosshair @ current RH -------------------------------
  - entity: sensor.tent_average_humidity
    name: RH
    type: line
    color: '#888888'
    show:
      legend_value: false
      in_header: false
    data_generator: |
      const r = parseFloat(hass.states['sensor.tent_average_humidity']?.state);
      if (isNaN(r)) return [];
      return [[15, r], [35, r]];

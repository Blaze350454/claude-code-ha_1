alias: Grow Lights Controller with Transition
description: Complete grow light automation with veg/flower/transition modes

# Multiple triggers for different scenarios
trigger:
  # Check every minute if lights should be on or off
  - platform: time_pattern
    minutes: "/1"
    id: "check_lights"

  # Trigger when growth stage changes
  - platform: state
    entity_id: input_select.growth_stage
    id: "stage_change"

  # Trigger when lights turn off (for transition management)
  - platform: state
    entity_id: light.chilled
    to: "off"
    id: "light_off"

variables:
  # Get current growth stage
  current_stage: "{{ states('input_select.growth_stage') }}"

  # Get current transition day
  transition_day: "{{ states('input_number.transition_day_counter') | int }}"

  # Get appropriate times based on growth stage
  on_time: >
    {% if current_stage in ['Vegetative', 'Transition'] %}
      {{ states('input_datetime.veg_lights_on_time') }}
    {% else %}
      {{ states('input_datetime.flower_lights_on_time') }}
    {% endif %}

  off_time: >
    {% if current_stage in ['Vegetative', 'Transition'] %}
      {{ states('input_datetime.veg_lights_off_time') }}
    {% else %}
      {{ states('input_datetime.flower_lights_off_time') }}
    {% endif %}

  # Determine if lights should be on (handles midnight crossover)
  lights_should_be_on: >
    {% set on_minutes = (on_time.split(':')[0] | int * 60) + (on_time.split(':')[1] | int) %}
    {% set off_minutes = (off_time.split(':')[0] | int * 60) + (off_time.split(':')[1] | int) %}
    {% set current_minutes = now().hour * 60 + now().minute %}
    {% if on_minutes < off_minutes %}
      {{ current_minutes >= on_minutes and current_minutes < off_minutes }}
    {% else %}
      {{ current_minutes >= on_minutes or current_minutes < off_minutes }}
    {% endif %}

action:
  - choose:
      ##########################################################
      # SCENARIO 1: Handle transition when lights turn off
      ##########################################################
      - conditions:
          - condition: trigger
            id: "light_off"
          - condition: state
            entity_id: input_select.growth_stage
            state: "Transition"
          # Both lights must be off
          - condition: state
            entity_id: light.chilled
            state: "off"
          - condition: state
            entity_id: light.hlg
            state: "off"
        sequence:
          - variables:
              current_off_time: "{{ states('input_datetime.veg_lights_off_time') }}"
              current_hour: "{{ current_off_time.split(':')[0] | int }}"
              current_minute: "{{ current_off_time.split(':')[1] | int }}"
              new_hour: "{{ (current_hour - 1) % 24 }}"
              new_off_time: "{{ '%02d:%02d:00' | format(new_hour, current_minute) }}"

          - choose:
              # Still transitioning (days 0-5)
              - conditions:
                  - condition: template
                    value_template: "{{ transition_day < 6 }}"
                sequence:
                  # Increment transition day
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.transition_day_counter
                    data:
                      value: "{{ transition_day + 1 }}"

                  # Move off time 1 hour earlier
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.veg_lights_off_time
                    data:
                      time: "{{ new_off_time }}"

                  # Send notification
                  - service: persistent_notification.create
                    data:
                      title: "Grow Lights Transition"
                      message: >
                        Day {{ transition_day + 1 }} of 6 complete.
                        New schedule: {{ states('input_datetime.veg_lights_on_time') }} to {{ new_off_time }}
                        ({{ 18 - (transition_day + 1) }} hours on)

              # Transition complete (day 6)
              - conditions:
                  - condition: template
                    value_template: "{{ transition_day >= 6 }}"
                sequence:
                  # Switch to Flower mode
                  - service: input_select.select_option
                    target:
                      entity_id: input_select.growth_stage
                    data:
                      option: "Flower"

                  # Reset counter
                  - service: input_number.set_value
                    target:
                      entity_id: input_number.transition_day_counter
                    data:
                      value: 0

                  # Reset veg off time to original
                  - service: input_datetime.set_datetime
                    target:
                      entity_id: input_datetime.veg_lights_off_time
                    data:
                      time: "12:00:00"

                  # Send completion notification
                  - service: persistent_notification.create
                    data:
                      title: "Grow Lights Transition Complete"
                      message: >
                        Transition complete! Now in Flower mode with 12/12 light schedule.

      ##########################################################
      # SCENARIO 2: Normal light control (check_lights or stage_change)
      ##########################################################
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: "check_lights"
              - condition: trigger
                id: "stage_change"
        sequence:
          - choose:
              # Turn lights ON
              - conditions:
                  - condition: template
                    value_template: "{{ lights_should_be_on }}"
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: light.chilled
                        state: "off"
                      - condition: state
                        entity_id: light.hlg
                        state: "off"
                sequence:
                  - service: light.turn_on
                    target:
                      entity_id:
                        - light.chilled
                        - light.hlg
                    data:
                      brightness_pct: 100

              # Turn lights OFF
              - conditions:
                  - condition: template
                    value_template: "{{ not lights_should_be_on }}"
                  - condition: or
                    conditions:
                      - condition: state
                        entity_id: light.chilled
                        state: "on"
                      - condition: state
                        entity_id: light.hlg
                        state: "on"
                sequence:
                  - service: light.turn_off
                    target:
                      entity_id:
                        - light.chilled
                        - light.hlg

mode: queued
max: 5
